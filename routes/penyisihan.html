<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS 2.0 Game Board - Penyisihan</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,300;0,400;0,600;1,400&display=swap"
        rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        poppins: ['Poppins', 'sans-serif']
                    },
                    animation: {
                        'shake': 'shake 0.4s ease-in-out',
                        'pulse-danger': 'pulse-danger 0.5s infinite',
                        'glow-pulse': 'glow-pulse 6s ease-in-out infinite',
                        'rotate-counter': 'rotate-counter 12s linear infinite',
                        'rotate-counter-fast': 'rotate-counter 6s linear infinite'
                    },
                    keyframes: {
                        shake: {
                            '0%, 100%': { transform: 'translateX(0)' },
                            '20%, 60%': { transform: 'translateX(-4px)' },
                            '40%, 80%': { transform: 'translateX(4px)' }
                        },
                        'pulse-danger': {
                            '0%, 100%': { transform: 'scale(1)' },
                            '50%': { transform: 'scale(1.05)' }
                        },
                        'glow-pulse': {
                            '0%, 100%': { transform: 'scale(1)' },
                            '50%': { transform: 'scale(1.1)' }
                        },
                        'rotate-counter': {
                            'from': { transform: 'rotate(0deg)' },
                            'to': { transform: 'rotate(-360deg)' }
                        }
                    }
                }
            }
        }
    </script>

    <style>
        /* Sembunyikan panah atas/bawah di input number */
        input[type=number]::-webkit-inner-spin-button,
        input[type=number]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type=number] {
            -moz-appearance: textfield; /* Untuk Firefox */
        }
        /* Pastikan body mengisi tinggi layar */
        html, body {
            height: 100%;
        }
    </style>
</head>

<body class="min-h-screen bg-black font-poppins overflow-hidden flex flex-col">
    <div class="fixed inset-0 opacity-5 pointer-events-none"
        style="background: linear-gradient(90deg, white 1px, transparent 1px), linear-gradient(white 1px, transparent 1px); background-size: 10px 10px;">
    </div>

    <div class="fixed top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[500px] h-[500px] pointer-events-none z-0">
        <div class="absolute w-[500px] h-[500px] rounded-full animate-rotate-counter">
            <div
                class="absolute w-[120px] h-[120px] rounded-full bg-red-500/50 shadow-[0_0_80px_40px_rgba(239,68,68,0.4),0_0_200px_100px_rgba(239,68,68,0.4)] animate-glow-pulse">
            </div>
        </div>
        <div class="absolute w-[300px] h-[300px] top-[100px] left-[100px] rounded-full animate-rotate-counter-fast">
            <div
                class="absolute w-[120px] h-[120px] rounded-full bg-blue-500/50 shadow-[0_0_80px_40px_rgba(59,130,246,0.4),0_0_200px_100px_rgba(59,130,246,0.4)] animate-glow-pulse">
            </div>
        </div>
    </div>

    <dialog id="q-dialog"
        class="rounded-2xl p-0 backdrop:bg-black/50 bg-white/90 opacity-0 shadow-2xl fixed transition-all duration-300 border-0">
        <form method="dialog" class="min-w-[60rem] max-w-[90vw] rounded-2xl">
            <header class="px-6 py-4 text-center border-b border-gray-200">
                <h3 class="font-bold text-2xl font-poppins text-gray-800">Pertanyaan</h3>
            </header>

            <section class="px-6 py-6 text-center min-h-[120px] flex items-center justify-center">
                <blockquote id="q-text" class="italic text-lg text-gray-700 font-poppins leading-relaxed">"Soal tidak
                    terdeteksi"</blockquote>
            </section>

            <div class="flex items-center justify-center mb-6 gap-3 px-6">
                <button type="button" id="start-timer-btn"
                    class="px-5 py-2.5 bg-gradient-to-r from-emerald-500 to-emerald-600 hover:from-emerald-600 hover:to-emerald-700 text-white rounded-lg font-semibold transition-all duration-200 hover:shadow-lg hover:-translate-y-0.5 disabled:opacity-50 disabled:cursor-not-allowed disabled:hover:translate-y-0">
                    Start ▶
                </button>
                <div id="timer-display"
                    class="text-3xl font-bold font-mono min-w-[110px] text-center px-4 py-2 rounded-lg bg-gradient-to-br from-gray-600/30 to-gray-700/30 text-emerald-500 shadow-inner">
                    00:00
                </div>
            </div>

            <div class="relative px-6 pb-6 flex items-center justify-center">
                <div id="team-pills-container" class="flex flex-wrap gap-2 justify-center max-w-xl">
                    </div>

                <div class="absolute right-6 bottom-6 flex gap-2">
                    <button id="q-wrong" value="wrong"
                        class="h-10 w-10 rounded-lg grid place-items-center cursor-pointer bg-red-500 hover:bg-red-600 text-white font-bold text-xl transition-all hover:scale-110 shadow-md">
                        ✗
                    </button>
                    <button id="q-ok" value="ok"
                        class="h-10 w-10 rounded-lg cursor-pointer grid place-items-center bg-green-500 hover:bg-green-600 text-white font-bold text-xl transition-all hover:scale-110 shadow-md">
                        ✓
                    </button>
                </div>
            </div>
        </form>
    </dialog>

    <div class="fixed top-0 left-0 w-full h-24 z-20 relative">
        <div class="absolute top-4 left-4 flex items-center gap-2">
            <img src="../resources/himacom.png" class="w-10 h-10" alt="">
            <img src="../resources/logocss.png" class="w-10 h-10" alt="">
            <h1 class="text-white text-2xl font-bold font-poppins">CSS<span class="text-sm ml-1">2.0</span></h1>
        </div>

        <div id="team-container" class="absolute top-4 left-1/2 -translate-x-1/2 flex flex-wrap gap-4 items-center justify-center px-4">
            </div>
    </div>

    <div class="relative z-10 flex-grow flex flex-col items-center justify-center">
        <h2 id="game-title" class="text-white text-3xl font-bold mb-4 uppercase tracking-wider">
            Sesi Wajib Jawab
        </h2>

        <div id="game-grid" class="grid gap-4 mb-8"></div>
    </div>


    <div class="fixed bottom-0 right-0 p-4 z-20">
        <button onclick="resetBoard()"
            class="px-6 py-2 bg-red-600 hover:bg-red-700 text-white font-bold rounded-lg transition-all duration-300 hover:scale-105 text-sm shadow-lg">
            Reset
        </button>
    </div>

    <div class="fixed bottom-0 left-0 p-4 z-20">
        <a href="homepage.html"
            class="inline-block px-6 py-2 bg-red-600 hover:bg-red-700 text-white font-bold rounded-lg transition-all duration-300 hover:scale-105 text-sm shadow-lg">
            Back
        </a>
    </div>

    <script src="../soal/penyisihan.js"></script>

    <script>
        // ================================================================
        // STATE MANAGEMENT
        // ================================================================
        let gameState = {
            teams: [],
            selected: {
                wajib: [],
                rebutan: []
            },
            phase: 'wajib', // 'wajib' or 'rebutan'
            wajibAnswered: 0
        };

        const TOTAL_WAJIB_QUESTIONS = 8;
        const TOTAL_REBUTAN_QUESTIONS = 7;
        const WAJIB_ROWS = 2;
        const WAJIB_COLS = 4;

        // Audio untuk timer habis
        let timeUpAudio = null;
        let audioLoopInterval = null;

        // Team color configurations
        const teamColorConfigs = {
            A: {
                bg: 'from-red-400 to-red-500',
                bgDark: 'from-red-500 to-red-600',
                border: 'border-red-600',
                text: 'text-red-500',
                hover: 'hover:bg-red-400',
                selected: 'bg-red-400'
            },
            B: {
                bg: 'from-blue-400 to-blue-500',
                bgDark: 'from-blue-500 to-blue-600',
                border: 'border-blue-600',
                text: 'text-blue-500',
                hover: 'hover:bg-blue-400',
                selected: 'bg-blue-400'
            },
            C: {
                bg: 'from-yellow-400 to-yellow-500',
                bgDark: 'from-yellow-500 to-yellow-600',
                border: 'border-yellow-600',
                text: 'text-yellow-500',
                hover: 'hover:bg-yellow-400',
                selected: 'bg-yellow-400'
            },
            D: {
                bg: 'from-green-400 to-green-500',
                bgDark: 'from-green-500 to-green-600',
                border: 'border-green-600',
                text: 'text-green-500',
                hover: 'hover:bg-green-400',
                selected: 'bg-green-400'
            },
            E: {
                bg: 'from-purple-400 to-purple-500',
                bgDark: 'from-purple-500 to-purple-600',
                border: 'border-purple-600',
                text: 'text-purple-500',
                hover: 'hover:bg-purple-400',
                selected: 'bg-purple-400'
            },
            F: {
                bg: 'from-pink-400 to-pink-500',
                bgDark: 'from-pink-500 to-pink-600',
                border: 'border-pink-600',
                text: 'text-pink-500',
                hover: 'hover:bg-pink-400',
                selected: 'bg-pink-400'
            },
            G: {
                bg: 'from-indigo-400 to-indigo-500',
                bgDark: 'from-indigo-500 to-indigo-600',
                border: 'border-indigo-600',
                text: 'text-indigo-500',
                hover: 'hover:bg-indigo-400',
                selected: 'bg-indigo-400'
            },
            H: {
                bg: 'from-orange-400 to-orange-500',
                bgDark: 'from-orange-500 to-orange-600',
                border: 'border-orange-600',
                text: 'text-orange-500',
                hover: 'hover:bg-orange-400',
                selected: 'bg-orange-400'
            }
        };

        function initializeDefaultState() {
            gameState.teams = [
                { name: "A", score: 0 },
                { name: "B", score: 0 },
                { name: "C", score: 0 },
                { name: "D", score: 0 },
            ];
            gameState.selected = {
                wajib: Array(WAJIB_ROWS).fill(null).map(() => Array(WAJIB_COLS).fill(false)),
                rebutan: Array(TOTAL_REBUTAN_QUESTIONS).fill(false)
            };
            gameState.phase = 'wajib';
            gameState.wajibAnswered = 0;
        }

        function loadState() {
            const saved = localStorage.getItem('gameBoardState');
            if (saved) {
                gameState = JSON.parse(saved);

                // Migrasi state lama jika diperlukan
                if (!gameState.phase || !gameState.selected.wajib) {
                    const oldTeams = gameState.teams; // Pertahankan skor tim lama
                    initializeDefaultState();
                    gameState.teams = oldTeams;
                }
            } else {
                initializeDefaultState();
            }
        }

        function saveState() {
            localStorage.setItem('gameBoardState', JSON.stringify(gameState));
        }

        function resetBoard() {
            if (confirm('Apakah Anda yakin ingin mereset seluruh papan permainan dan skor?')) {
                localStorage.removeItem('gameBoardState');
                loadState();
                renderTeams();
                createGrid();
            }
        }

        // ================================================================
        // UI RENDERING
        // ================================================================
        const teamContainer = document.getElementById("team-container");
        const gridContainer = document.getElementById('game-grid');
        const titleContainer = document.getElementById('game-title');
        let questions = {
            wajib: {},
            rebutan: {}
        };

        function renderTeams() {
            teamContainer.innerHTML = "";

            gameState.teams.forEach((team) => {
                const colors = teamColorConfigs[team.name] || teamColorConfigs['A'];
                const div = document.createElement("div");
                div.className = `rounded-lg overflow-hidden shadow-lg h-20 w-24 flex flex-col justify-between bg-gradient-to-br ${colors.bgDark} border-2 ${colors.border} transform transition-all hover:scale-105`;

                div.innerHTML = `
                    <div class="text-center py-1 bg-gradient-to-br ${colors.bg}">
                        <span class="text-xl font-semibold text-white">${team.name}</span>
                    </div>
                    <div class="text-center py-2 bg-black/20">
                        <input type="number"
                               id="score-${team.name}"
                               class="text-xl font-bold text-white bg-transparent text-center w-full outline-none focus:outline-none focus:ring-0 border-none p-0"
                               value="${team.score}"
                               data-team-name="${team.name}">
                    </div>
                `;

                teamContainer.appendChild(div);

                const scoreInput = div.querySelector(`#score-${team.name}`);
                scoreInput.addEventListener('change', handleScoreChange);
            });
        }

        function handleScoreChange(event) {
            const input = event.currentTarget;
            const teamName = input.dataset.teamName;
            let newScore = parseInt(input.value, 10);

            if (isNaN(newScore)) {
                newScore = 0;
                input.value = newScore;
            }

            const team = gameState.teams.find(t => t.name === teamName);
            if (team) {
                team.score = newScore;
                saveState();
            }
        }

        function loadQuestions() {
            if (typeof dataPenyisihanWajib === 'undefined' || typeof dataPenyisihanRebutan === 'undefined') {
                console.error('Data soal tidak ditemukan! Pastikan file penyisihan.js sudah di-load.');
                alert('Error: Data soal tidak ditemukan!');
                return;
            }

            questions.wajib = {};
            dataPenyisihanWajib.forEach(q => {
                questions.wajib[q.id] = q;
            });

            questions.rebutan = {};
            dataPenyisihanRebutan.forEach(q => {
                questions.rebutan[q.id] = q;
            });

            console.log('Soal berhasil dimuat:',
                Object.keys(questions.wajib).length, 'soal wajib,',
                Object.keys(questions.rebutan).length, 'soal rebutan'
            );
        }

        function createGrid() {
            gridContainer.innerHTML = "";

            if (gameState.phase === 'wajib') {
                titleContainer.textContent = "Sesi Wajib Jawab";
                gridContainer.style.gridTemplateColumns = `repeat(${WAJIB_COLS}, 6rem)`;

                for (let r = 0; r < WAJIB_ROWS; r++) {
                    for (let c = 0; c < WAJIB_COLS; c++) {
                        const rowLetter = String.fromCharCode(65 + c); // A, B, C, D
                        const cellId = rowLetter + (r + 1); // A1, B1, C1, D1, ... A2, B2, ...
                        const hasQuestion = questions.wajib[cellId] !== undefined;

                        if (!hasQuestion) {
                            const placeholder = document.createElement('div');
                            placeholder.className = 'h-20 rounded-lg bg-transparent';
                            gridContainer.appendChild(placeholder);
                            continue;
                        }

                        const button = document.createElement('button');
                        const isSelected = gameState.selected.wajib[r][c];

                        button.className = `h-20 rounded-lg font-semibold text-xl cursor-pointer transition-all duration-300 hover:scale-105 ${isSelected
                                ? 'bg-gradient-to-br from-gray-400 to-gray-500 border-2 border-gray-600 text-gray-900 shadow-lg'
                                : 'bg-black/50 border-2 border-white/60 text-white hover:bg-gradient-to-br hover:from-gray-300/90 hover:to-gray-400 hover:shadow-xl hover:border-white/80'
                            }`;

                        button.dataset.row = r;
                        button.dataset.col = c;
                        button.innerText = cellId;
                        button.onclick = handleCellClick;
                        gridContainer.appendChild(button);
                    }
                }
            } else {
                titleContainer.textContent = "Sesi Rebutan";
                gridContainer.style.gridTemplateColumns = `repeat(${TOTAL_REBUTAN_QUESTIONS}, 6rem)`;

                for (let c = 0; c < TOTAL_REBUTAN_QUESTIONS; c++) {
                    const cellId = 'R' + (c + 1);
                    const hasQuestion = questions.rebutan[cellId] !== undefined;

                    if (!hasQuestion) {
                        const placeholder = document.createElement('div');
                        placeholder.className = 'h-20 rounded-lg bg-transparent';
                        gridContainer.appendChild(placeholder);
                        continue;
                    }

                    const button = document.createElement('button');
                    const isSelected = gameState.selected.rebutan[c];

                    button.className = `h-20 rounded-lg font-semibold text-xl cursor-pointer transition-all duration-300 hover:scale-105 ${isSelected
                            ? 'bg-gradient-to-br from-gray-400 to-gray-500 border-2 border-gray-600 text-gray-900 shadow-lg'
                            : 'bg-black/50 border-2 border-white/60 text-white hover:bg-gradient-to-br hover:from-gray-300/90 hover:to-gray-400 hover:shadow-xl hover:border-white/80'
                        }`;

                    button.dataset.row = 0; // Hanya 1 baris
                    button.dataset.col = c;
                    button.innerText = (c + 1); // Tampilkan 1, 2, 3 ... 7
                    button.onclick = handleCellClick;
                    gridContainer.appendChild(button);
                }
            }
        }

        // ================================================================
        // TIMER LOGIC
        // ================================================================
        let timerInterval = null;
        let timeRemaining = 0;

        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = seconds % 60;
            return `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
        }

        function updateTimerDisplay() {
            const display = document.getElementById('timer-display');
            display.textContent = formatTime(timeRemaining);

            display.className = "text-3xl font-bold font-mono min-w-[110px] text-center px-4 py-2 rounded-lg bg-gradient-to-br from-gray-600/30 to-gray-700/30 shadow-inner";

            if (timeRemaining <= 5 && timeRemaining > 3) {
                display.className += " text-yellow-500";
                display.style.textShadow = "0 0 10px rgba(245, 158, 11, 0.5)";
            } else if (timeRemaining <= 3 && timeRemaining > 0) {
                display.className += " text-red-500 animate-pulse-danger";
                display.style.textShadow = "0 0 10px rgba(239, 68, 68, 0.7)";
            } else {
                display.className += " text-emerald-500";
                display.style.textShadow = "0 0 10px rgba(16, 185, 129, 0.5)";
            }
        }

        function playTimeUpSound() {
            stopTimeUpSound();

            timeUpAudio = new Audio('../resources/timeup.mp3');
            timeUpAudio.play().catch(err => {
                console.log('Sound tidak dapat diputar:', err);
            });

            let playCount = 0;
            audioLoopInterval = setInterval(() => {
                playCount++;
                if (playCount < 3) {
                    timeUpAudio = new Audio('../resources/timeup.mp3');
                    timeUpAudio.play().catch(err => {
                        console.log('Sound tidak dapat diputar:', err);
                    });
                } else {
                    clearInterval(audioLoopInterval);
                    audioLoopInterval = null;
                }
            }, 1000);
        }

        function stopTimeUpSound() {
            if (timeUpAudio) {
                timeUpAudio.pause();
                timeUpAudio.currentTime = 0;
                timeUpAudio = null;
            }

            if (audioLoopInterval) {
                clearInterval(audioLoopInterval);
                audioLoopInterval = null;
            }
        }

        function startTimer(duration) {
            const startBtn = document.getElementById('start-timer-btn');
            startBtn.disabled = true;
            timeRemaining = duration;
            updateTimerDisplay();

            timerInterval = setInterval(() => {
                timeRemaining--;
                updateTimerDisplay();

                if (timeRemaining <= 0) {
                    stopTimer();
                    playTimeUpSound();
                }
            }, 1000);
        }

        function stopTimer() {
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }
        }

        // ================================================================
        // INTERACTION LOGIC
        // ================================================================
        async function handleCellClick(event) {
            const button = event.currentTarget;
            const r = parseInt(button.dataset.row);
            const c = parseInt(button.dataset.col);

            let cellId = '';
            let res;

            if (gameState.phase === 'wajib') {
                if (gameState.selected.wajib[r][c]) return; // Sudah dipilih

                const rowLetter = String.fromCharCode(65 + c);
                cellId = rowLetter + (r + 1);
                res = await qPopUp(cellId, 'wajib');
            } else {
                if (gameState.selected.rebutan[c]) return; // Sudah dipilih

                cellId = 'R' + (c + 1);
                res = await qPopUp(cellId, 'rebutan');
            }


            if (res.cancelled) return;

            const team = gameState.teams.find(x => x.name === res.team);
            if (team) {
                const colors = teamColorConfigs[team.name] || teamColorConfigs['A'];
                button.className = `
                    h-20 rounded-lg font-semibold text-xl bg-gradient-to-br ${colors.bg}
                    border-2 ${colors.border} text-white shadow-lg transition-all duration-300
                `;

                team.score += res.delta;
                document.getElementById(`score-${team.name}`).value = team.score;
            } else {
                button.className = 'h-20 rounded-lg font-semibold text-xl bg-gradient-to-br from-gray-400 to-gray-500 border-2 border-gray-600 text-gray-900 shadow-lg';
            }

            // Tandai sebagai sudah dipilih
            if (gameState.phase === 'wajib') {
                gameState.selected.wajib[r][c] = true;
                gameState.wajibAnswered++;
            } else {
                gameState.selected.rebutan[c] = true;
            }

            saveState();

            // Cek transisi ke Sesi Rebutan
            if (gameState.phase === 'wajib' && gameState.wajibAnswered === TOTAL_WAJIB_QUESTIONS) {
                setTimeout(() => {
                    alert('Sesi Wajib Jawab Selesai! Berpindah ke Sesi Rebutan.');
                    gameState.phase = 'rebutan';
                    createGrid();
                    saveState();
                }, 500); // Tunda sedikit agar warna tombol sempat update
            }
        }


        async function qPopUp(cellId, phase) {
            const dlg = document.getElementById('q-dialog');
            const qText = document.getElementById('q-text');
            const okBtn = document.getElementById('q-ok');
            const wrongBtn = document.getElementById('q-wrong');
            const startBtn = document.getElementById('start-timer-btn');
            const timerDisplay = document.getElementById('timer-display');
            const pillsContainer = document.getElementById('team-pills-container');

            pillsContainer.innerHTML = '';
            gameState.teams.forEach(team => {
                const colors = teamColorConfigs[team.name] || teamColorConfigs['A'];
                const pill = document.createElement('button');
                pill.type = 'button';
                pill.dataset.team = team.name;
                pill.className = `border-2 border-gray-300 rounded-lg px-5 py-2.5 cursor-pointer bg-gray-100 text-xl font-semibold transition-all ${colors.hover} hover:text-white hover:border-transparent hover:scale-105`;
                pill.textContent = team.name;
                pillsContainer.appendChild(pill);
            });

            const pills = Array.from(pillsContainer.querySelectorAll('button[data-team]'));

            const soal = (phase === 'wajib') ? questions.wajib[cellId] : questions.rebutan[cellId];

            if (soal) {
                qText.textContent = soal.pertanyaan;
            } else {
                qText.textContent = `Soal untuk ${cellId} tidak ditemukan.`;
            }

            stopTimer();
            stopTimeUpSound();
            startBtn.disabled = false;
            timerDisplay.className = "text-3xl font-bold font-mono min-w-[110px] text-center px-4 py-2 rounded-lg bg-gradient-to-br from-gray-600/30 to-gray-700/30 text-emerald-500 shadow-inner";
            timerDisplay.style.textShadow = "0 0 10px rgba(16, 185, 129, 0.5)";
            timerDisplay.textContent = '00:00';

            let selectedTeam = null;

            return new Promise((resolve) => {
                const onPillClick = (e) => {
                    selectedTeam = e.currentTarget.dataset.team;
                    pills.forEach(p => {
                        const colors = teamColorConfigs[p.dataset.team] || teamColorConfigs['A'];
                        if (p.dataset.team === selectedTeam) {
                            p.className = `border-2 border-transparent rounded-lg px-5 py-2.5 cursor-pointer text-xl font-semibold transition-all ${colors.selected} text-white shadow-md scale-105`;
                        } else {
                            p.className = `border-2 border-gray-300 rounded-lg px-5 py-2.5 cursor-pointer bg-gray-100 text-xl font-semibold transition-all ${colors.hover} hover:text-white hover:border-transparent hover:scale-105`;
                        }
                    });
                };

                const shakePills = () => {
                    pills.forEach(p => {
                        p.classList.add('animate-shake');
                        setTimeout(() => p.classList.remove('animate-shake'), 400);
                    });
                };

                const onOkClick = (e) => {
                    if (!selectedTeam) {
                        e.preventDefault();
                        shakePills();
                    }
                };

                const onWrongClick = (e) => {
                    if (!selectedTeam) {
                        e.preventDefault();
                        shakePills();
                    }
                };

                const onStartTimer = () => {
                    if (soal?.waktu) {
                        startTimer(soal.waktu);
                    }
                };

                const escHandler = (event) => {
                    if (event.key === 'Escape') {
                        stopTimeUpSound();
                        resolve({ cancelled: false, team: selectedTeam, delta: 0 });
                    }
                };

                const onClose = () => {
                    stopTimer();
                    stopTimeUpSound();
                    document.removeEventListener('keydown', escHandler);
                    dlg.removeEventListener('close', onClose);
                    pills.forEach(p => p.removeEventListener('click', onPillClick));
                    okBtn.removeEventListener('click', onOkClick);
                    wrongBtn.removeEventListener('click', onWrongClick);
                    startBtn.removeEventListener('click', onStartTimer);

                    dlg.classList.remove('translate-y-0', 'opacity-100');

                    // Sesuai booklet: Rebutan -100, Wajib -100 (jika dilempar)
                    // Kita gunakan -100 untuk salah di kedua sesi agar konsisten dengan Rebutan
                    if (dlg.returnValue === 'ok' && selectedTeam) {
                        resolve({ cancelled: false, team: selectedTeam, delta: 100 });
                    } else if (dlg.returnValue === 'wrong' && selectedTeam) {
                        // Logika poin untuk salah (kita samakan -100 untuk rebutan dan wajib)
                        // Sesuai booklet, Sesi Wajib Jawab jika salah poin 0, lalu dilempar.
                        // Sesi Rebutan jika salah -100.
                        // Karena implementasi 'lempar' tidak ada, kita gunakan -100 untuk 'wrong' di kedua sesi.
                        resolve({ cancelled: false, team: selectedTeam, delta: -100 });
                    } else {
                        resolve({ cancelled: true });
                    }
                };

                pills.forEach(p => p.addEventListener('click', onPillClick));
                okBtn.addEventListener('click', onOkClick);
                wrongBtn.addEventListener('click', onWrongClick);
                startBtn.addEventListener('click', onStartTimer);
                document.addEventListener('keydown', escHandler);
                dlg.addEventListener('close', onClose, { once: true });

                dlg.showModal();
                setTimeout(() => dlg.classList.add('translate-y-0', 'opacity-100'), 10);
            });
        }

        // ================================================================
        // INITIALIZATION
        // ================================================================
        window.addEventListener('beforeunload', () => {
            stopTimeUpSound();
        });

        window.addEventListener('load', () => {
            console.log('=== CSS 2.0 Game Board Initialization ===');

            loadState();
            loadQuestions();
            renderTeams();
            createGrid();

            console.log('Phase:', gameState.phase);
            console.log('Teams:', gameState.teams.map(t => t.name).join(', '));
        });
    </script>
</body>

</html>
