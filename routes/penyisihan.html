<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS 2.0 Game Board</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,300;0,400;0,600;1,400&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        poppins: ['Poppins', 'sans-serif']
                    },
                    animation: {
                        'shake': 'shake 0.4s ease-in-out',
                        'pulse-danger': 'pulse-danger 0.5s infinite',
                        'glow-pulse': 'glow-pulse 6s ease-in-out infinite',
                        'rotate-counter': 'rotate-counter 12s linear infinite',
                        'rotate-counter-fast': 'rotate-counter 6s linear infinite'
                    },
                    keyframes: {
                        shake: {
                            '0%, 100%': { transform: 'translateX(0)' },
                            '20%, 60%': { transform: 'translateX(-4px)' },
                            '40%, 80%': { transform: 'translateX(4px)' }
                        },
                        'pulse-danger': {
                            '0%, 100%': { transform: 'scale(1)' },
                            '50%': { transform: 'scale(1.05)' }
                        },
                        'glow-pulse': {
                            '0%, 100%': { transform: 'scale(1)' },
                            '50%': { transform: 'scale(1.1)' }
                        },
                        'rotate-counter': {
                            'from': { transform: 'rotate(0deg)' },
                            'to': { transform: 'rotate(-360deg)' }
                        }
                    }
                }
            }
        }
    </script>
</head>

<body class="min-h-screen bg-black font-poppins overflow-hidden">
    <!-- Grid Background Pattern -->
    <div class="fixed inset-0 opacity-5 pointer-events-none" style="background: linear-gradient(90deg, white 1px, transparent 1px), linear-gradient(white 1px, transparent 1px); background-size: 10px 10px;"></div>

    <!-- Orbit Background -->
    <div class="fixed top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[500px] h-[500px] pointer-events-none z-0">
        <!-- Red Orbit -->
        <div class="absolute w-[500px] h-[500px] rounded-full animate-rotate-counter">
            <div class="absolute w-[120px] h-[120px] rounded-full bg-red-500/50 shadow-[0_0_80px_40px_rgba(239,68,68,0.4),0_0_200px_100px_rgba(239,68,68,0.4)] animate-glow-pulse"></div>
        </div>
        <!-- Blue Orbit -->
        <div class="absolute w-[300px] h-[300px] top-[100px] left-[100px] rounded-full animate-rotate-counter-fast">
            <div class="absolute w-[120px] h-[120px] rounded-full bg-blue-500/50 shadow-[0_0_80px_40px_rgba(59,130,246,0.4),0_0_200px_100px_rgba(59,130,246,0.4)] animate-glow-pulse"></div>
        </div>
    </div>

    <!-- Question Dialog -->
    <dialog id="q-dialog" class="rounded-2xl p-0 backdrop:bg-black/50 bg-white/90 opacity-0 shadow-2xl fixed transition-all duration-300 border-0">
        <form method="dialog" class="min-w-[60rem] max-w-[90vw] rounded-2xl">
            <header class="px-6 py-4 text-center border-b border-gray-200">
                <h3 class="font-bold text-2xl font-poppins text-gray-800">Pertanyaan</h3>
            </header>

            <section class="px-6 py-6 text-center min-h-[120px] flex items-center justify-center">
                <blockquote id="q-text" class="italic text-lg text-gray-700 font-poppins leading-relaxed">"Soal tidak terdeteksi"</blockquote>
            </section>

            <div class="flex items-center justify-center mb-6 gap-3 px-6">
                <button type="button" id="start-timer-btn" class="px-5 py-2.5 bg-gradient-to-r from-emerald-500 to-emerald-600 hover:from-emerald-600 hover:to-emerald-700 text-white rounded-lg font-semibold transition-all duration-200 hover:shadow-lg hover:-translate-y-0.5 disabled:opacity-50 disabled:cursor-not-allowed disabled:hover:translate-y-0">
                    Start ▶
                </button>
                <div id="timer-display" class="text-3xl font-bold font-mono min-w-[110px] text-center px-4 py-2 rounded-lg bg-gradient-to-br from-gray-600/30 to-gray-700/30 text-emerald-500 shadow-inner">
                    00:00
                </div>
            </div>

            <div class="relative px-6 pb-6 flex items-center justify-center">
                <div id="team-pills-container" class="flex flex-wrap gap-2 justify-center max-w-xl">
                    <!-- Team pills will be dynamically generated here -->
                </div>

                <div class="absolute right-6 bottom-6 flex gap-2">
                    <button id="q-wrong" value="wrong" class="h-10 w-10 rounded-lg grid place-items-center cursor-pointer bg-red-500 hover:bg-red-600 text-white font-bold text-xl transition-all hover:scale-110 shadow-md">
                        ✗
                    </button>
                    <button id="q-ok" value="ok" class="h-10 w-10 rounded-lg cursor-pointer grid place-items-center bg-green-500 hover:bg-green-600 text-white font-bold text-xl transition-all hover:scale-110 shadow-md">
                        ✓
                    </button>
                </div>
            </div>
        </form>
    </dialog>

    <!-- Main Container -->
    <div class="relative z-10 py-4 max-w-6xl w-full mx-auto flex flex-col min-h-screen">
        <!-- Logo -->
        <div class="fixed top-0 left-0 p-4 flex items-center gap-2 z-20">
            <img src="../resources/himacom.png" class="w-10 h-10" alt="">
            <img src="../resources/logocss.png" class="w-10 h-10" alt="">
            <h1 class="text-white text-2xl font-bold font-poppins">CSS<span class="text-sm ml-1">2.0</span></h1>
        </div>

        <!-- Content -->
        <div class="flex flex-col items-center justify-center flex-grow">
            <!-- Team Scores -->
            <div id="team-container" class="flex flex-wrap gap-4 items-center justify-center mb-10 w-full max-w-4xl px-4"></div>
            
            <!-- Game Grid -->
            <div id="game-grid" class="grid gap-4 mb-8"></div>
        </div>

        <!-- Reset Button -->
        <div class="fixed bottom-0 right-0 p-4 z-20">
            <button onclick="resetBoard()" class="px-6 py-2 bg-red-600 hover:bg-red-700 text-white font-bold rounded-lg transition-all duration-300 hover:scale-105 text-sm shadow-lg">
                Reset
            </button>
        </div>

        <!-- Back Button -->
        <div class="fixed bottom-0 left-0 p-4 z-20">
            <a href="homepage.html" class="inline-block px-6 py-2 bg-red-600 hover:bg-red-700 text-white font-bold rounded-lg transition-all duration-300 hover:scale-105 text-sm shadow-lg">
                Back
            </a>
        </div>
    </div>
    
    <script src="../soal/dummy.js"></script>

    <script>
        // ================================================================
        // STATE MANAGEMENT
        // ================================================================
        let gameState = {
            teams: [],
            selected: []
        };

        let rows = 4;
        let cols = 6;

        // Audio untuk timer habis
        let timeUpAudio = null;
        let audioLoopInterval = null;

        // Team color configurations
        const teamColorConfigs = {
            A: { 
                bg: 'from-red-400 to-red-500',
                bgDark: 'from-red-500 to-red-600',
                border: 'border-red-600',
                text: 'text-red-500',
                hover: 'hover:bg-red-400',
                selected: 'bg-red-400'
            },
            B: { 
                bg: 'from-blue-400 to-blue-500',
                bgDark: 'from-blue-500 to-blue-600',
                border: 'border-blue-600',
                text: 'text-blue-500',
                hover: 'hover:bg-blue-400',
                selected: 'bg-blue-400'
            },
            C: { 
                bg: 'from-yellow-400 to-yellow-500',
                bgDark: 'from-yellow-500 to-yellow-600',
                border: 'border-yellow-600',
                text: 'text-yellow-500',
                hover: 'hover:bg-yellow-400',
                selected: 'bg-yellow-400'
            },
            D: { 
                bg: 'from-green-400 to-green-500',
                bgDark: 'from-green-500 to-green-600',
                border: 'border-green-600',
                text: 'text-green-500',
                hover: 'hover:bg-green-400',
                selected: 'bg-green-400'
            },
            E: { 
                bg: 'from-purple-400 to-purple-500',
                bgDark: 'from-purple-500 to-purple-600',
                border: 'border-purple-600',
                text: 'text-purple-500',
                hover: 'hover:bg-purple-400',
                selected: 'bg-purple-400'
            },
            F: { 
                bg: 'from-pink-400 to-pink-500',
                bgDark: 'from-pink-500 to-pink-600',
                border: 'border-pink-600',
                text: 'text-pink-500',
                hover: 'hover:bg-pink-400',
                selected: 'bg-pink-400'
            },
            G: { 
                bg: 'from-indigo-400 to-indigo-500',
                bgDark: 'from-indigo-500 to-indigo-600',
                border: 'border-indigo-600',
                text: 'text-indigo-500',
                hover: 'hover:bg-indigo-400',
                selected: 'bg-indigo-400'
            },
            H: { 
                bg: 'from-orange-400 to-orange-500',
                bgDark: 'from-orange-500 to-orange-600',
                border: 'border-orange-600',
                text: 'text-orange-500',
                hover: 'hover:bg-orange-400',
                selected: 'bg-orange-400'
            }
        };

        function loadState() {
            const saved = sessionStorage.getItem('gameBoardState');
            if (saved) {
                gameState = JSON.parse(saved);
            } else {
                gameState.teams = [
                    { name: "A", score: 0 },
                    { name: "B", score: 0 },
                    { name: "C", score: 0 },
                    { name: "D", score: 0 },
                    { name: "E", score: 0 },
                ];
                gameState.selected = Array(rows).fill(null).map(() => Array(cols).fill(false));
            }
        }

        function saveState() {
            sessionStorage.setItem('gameBoardState', JSON.stringify(gameState));
        }

        function resetBoard() {
            if (confirm('Apakah Anda yakin ingin mereset seluruh papan permainan dan skor?')) {
                sessionStorage.removeItem('gameBoardState');
                loadState();
                renderTeams();
                createGrid();
            }
        }

        // ================================================================
        // UI RENDERING
        // ================================================================
        const teamContainer = document.getElementById("team-container");
        const gridContainer = document.getElementById('game-grid');
        let questions = {};

        function renderTeams() {
            teamContainer.innerHTML = "";
            
            gameState.teams.forEach((team) => {
                const colors = teamColorConfigs[team.name] || teamColorConfigs['A'];
                const div = document.createElement("div");
                div.className = `rounded-lg overflow-hidden shadow-lg h-20 w-24 flex flex-col justify-between bg-gradient-to-br ${colors.bgDark} border-2 ${colors.border} transform transition-all hover:scale-105`;
                div.innerHTML = `
                    <div class="text-center py-1 bg-gradient-to-br ${colors.bg}">
                        <span class="text-xl font-semibold text-white">${team.name}</span>
                    </div>
                    <div class="text-center py-2 bg-black/20">
                        <span id="score-${team.name}" class="text-xl font-bold text-white">${team.score}</span>
                    </div>
                `;
                teamContainer.appendChild(div);
            });
        }

        function loadQuestions() {
            // Check if dataPenyisihan exists
            if (typeof dataPenyisihan === 'undefined') {
                console.error('dataPenyisihan tidak ditemukan! Pastikan file dummy.js sudah di-load.');
                alert('Error: Data soal tidak ditemukan!');
                return;
            }

            // Convert array to object with id as key
            questions = {};
            dataPenyisihan.forEach(q => {
                questions[q.id] = q;
            });

            console.log('Soal berhasil dimuat:', Object.keys(questions).length, 'soal');
            
            // Calculate dynamic grid size based on available questions
            calculateGridSize();
        }

        function calculateGridSize() {
            const totalQuestions = Object.keys(questions).length;
            
            if (totalQuestions === 0) {
                console.warn('Tidak ada soal yang tersedia!');
                return;
            }

            // Get unique row letters (A, B, C, D, etc.)
            const rowLetters = new Set();
            Object.keys(questions).forEach(id => {
                rowLetters.add(id.charAt(0));
            });
            
            rows = rowLetters.size;
            
            // Get max column number
            let maxCol = 0;
            Object.keys(questions).forEach(id => {
                const colNum = parseInt(id.substring(1));
                if (colNum > maxCol) maxCol = colNum;
            });
            
            cols = maxCol;

            console.log(`Grid dinamis: ${rows} baris x ${cols} kolom`);
            
            // Reinitialize selected array if needed
            if (!gameState.selected || gameState.selected.length !== rows) {
                gameState.selected = Array(rows).fill(null).map(() => Array(cols).fill(false));
            }
        }

        function createGrid() {
            gridContainer.innerHTML = "";
            gridContainer.style.gridTemplateColumns = `repeat(${cols}, 6rem)`;

            for (let r = 0; r < rows; r++) {
                const rowLetter = String.fromCharCode(65 + r);
                for (let c = 0; c < cols; c++) {
                    const cellId = rowLetter + (c + 1);
                    
                    // Check if question exists for this cell
                    const hasQuestion = questions[cellId] !== undefined;
                    
                    if (!hasQuestion) {
                        // Create empty placeholder
                        const placeholder = document.createElement('div');
                        placeholder.className = 'h-20 rounded-lg bg-transparent';
                        gridContainer.appendChild(placeholder);
                        continue;
                    }

                    const button = document.createElement('button');
                    button.className = `h-20 rounded-lg font-semibold text-xl cursor-pointer transition-all duration-300 hover:scale-105 ${
                        gameState.selected[r][c] 
                            ? 'bg-gradient-to-br from-yellow-400 to-yellow-500 border-2 border-yellow-600 text-gray-900 shadow-lg' 
                            : 'bg-black/50 border-2 border-white/60 text-white hover:bg-gradient-to-br hover:from-gray-300/90 hover:to-gray-400 hover:shadow-xl hover:border-white/80'
                    }`;
                    
                    button.dataset.row = r;
                    button.dataset.col = c;
                    button.innerText = cellId;
                    button.onclick = handleCellClick;
                    
                    gridContainer.appendChild(button);
                }
            }
        }

        // ================================================================
        // TIMER LOGIC
        // ================================================================
        let timerInterval = null;
        let timeRemaining = 0;

        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = seconds % 60;
            return `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
        }

        function updateTimerDisplay() {
            const display = document.getElementById('timer-display');
            display.textContent = formatTime(timeRemaining);

            display.className = "text-3xl font-bold font-mono min-w-[110px] text-center px-4 py-2 rounded-lg bg-gradient-to-br from-gray-600/30 to-gray-700/30 shadow-inner";
            
            if (timeRemaining <= 5 && timeRemaining > 3) {
                display.className += " text-yellow-500";
                display.style.textShadow = "0 0 10px rgba(245, 158, 11, 0.5)";
            } else if (timeRemaining <= 3 && timeRemaining > 0) {
                display.className += " text-red-500 animate-pulse-danger";
                display.style.textShadow = "0 0 10px rgba(239, 68, 68, 0.7)";
            } else {
                display.className += " text-emerald-500";
                display.style.textShadow = "0 0 10px rgba(16, 185, 129, 0.5)";
            }
        }

        function playTimeUpSound() {
            stopTimeUpSound();
            
            timeUpAudio = new Audio('../resources/timeup.mp3');
            timeUpAudio.play().catch(err => {
                console.log('Sound tidak dapat diputar:', err);
            });

            let playCount = 0;
            audioLoopInterval = setInterval(() => {
                playCount++;
                if (playCount < 3) {
                    timeUpAudio = new Audio('../resources/timeup.mp3');
                    timeUpAudio.play().catch(err => {
                        console.log('Sound tidak dapat diputar:', err);
                    });
                } else {
                    clearInterval(audioLoopInterval);
                    audioLoopInterval = null;
                }
            }, 1000);
        }

        function stopTimeUpSound() {
            if (timeUpAudio) {
                timeUpAudio.pause();
                timeUpAudio.currentTime = 0;
                timeUpAudio = null;
            }
            
            if (audioLoopInterval) {
                clearInterval(audioLoopInterval);
                audioLoopInterval = null;
            }
        }

        function startTimer(duration) {
            const startBtn = document.getElementById('start-timer-btn');
            startBtn.disabled = true;
            timeRemaining = duration;
            updateTimerDisplay();

            timerInterval = setInterval(() => {
                timeRemaining--;
                updateTimerDisplay();

                if (timeRemaining <= 0) {
                    stopTimer();
                    playTimeUpSound();
                }
            }, 1000);
        }

        function stopTimer() {
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }
        }

        // ================================================================
        // INTERACTION LOGIC
        // ================================================================
        async function handleCellClick(event) {
            const button = event.currentTarget;
            const r = parseInt(button.dataset.row);
            const c = parseInt(button.dataset.col);

            if (gameState.selected[r][c]) return;

            const cellId = String.fromCharCode(65 + r) + (c + 1);
            const res = await qPopUp(cellId);

            if (res.cancelled) return;

            button.className = 'h-20 rounded-lg font-semibold text-xl bg-gradient-to-br from-yellow-400 to-yellow-500 border-2 border-yellow-600 text-gray-900 shadow-lg';
            gameState.selected[r][c] = true;

            const team = gameState.teams.find(x => x.name === res.team);
            if (team) {
                team.score += res.delta;
                document.getElementById(`score-${team.name}`).textContent = team.score;
            }

            saveState();
        }

        async function qPopUp(cellId) {
            const dlg = document.getElementById('q-dialog');
            const qText = document.getElementById('q-text');
            const okBtn = document.getElementById('q-ok');
            const wrongBtn = document.getElementById('q-wrong');
            const startBtn = document.getElementById('start-timer-btn');
            const timerDisplay = document.getElementById('timer-display');
            const pillsContainer = document.getElementById('team-pills-container');

            // Generate team pills dynamically
            pillsContainer.innerHTML = '';
            gameState.teams.forEach(team => {
                const colors = teamColorConfigs[team.name] || teamColorConfigs['A'];
                const pill = document.createElement('button');
                pill.type = 'button';
                pill.dataset.team = team.name;
                pill.className = `border-2 border-gray-300 rounded-lg px-5 py-2.5 cursor-pointer bg-gray-100 text-xl font-semibold transition-all ${colors.hover} hover:text-white hover:border-transparent hover:scale-105`;
                pill.textContent = team.name;
                pillsContainer.appendChild(pill);
            });

            const pills = Array.from(pillsContainer.querySelectorAll('button[data-team]'));

            // Get question data
            const soal = questions[cellId];
            
            if (soal) {
                qText.textContent = soal.pertanyaan;
                console.log('Soal dimuat:', cellId, '-', soal.pertanyaan);
                console.log('Waktu:', soal.waktu, 'detik');
                console.log('Tipe:', soal.tipe);
            } else {
                qText.textContent = `Soal untuk ${cellId} tidak ditemukan dalam database.`;
                console.warn('Soal tidak ditemukan:', cellId);
            }

            stopTimer();
            stopTimeUpSound();
            startBtn.disabled = false;
            timerDisplay.className = "text-3xl font-bold font-mono min-w-[110px] text-center px-4 py-2 rounded-lg bg-gradient-to-br from-gray-600/30 to-gray-700/30 text-emerald-500 shadow-inner";
            timerDisplay.style.textShadow = "0 0 10px rgba(16, 185, 129, 0.5)";
            timerDisplay.textContent = '00:00';

            let selectedTeam = null;

            return new Promise((resolve) => {
                const onPillClick = (e) => {
                    selectedTeam = e.currentTarget.dataset.team;
                    pills.forEach(p => {
                        const colors = teamColorConfigs[p.dataset.team] || teamColorConfigs['A'];
                        if (p.dataset.team === selectedTeam) {
                            p.className = `border-2 border-transparent rounded-lg px-5 py-2.5 cursor-pointer text-xl font-semibold transition-all ${colors.selected} text-white shadow-md scale-105`;
                        } else {
                            p.className = `border-2 border-gray-300 rounded-lg px-5 py-2.5 cursor-pointer bg-gray-100 text-xl font-semibold transition-all ${colors.hover} hover:text-white hover:border-transparent hover:scale-105`;
                        }
                    });
                };

                const shakePills = () => {
                    pills.forEach(p => {
                        p.classList.add('animate-shake');
                        setTimeout(() => p.classList.remove('animate-shake'), 400);
                    });
                };

                const onOkClick = (e) => {
                    if (!selectedTeam) {
                        e.preventDefault();
                        shakePills();
                    }
                };

                const onWrongClick = (e) => {
                    if (!selectedTeam) {
                        e.preventDefault();
                        shakePills();
                    }
                };

                const onStartTimer = () => {
                    if (soal?.waktu) {
                        console.log('Timer dimulai:', soal.waktu, 'detik');
                        startTimer(soal.waktu);
                    } else {
                        console.warn('Waktu tidak ditemukan untuk soal ini');
                    }
                };

                const escHandler = (event) => {
                    if (event.key === 'Escape') {
                        stopTimeUpSound();
                    }
                };

                const onClose = () => {
                    stopTimer();
                    stopTimeUpSound();
                    document.removeEventListener('keydown', escHandler);
                    dlg.removeEventListener('close', onClose);
                    pills.forEach(p => p.removeEventListener('click', onPillClick));
                    okBtn.removeEventListener('click', onOkClick);
                    wrongBtn.removeEventListener('click', onWrongClick);
                    startBtn.removeEventListener('click', onStartTimer);

                    dlg.classList.remove('translate-y-0', 'opacity-100');

                    if (dlg.returnValue === 'ok' && selectedTeam) {
                        resolve({ cancelled: false, team: selectedTeam, delta: 100 });
                    } else if (dlg.returnValue === 'wrong' && selectedTeam) {
                        resolve({ cancelled: false, team: selectedTeam, delta: -50 });
                    } else {
                        resolve({ cancelled: true });
                    }
                };

                pills.forEach(p => p.addEventListener('click', onPillClick));
                okBtn.addEventListener('click', onOkClick);
                wrongBtn.addEventListener('click', onWrongClick);
                startBtn.addEventListener('click', onStartTimer);
                document.addEventListener('keydown', escHandler);
                dlg.addEventListener('close', onClose, { once: true });

                dlg.showModal();
                setTimeout(() => dlg.classList.add('translate-y-0', 'opacity-100'), 10);
            });
        }

        // ================================================================
        // INITIALIZATION
        // ================================================================
        document.addEventListener('keydown', (e) => {
            if (e.key.toLowerCase() === 'r' && e.ctrlKey) resetBoard();
        });

        window.addEventListener('beforeunload', () => {
            stopTimeUpSound();
        });

        window.addEventListener('load', () => {
            console.log('=== CSS 2.0 Game Board Initialization ===');
            
            loadState();
            loadQuestions();
            renderTeams();
            createGrid();

            console.log('Grid size:', rows, 'x', cols);
            console.log('Total soal tersedia:', Object.keys(questions).length);
            console.log('Teams:', gameState.teams.map(t => t.name).join(', '));

            document.querySelectorAll('#game-grid button').forEach((button, i) => {
                button.style.opacity = '0';
                button.style.transform = 'translateY(20px)';
                setTimeout(() => {
                    button.style.transition = 'opacity 0.3s ease, transform 0.3s ease';
                    button.style.opacity = '1';
                    button.style.transform = 'translateY(0)';
                }, i * 30);
            });
        });
    </script>
</body>
</html>
