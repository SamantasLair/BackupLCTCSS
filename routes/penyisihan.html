<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Penyisihan LCT-K</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet"/>
  <script>
    tailwind.config={theme:{extend:{fontFamily:{poppins:["Poppins","sans-serif"]},animation:{shake:"shake 0.4s ease-in-out","pulse-danger":"pulse-danger 0.5s infinite","glow-pulse":"glow-pulse 6s ease-in-out infinite","rotate-counter":"rotate-counter 12s linear infinite","rotate-counter-fast":"rotate-counter 6s linear infinite","slideUp":"slideUp 0.25s ease-out","fadeIn":"fadeIn 0.2s ease-out"},keyframes:{shake:{"0%,100%":{transform:"translateX(0)"},"20%,60%":{transform:"translateX(-4px)"},"40%,80%":{transform:"translateX(4px)"}}, "pulse-danger":{"0%,100%":{transform:"scale(1)"},"50%":{transform:"scale(1.05)"}}, "glow-pulse":{"0%,100%":{transform:"scale(1)"},"50%":{transform:"scale(1.1)"}}, "rotate-counter":{from:{transform:"rotate(0deg)"},to:{transform:"rotate(-360deg)"}}, slideUp:{from:{opacity:"0",transform:"translateY(12px)"},to:{opacity:"1",transform:"translateY(0)"}}, fadeIn:{from:{opacity:"0"},to:{opacity:"1"}}}}}};
  </script>
  <style>
    body{font-family:'Poppins',sans-serif;background-image:linear-gradient(90deg,rgba(255,255,255,0.05) 1px,transparent 1px),linear-gradient(rgba(255,255,255,0.05) 1px,transparent 1px);background-size:10px 10px}
    input[type="number"]::-webkit-inner-spin-button,input[type="number"]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
    input[type="number"]{-moz-appearance:textfield}
  </style>
</head>
<body class="min-h-screen bg-black font-poppins overflow-hidden text-white">
  <div class="fixed inset-0 opacity-5 pointer-events-none" style="background:linear-gradient(90deg,white 1px,transparent 1px),linear-gradient(white 1px,transparent 1px);background-size:10px 10px;"></div>
  <div class="fixed top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[500px] h-[500px] pointer-events-none z-0">
    <div class="absolute w-[500px] h-[500px] rounded-full animate-rotate-counter">
      <div class="absolute w-[120px] h-[120px] rounded-full bg-red-500/50 shadow-[0_0_80px_40px_rgba(239,68,68,0.4),0_0_200px_100px_rgba(239,68,68,0.4)] animate-glow-pulse"></div>
    </div>
    <div class="absolute w-[300px] h-[300px] top-[100px] left-[100px] rounded-full animate-rotate-counter-fast">
      <div class="absolute w-[120px] h-[120px] rounded-full bg-blue-500/50 shadow-[0_0_80px_40px_rgba(59,130,246,0.4),0_0_200px_100px_rgba(59,130,246,0.4)] animate-glow-pulse"></div>
    </div>
  </div>

  <div id="phase-overlay" class="fixed inset-0 hidden items-center justify-center bg-black/80 z-50">
    <div class="text-4xl md:text-5xl font-extrabold text-white tracking-wide">BABAK REBUTAN DIMULAI!</div>
  </div>

  <dialog id="q-dialog" class="rounded-2xl p-0 backdrop:bg-black/50 bg-white/90 opacity-0 shadow-2xl fixed transition-all duration-300 border-0">
    <form method="dialog" class="min-w-[60rem] max-w-[90vw] rounded-2xl">
      <header class="px-6 py-4 text-center border-b border-gray-200">
        <h3 class="font-bold text-2xl text-gray-800">Pertanyaan</h3>
      </header>
      <section class="px-6 py-6 text-center min-h-[120px] flex items-center justify-center" id="q-section">
        <blockquote id="q-text" class="italic text-lg text-black font-bold leading-relaxed">"Soal tidak terdeteksi"</blockquote>
      </section>
      <section class="px-6 py-4 text-center">
        <button type="button" id="toggle-answer-btn" class="px-4 py-2 bg-gradient-to-r from-blue-500 to-blue-600 hover:from-blue-600 hover:to-blue-700 text-white rounded-lg font-semibold transition-all duration-200 hover:shadow-lg hover:-translate-y-0.5 mb-3">Tampilkan Jawaban</button>
        <div id="answer-section" class="hidden min-h-[80px] items-center justify-center bg-green-50 rounded-lg p-4 border-2 border-green-200">
          <blockquote id="answer-text" class="italic text-lg text-green-800 font-bold leading-relaxed">"Jawaban"</blockquote>
        </div>
      </section>
      <div class="flex items-center justify-center mb-4 gap-3 px-6" id="main-timer-controls">
        <button type="button" id="start-timer-btn" class="px-5 py-2.5 bg-gradient-to-r from-emerald-500 to-emerald-600 hover:from-emerald-600 hover:to-emerald-700 text-white rounded-lg font-semibold transition-all duration-200 hover:shadow-lg hover:-translate-y-0.5 disabled:opacity-50 disabled:cursor-not-allowed">Start ▶</button>
        <div id="timer-display" class="text-3xl font-bold font-mono min-w-[110px] text-center px-4 py-2 rounded-lg bg-gradient-to-br from-gray-600/30 to-gray-700/30 text-emerald-500 shadow-inner">00:00</div>
      </div>
      <div class="flex items-center justify-center mb-2 gap-3 px-6" id="rebuttal-controls" style="display:none">
        <button type="button" id="start-rebuttal-btn" class="px-5 py-2.5 bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-600 hover:to-amber-700 text-white rounded-lg font-semibold transition-all duration-200 hover:shadow-lg hover:-translate-y-0.5 disabled:opacity-50 disabled:cursor-not-allowed">Mulai Waktu Lempar ▶</button>
        <div id="rebuttal-timer-display" class="text-3xl font-bold font-mono min-w-[110px] text-center px-4 py-2 rounded-lg bg-gradient-to-br from-gray-600/30 to-gray-700/30 text-amber-400 shadow-inner">00:05</div>
      </div>
      <div class="px-6 text-center text-sm text-gray-700 mb-2" id="dialog-phase-hint"></div>
      <div class="relative px-6 pb-6 flex items-center justify-center">
        <div id="team-pills-container" class="flex flex-wrap gap-2 justify-center max-w-xl"></div>
        <div class="absolute right-6 bottom-6 flex gap-2">
          <button id="q-wrong" value="wrong" class="h-10 w-10 rounded-lg grid place-items-center cursor-pointer bg-red-500 hover:bg-red-600 text-white font-bold text-xl transition-all hover:scale-110 shadow-md disabled:opacity-50 disabled:cursor-not-allowed">✗</button>
          <button id="q-ok" value="ok" class="h-10 w-10 rounded-lg cursor-pointer grid place-items-center bg-green-500 hover:bg-green-600 text-white font-bold text-xl transition-all hover:scale-110 shadow-md disabled:opacity-50 disabled:cursor-not-allowed">✓</button>
        </div>
      </div>
    </form>
  </dialog>

  <div id="setupContainer" class="fixed inset-0 z-[2000] flex items-center justify-center bg-black/70">
    <div class="bg-gradient-to-br from-slate-800 to-slate-900 border-2 border-white/20 rounded-xl p-10 text-center animate-slideUp">
      <h2 class="mb-5 text-2xl font-bold bg-gradient-to-r from-amber-400 to-amber-500 text-transparent bg-clip-text">Atur Jumlah Tim</h2>
      <input type="number" id="teamInput" value="3" min="2" max="26" class="p-2.5 border-2 border-amber-500/30 rounded-md bg-white/10 text-white text-base mb-4 w-52 text-center">
      <br>
      <button onclick="startGame()" class="bg-gradient-to-r from-green-500 to-green-600 text-white py-2.5 px-8 border-none rounded-md font-semibold cursor-pointer transition-all duration-300 hover:scale-105">Mulai Game</button>
    </div>
  </div>

  <div id="mainContainer" class="relative z-10 py-4 max-w-6xl w-full mx-auto flex flex-col min-h-screen hidden">
    <div class="fixed top-0 left-0 p-4 flex items-center gap-2 z-20">
      <img src="../resources/himacom.png" class="w-10 h-10" alt=""/>
      <img src="../resources/logocss.png" class="w-10 h-10" alt=""/>
      <div class="flex flex-col">
        <h1 class="text-white text-2xl font-bold">CSS<span class="text-sm ml-1">2.0</span></h1>
        <h1 class="text-white text-lg font-bold">Babak Penyisihan</h1>
      </div>
    </div>
    <div class="flex flex-col items-center justify-center flex-grow">
      <div id="team-container" class="flex flex-wrap gap-4 items-center justify-center mb-2 w-full max-w-4xl px-4"></div>
      <div id="phase-indicator" class="text-white/90 text-base md:text-lg font-semibold mb-6"></div>
      <div id="game-grid" class="grid gap-4 mb-8"></div>
    </div>
    <div class="fixed bottom-0 right-0 p-4 z-20">
      <button onclick="resetBoard()" class="px-6 py-2 bg-red-600 hover:bg-red-700 text-white font-bold rounded-lg transition-all duration-300 hover:scale-105 text-sm shadow-lg">Reset</button>
    </div>
    <div class="fixed bottom-0 left-0 p-4 z-20">
      <a href="homepage.html" class="inline-block px-6 py-2 bg-red-600 hover:bg-red-700 text-white font-bold rounded-lg transition-all duration-300 hover:scale-105 text-sm shadow-lg">Back</a>
    </div>
  </div>

  <script src="../soal/penyisihan.js"></script>
  <script>
    const STORAGE_KEY="penyisihanGameState";
    let gameState={teams:[],selected:{},currentPhase:"wajib",wajibTurnIndex:0,wajibAnsweredCount:0};
    let rows=0,cols=0;
    let timeUpAudio=null,audioLoopInterval=null;
    const teamColorConfigs={A:{bg:"from-red-400 to-red-500",bgDark:"from-red-500 to-red-600",border:"border-red-600",text:"text-red-500",hover:"hover:bg-red-400",selected:"bg-red-400"},B:{bg:"from-blue-400 to-blue-500",bgDark:"from-blue-500 to-blue-600",border:"border-blue-600",text:"text-blue-500",hover:"hover:bg-blue-400",selected:"bg-blue-400"},C:{bg:"from-yellow-400 to-yellow-500",bgDark:"from-yellow-500 to-yellow-600",border:"border-yellow-600",text:"text-yellow-500",hover:"hover:bg-yellow-400",selected:"bg-yellow-400"},D:{bg:"from-green-400 to-green-500",bgDark:"from-green-500 to-green-600",border:"border-green-600",text:"text-green-500",hover:"hover:bg-green-400",selected:"bg-green-400"},E:{bg:"from-purple-400 to-purple-500",bgDark:"from-purple-500 to-purple-600",border:"border-purple-600",text:"text-purple-500",hover:"hover:bg-purple-400",selected:"bg-purple-400"},F:{bg:"from-pink-400 to-pink-500",bgDark:"from-pink-500 to-pink-600",border:"border-pink-600",text:"text-pink-500",hover:"hover:bg-pink-400",selected:"bg-pink-400"},G:{bg:"from-indigo-400 to-indigo-500",bgDark:"from-indigo-500 to-indigo-600",border:"border-indigo-600",text:"text-indigo-500",hover:"hover:bg-indigo-400",selected:"bg-indigo-400"},H:{bg:"from-orange-400 to-orange-500",bgDark:"from-orange-500 to-orange-600",border:"border-orange-600",text:"text-orange-500",hover:"hover:bg-orange-400",selected:"bg-orange-400"}};
    const setupContainer=document.getElementById("setupContainer");
    const mainContainer=document.getElementById("mainContainer");
    const teamContainer=document.getElementById("team-container");
    const gridContainer=document.getElementById("game-grid");
    const phaseIndicator=document.getElementById("phase-indicator");
    const phaseOverlay=document.getElementById("phase-overlay");
    let questions={};
    let timerInterval=null,timeRemaining=0;
    let rebuttalTimerInterval=null,rebuttalRemaining=0;

    function showCustomConfirm(message,onConfirm){
      if(document.getElementById("customConfirmModal"))return;
      const confirmModal=document.createElement("div");
      confirmModal.id="customConfirmModal";
      confirmModal.className="fixed inset-0 z-[3000] flex items-center justify-center bg-black/70 animate-fadeIn";
      confirmModal.innerHTML=`
        <div class="bg-gradient-to-br from-slate-700 to-slate-800 border-2 border-white/20 rounded-xl p-8 text-center animate-slideUp max-w-sm w-11/12">
          <p class="text-white text-lg mb-8">${message}</p>
          <div class="flex justify-center gap-4">
            <button id="customConfirmCancelBtn" class="bg-slate-500 text-white py-2 px-6 rounded-md font-semibold transition-transform hover:scale-105">Batal</button>
            <button id="customConfirmOkBtn" class="bg-red-500 text-white py-2 px-6 rounded-md font-semibold transition-transform hover:scale-105">Yakin</button>
          </div>
        </div>
      `;
      document.body.appendChild(confirmModal);
      document.getElementById("customConfirmOkBtn").onclick=()=>{confirmModal.remove();if(typeof onConfirm==="function")onConfirm()};
      document.getElementById("customConfirmCancelBtn").onclick=()=>{confirmModal.remove()}
    }

    function saveState(){localStorage.setItem(STORAGE_KEY,JSON.stringify(gameState))}
    function clearState(){localStorage.removeItem(STORAGE_KEY)}
    function resetBoard(){showCustomConfirm("Yakin reset permainan?",()=>{clearState();location.reload()})}

    function loadQuestions(){
      if(typeof dataPenyisihan1==="undefined"){alert("Error: Data soal tidak ditemukan!");return}
      questions={};dataPenyisihan1.forEach(q=>{questions[q.id]=q});calculateGridSize()
    }
    function calculateGridSize(){
      const totalQuestions=Object.keys(questions).length;if(totalQuestions===0) return;
      const rowLetters=new Set();Object.keys(questions).forEach(id=>rowLetters.add(id.charAt(0)));rows=rowLetters.size;
      let maxCol=0;Object.keys(questions).forEach(id=>{const n=parseInt(id.substring(1));if(n>maxCol)maxCol=n});cols=maxCol;
      if(!gameState.selected||Array.isArray(gameState.selected)) gameState.selected={}
    }

    function renderTeams(){
      teamContainer.innerHTML="";
      gameState.teams.forEach(team=>{
        const colors=teamColorConfigs[team.name]||teamColorConfigs["A"];
        const div=document.createElement("div");
        div.className=`rounded-lg overflow-hidden shadow-lg h-20 w-24 flex flex-col justify-between bg-gradient-to-br ${colors.bgDark} border-2 ${colors.border} transform transition-all hover:scale-105`;
        div.innerHTML=`
          <div class="text-center py-1 bg-gradient-to-br ${colors.bg}">
            <span class="text-xl font-semibold text-white">${team.name}</span>
          </div>
          <div class="text-center py-2 bg-black/20">
            <input type="number" id="score-${team.name}" class="text-xl font-bold text-white bg-transparent text-center w-full outline-none focus:outline-none focus:ring-0 border-none p-0" value="${team.score}" data-team-name="${team.name}">
          </div>`;
        teamContainer.appendChild(div);
        div.querySelector(`#score-${team.name}`).addEventListener("change",handleScoreChange);
      });
    }
    function handleScoreChange(e){
      const input=e.currentTarget;const teamName=input.dataset.teamName;let s=parseInt(input.value,10);
      if(isNaN(s)){s=0;input.value=s}
      const team=gameState.teams.find(t=>t.name===teamName);if(team){team.score=s;saveState()}
    }

    function createGrid(){
      gridContainer.innerHTML="";gridContainer.style.gridTemplateColumns=`repeat(${cols}, 6rem)`;
      for(let r=0;r<rows;r++){
        const rowLetter=String.fromCharCode(65+r);
        for(let c=0;c<cols;c++){
          const cellId=rowLetter+(c+1);
          const has=questions[cellId]!==undefined;
          if(!has){const ph=document.createElement("div");ph.className="h-20 rounded-lg bg-transparent";gridContainer.appendChild(ph);continue}
          const button=document.createElement("button");
          const selectedState=gameState.selected[cellId];
          let buttonClass="";
          if(selectedState){
            const team=gameState.teams.find(t=>t.name===selectedState);
            if(team){const colors=teamColorConfigs[team.name]||teamColorConfigs["A"];buttonClass=`bg-gradient-to-br ${colors.bg} border-2 ${colors.border} text-white shadow-lg`}
            else{buttonClass="bg-gradient-to-br from-gray-400 to-gray-500 border-2 border-gray-600 text-gray-900 shadow-lg"}
          }else{
            buttonClass="bg-black/50 border-2 border-white/60 text-white hover:bg-gradient-to-br hover:from-gray-300/90 hover:to-gray-400 hover:shadow-xl hover:border-white/80"
          }
          button.className=`h-20 rounded-lg font-semibold text-xl transition-all duration-300 ${selectedState?"":"hover:scale-105 cursor-pointer"} ${buttonClass}`;
          button.dataset.row=r;button.dataset.col=c;button.dataset.cellId=cellId;button.innerText=cellId;button.onclick=handleCellClick;
          gridContainer.appendChild(button);
        }
      }
      const items=gridContainer.querySelectorAll("button");items.forEach((b,i)=>{b.style.opacity="0";b.style.transform="translateY(20px)";setTimeout(()=>{b.style.transition="opacity 0.3s ease, transform 0.3s ease";b.style.opacity="1";b.style.transform="translateY(0)"},i*30)})
    }

    function totalWajibCount(){return gameState.teams.length*2}
    function updatePhaseUI(){
      if(gameState.currentPhase==="wajib"){
        const giliran=gameState.teams[gameState.wajibTurnIndex]?.name||"-";
        const prog=`Soal ${Math.min(gameState.wajibAnsweredCount+1,totalWajibCount())}/${totalWajibCount()}`;
        phaseIndicator.textContent=`Fase: Soal Wajib • Giliran Tim: ${giliran} (${prog})`;
      }else{
        phaseIndicator.textContent="Fase: Rebutan";
      }
      saveState()
    }
    function beginRebutan(){
      gameState.currentPhase="rebutan";saveState();updatePhaseUI();
      phaseOverlay.classList.remove("hidden");phaseOverlay.classList.add("flex");
      setTimeout(()=>{phaseOverlay.classList.add("opacity-0")},2000);
      setTimeout(()=>{phaseOverlay.classList.add("hidden");phaseOverlay.classList.remove("flex","opacity-0")},2600);
    }

    function formatTime(s){const m=Math.floor(s/60);const ss=s%60;return `${String(m).padStart(2,"0")}:${String(ss).padStart(2,"0")}`}
    function updateTimerDisplay(){
      const d=document.getElementById("timer-display");
      d.textContent=formatTime(timeRemaining);
      d.className="text-3xl font-bold font-mono min-w-[110px] text-center px-4 py-2 rounded-lg bg-gradient-to-br from-gray-600/30 to-gray-700/30 shadow-inner";
      if(timeRemaining<=5&&timeRemaining>3){d.className+=" text-yellow-500";d.style.textShadow="0 0 10px rgba(245,158,11,0.5)"}
      else if(timeRemaining<=3&&timeRemaining>0){d.className+=" text-red-500 animate-pulse-danger";d.style.textShadow="0 0 10px rgba(239,68,68,0.7)"}
      else{d.className+=" text-emerald-500";d.style.textShadow="0 0 10px rgba(16,185,129,0.5)"}
    }
    function playTimeUpSound(){
      stopTimeUpSound();timeUpAudio=new Audio("../resources/timeup.mp3");timeUpAudio.play().catch(()=>{});
      let count=0;audioLoopInterval=setInterval(()=>{count++;if(count<3){timeUpAudio=new Audio("../resources/timeup.mp3");timeUpAudio.play().catch(()=>{})}else{clearInterval(audioLoopInterval);audioLoopInterval=null}},1000)
    }
    function stopTimeUpSound(){if(timeUpAudio){timeUpAudio.pause();timeUpAudio.currentTime=0;timeUpAudio=null}if(audioLoopInterval){clearInterval(audioLoopInterval);audioLoopInterval=null}}
    function startTimer(duration,onTimeUp){
      const startBtn=document.getElementById("start-timer-btn");startBtn.disabled=true;
      timeRemaining=duration;updateTimerDisplay();
      timerInterval=setInterval(()=>{timeRemaining--;updateTimerDisplay();if(timeRemaining<=0){stopTimer();playTimeUpSound();if(typeof onTimeUp==="function") onTimeUp()}},1000)
    }
    function stopTimer(){if(timerInterval){clearInterval(timerInterval);timerInterval=null}}

    function startRebuttalTimer(onPickTimeout){
      const btn=document.getElementById("start-rebuttal-btn");const disp=document.getElementById("rebuttal-timer-display");
      btn.disabled=true;rebuttalRemaining=5;disp.textContent="00:05";
      rebuttalTimerInterval=setInterval(()=>{rebuttalRemaining--;disp.textContent=`00:0${Math.max(rebuttalRemaining,0)}`;if(rebuttalRemaining<=0){stopRebuttalTimer();if(typeof onPickTimeout==="function") onPickTimeout()}},1000)
    }
    function stopRebuttalTimer(){if(rebuttalTimerInterval){clearInterval(rebuttalTimerInterval);rebuttalTimerInterval=null}}

    async function handleCellClick(e){
      const button=e.currentTarget;const cellId=button.dataset.cellId;
      if(gameState.selected[cellId]) return;
      const res=await qPopUp(cellId);
      if(res.cancelled){
        button.className="h-20 rounded-lg font-semibold text-xl bg-gradient-to-br from-gray-400 to-gray-500 border-2 border-gray-600 text-gray-900 shadow-lg";
        gameState.selected[cellId]="gray";
      }else if(res.team){
        const team=gameState.teams.find(x=>x.name===res.team);
        if(team){
          const colors=teamColorConfigs[team.name]||teamColorConfigs["A"];
          button.className=`h-20 rounded-lg font-semibold text-xl bg-gradient-to-br ${colors.bg} border-2 ${colors.border} text-white shadow-lg transition-all duration-300`;
          gameState.selected[cellId]=team.name;
          team.score+=res.delta;
          document.getElementById(`score-${team.name}`).value=team.score;
        }else{
          button.className="h-20 rounded-lg font-semibold text-xl bg-gradient-to-br from-gray-400 to-gray-500 border-2 border-gray-600 text-gray-900 shadow-lg";
          gameState.selected[cellId]="gray";
        }
      }else{
        button.className="h-20 rounded-lg font-semibold text-xl bg-gradient-to-br from-gray-400 to-gray-500 border-2 border-gray-600 text-gray-900 shadow-lg";
        gameState.selected[cellId]="gray";
      }
      button.classList.remove("hover:scale-105","cursor-pointer");
      if(gameState.currentPhase==="wajib"){
        gameState.wajibAnsweredCount+=1;
        gameState.wajibTurnIndex=(gameState.wajibTurnIndex+1)%gameState.teams.length;
        if(gameState.wajibAnsweredCount>=totalWajibCount()&&gameState.currentPhase==="wajib"){beginRebutan()}
        updatePhaseUI();
      }
      saveState();
    }

    async function qPopUp(cellId){
      const dlg=document.getElementById("q-dialog");
      const ansText=document.getElementById("answer-text");
      const answerSection=document.getElementById("answer-section");
      const toggleAnswerBtn=document.getElementById("toggle-answer-btn");
      const okBtn=document.getElementById("q-ok");
      const wrongBtn=document.getElementById("q-wrong");
      const startBtn=document.getElementById("start-timer-btn");
      const timerDisplay=document.getElementById("timer-display");
      const pillsContainer=document.getElementById("team-pills-container");
      const mainTimerControls=document.getElementById("main-timer-controls");
      const rebuttalControls=document.getElementById("rebuttal-controls");
      const startRebuttalBtn=document.getElementById("start-rebuttal-btn");
      const dialogHint=document.getElementById("dialog-phase-hint");
      const soal=questions[cellId];
      const qSection=document.getElementById("q-section");
      if(soal){if((soal.pertanyaan||"").includes("png")){qSection.innerHTML=`<img src="${soal.pertanyaan}" class="h-full w-full">`}else{qSection.innerHTML=`<blockquote class="italic text-lg text-black font-bold leading-relaxed">${soal.pertanyaan||"Pertanyaan tidak ditemukan."}</blockquote>`}ansText.textContent=soal.jawaban||"Belum ada jawaban.";timerDisplay.textContent=formatTime(soal.waktu||0)}else{qSection.innerHTML=`<blockquote class="italic text-lg text-black font-bold leading-relaxed">Soal untuk ${cellId} tidak ditemukan.</blockquote>`;ansText.textContent="Tidak tersedia.";timerDisplay.textContent="00:00"}
      answerSection.classList.add("hidden");answerSection.classList.remove("flex");
      toggleAnswerBtn.textContent="Tampilkan Jawaban";
      toggleAnswerBtn.onclick=()=>{const vis=!answerSection.classList.contains("hidden");if(vis){answerSection.classList.add("hidden");answerSection.classList.remove("flex");toggleAnswerBtn.textContent="Tampilkan Jawaban"}else{answerSection.classList.remove("hidden");answerSection.classList.add("flex");toggleAnswerBtn.textContent="Sembunyikan Jawaban"}};
      stopTimer();stopTimeUpSound();startBtn.disabled=false;
      timerDisplay.className="text-3xl font-bold font-mono min-w-[110px] text-center px-4 py-2 rounded-lg bg-gradient-to-br from-gray-600/30 to-gray-700/30 text-emerald-500 shadow-inner";timerDisplay.style.textShadow="0 0 10px rgba(16,185,129,0.5)";
      rebuttalControls.style.display="none";startRebuttalBtn.disabled=false;
      pillsContainer.innerHTML="";
      gameState.teams.forEach(team=>{const colors=teamColorConfigs[team.name]||teamColorConfigs["A"];const pill=document.createElement("button");pill.type="button";pill.dataset.team=team.name;pill.className=`border-2 border-gray-300 rounded-lg px-5 py-2.5 cursor-pointer bg-gray-100 text-xl font-semibold transition-all ${colors.hover} hover:text-white hover:border-transparent hover:scale-105`;pill.textContent=team.name;pillsContainer.appendChild(pill)});
      const pills=Array.from(pillsContainer.querySelectorAll("button[data-team]"));
      let selectedTeam=null;
      let mode="";
      let currentTeam=null;
      function setBtnDisabled(btn,dis){btn.disabled=dis}
      function highlightSelected(teamName){
        pills.forEach(p=>{const colors=teamColorConfigs[p.dataset.team]||teamColorConfigs["A"];if(p.dataset.team===teamName){p.className=`border-2 border-transparent rounded-lg px-5 py-2.5 cursor-pointer text-xl font-semibold transition-all ${colors.selected} text-white shadow-md scale-105`}else{p.className=`border-2 border-gray-300 rounded-lg px-5 py-2.5 cursor-pointer bg-gray-100 text-xl font-semibold transition-all ${colors.hover} hover:text-white hover:border-transparent hover:scale-105`}})
      }
      function disableAllPills(){pills.forEach(p=>p.disabled=true)}
      function enablePills(filterFn){pills.forEach(p=>{p.disabled=!filterFn(p.dataset.team)})}
      function enterWajibInitial(){
        mode="wajib-initial";currentTeam=gameState.teams[gameState.wajibTurnIndex]?.name||null;selectedTeam=currentTeam;highlightSelected(currentTeam);enablePills(t=>t===currentTeam);setBtnDisabled(okBtn,false);setBtnDisabled(wrongBtn,false);mainTimerControls.style.display="flex";rebuttalControls.style.display="none";dialogHint.textContent=`Soal Wajib • Giliran Tim ${currentTeam}`
      }
      function enterWajibLempar(){
        mode="wajib-lempar";setBtnDisabled(okBtn,true);setBtnDisabled(wrongBtn,true);enablePills(t=>t!==currentTeam);mainTimerControls.style.display="none";rebuttalControls.style.display="flex";dialogHint.textContent=`Fase Lempar • Tim selain ${currentTeam} dapat memilih selama 5 detik`;selectedTeam=null;highlightSelected("__none__")
      }
      function enterRebutan(){
        mode="rebutan";selectedTeam=null;enablePills(()=>true);setBtnDisabled(okBtn,true);setBtnDisabled(wrongBtn,true);mainTimerControls.style.display="flex";rebuttalControls.style.display="none";dialogHint.textContent="Babak Rebutan"
      }
      const onPillClick=(e)=>{
        const t=e.currentTarget.dataset.team;
        if(mode==="rebutan"){
          if(!selectedTeam){selectedTeam=t;highlightSelected(t);disableAllPills();setBtnDisabled(okBtn,false);setBtnDisabled(wrongBtn,false)}
        }else if(mode==="wajib-lempar"){
          if(!selectedTeam){selectedTeam=t;highlightSelected(t);disableAllPills();stopRebuttalTimer();setBtnDisabled(okBtn,false);setBtnDisabled(wrongBtn,false)}
        }else if(mode==="wajib-initial"){
          selectedTeam=currentTeam;highlightSelected(currentTeam)
        }
      };
      const onOkClick=(e)=>{
        if(!selectedTeam){e.preventDefault();pills.forEach(p=>{p.classList.add("animate-shake");setTimeout(()=>p.classList.remove("animate-shake"),400)})}
      };
      const onWrongClick=(e)=>{
        if(mode==="wajib-initial"){
          e.preventDefault();enterWajibLempar()
        }else{
          if(!selectedTeam){e.preventDefault();pills.forEach(p=>{p.classList.add("animate-shake");setTimeout(()=>p.classList.remove("animate-shake"),400)})}
        }
      };
      const onStartTimer=()=>{const dur=soal?.waktu?soal.waktu:15;startTimer(dur,()=>{if(mode==="wajib-initial"){enterWajibLempar()} })};
      const onStartRebuttal=()=>{startRebuttalTimer(()=>{dlg.returnValue="cancel";dlg.close()})};
      const escHandler=(ev)=>{if(ev.key==="Escape"){stopTimeUpSound()}};
      return new Promise(resolve=>{
        pills.forEach(p=>p.addEventListener("click",onPillClick));
        okBtn.addEventListener("click",onOkClick);
        wrongBtn.addEventListener("click",onWrongClick);
        startBtn.addEventListener("click",onStartTimer);
        startRebuttalBtn.addEventListener("click",onStartRebuttal);
        document.addEventListener("keydown",escHandler);
        const onClose=()=>{
          stopTimer();stopTimeUpSound();stopRebuttalTimer();
          document.removeEventListener("keydown",escHandler);
          dlg.removeEventListener("close",onClose);
          pills.forEach(p=>p.removeEventListener("click",onPillClick));
          okBtn.removeEventListener("click",onOkClick);
          wrongBtn.removeEventListener("click",onWrongClick);
          startBtn.removeEventListener("click",onStartTimer);
          startRebuttalBtn.removeEventListener("click",onStartRebuttal);
          dlg.classList.remove("translate-y-0","opacity-100");
          if(dlg.returnValue==="ok"&&selectedTeam){
            if(mode==="wajib-initial"){resolve({cancelled:false,team:selectedTeam,delta:100})}
            else if(mode==="wajib-lempar"){resolve({cancelled:false,team:selectedTeam,delta:100})}
            else{resolve({cancelled:false,team:selectedTeam,delta:100})}
          }else if(dlg.returnValue==="wrong"&&selectedTeam){
            if(mode==="wajib-lempar"){resolve({cancelled:false,team:selectedTeam,delta:-100})}
            else if(mode==="rebutan"){resolve({cancelled:false,team:selectedTeam,delta:-100})}
            else{resolve({cancelled:false,team:null,delta:0})}
          }else{
            resolve({cancelled:true,team:null,delta:0})
          }
        };
        if(gameState.currentPhase==="wajib"){enterWajibInitial()}else{enterRebutan()}
        dlg.addEventListener("close",onClose,{once:true});
        dlg.showModal();setTimeout(()=>{dlg.classList.add("translate-y-0","opacity-100")},10);
      });
    }

    function totalTeamsAvailable(){return Object.keys(teamColorConfigs).length}
    function startGame(){
      const input=document.getElementById("teamInput");
      let n=parseInt(input.value,10);
      if(isNaN(n)) n=3;
      if(n<2) n=2;
      if(n>26) n=26;
      gameState={teams:[],selected:{},currentPhase:"wajib",wajibTurnIndex:0,wajibAnsweredCount:0};
      for(let i=0;i<n;i++){const name=String.fromCharCode(65+i);gameState.teams.push({name,score:0})}
      saveState();
      setupContainer.classList.add("hidden");
      mainContainer.classList.remove("hidden");
      renderTeams();createGrid();updatePhaseUI();
    }

    function loadState(){
      const saved=localStorage.getItem(STORAGE_KEY);
      if(saved){
        const s=JSON.parse(saved);
        gameState=Object.assign({teams:[],selected:{},currentPhase:"wajib",wajibTurnIndex:0,wajibAnsweredCount:0},s);
        if(!gameState.selected||Array.isArray(gameState.selected)) gameState.selected={};
        setupContainer.classList.add("hidden");
        mainContainer.classList.remove("hidden");
        renderTeams();createGrid();updatePhaseUI();
      }else{
        mainContainer.classList.add("hidden");
        setupContainer.classList.remove("hidden");
      }
    }

    window.addEventListener("beforeunload",()=>{stopTimeUpSound()});
    window.addEventListener("load",()=>{loadQuestions();loadState()});
  </script>
</body>
</html>
