<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CSS 2.0 - Babak Semifinal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet"/>
  <script>
    tailwind.config={theme:{extend:{fontFamily:{poppins:["Poppins","sans-serif"]},animation:{shake:"shake 0.4s ease-in-out","pulse-danger":"pulse-danger 0.5s infinite","rotate-counter":"rotate-counter 12s linear infinite","rotate-counter-fast":"rotate-counter 6s linear infinite","points-rise":"points-rise 2s ease-out forwards","combo-draw":"combo-draw 2s ease-out forwards","score-pulse":"score-pulse 2s ease-out","slideUp":"slideUp 0.25s ease-out","fadeIn":"fadeIn 0.2s ease-out"},keyframes:{shake:{"0%,100%":{transform:"translateX(0)"},"20%,60%":{transform:"translateX(-4px)"},"40%,80%":{transform:"translateX(4px)"}}, "pulse-danger":{"0%,100%":{transform:"scale(1)"},"50%":{transform:"scale(1.05)"}}, "rotate-counter":{from:{transform:"rotate(0deg)"},to:{transform:"rotate(-360deg)"}}, "points-rise":{"0%":{opacity:0,transform:"translate(-50%, -10px) scale(0.95)"},"20%":{opacity:1,transform:"translate(-50%, -26px) scale(1.08)"},"80%":{opacity:1,transform:"translate(-50%, -54px) scale(1)"},"100%":{opacity:0,transform:"translate(-50%, -64px) scale(0.98)"}}, "combo-draw":{"0%":{opacity:0,transform:"scale(0.7)"},"40%":{opacity:1,transform:"scale(1.06)"},"100%":{opacity:1,transform:"scale(1)"}}, "score-pulse":{"0%":{transform:"scale(1)",textShadow:"0 0 0 rgba(255,255,255,0)"},"20%":{transform:"scale(1.2)",textShadow:"0 0 12px rgba(255,255,255,0.9)"},"100%":{transform:"scale(1)",textShadow:"0 0 0 rgba(255,255,255,0)"}}, slideUp:{from:{opacity:"0",transform:"translateY(12px)"},to:{opacity:"1",transform:"translateY(0)"}}, fadeIn:{from:{opacity:"0"},to:{opacity:"1"}}}}}};
  </script>
  <style>
    body{font-family:'Poppins',sans-serif}
    input[type="number"]::-webkit-inner-spin-button,input[type="number"]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
    input[type="number"]{-moz-appearance:textfield}
    .bonus-points-text{position:absolute;pointer-events:none;font-size:2rem;font-weight:700;color:#fff;text-shadow:0 0 10px rgba(255,255,255,.85),0 0 18px rgba(255,255,255,.55);z-index:51}
    .combo-mark{position:absolute;pointer-events:none;width:4rem;height:4rem;border:3px solid #fff;border-radius:.375rem;box-shadow:0 0 12px rgba(255,255,255,.8);z-index:40;opacity:0}
  </style>
</head>
<body class="min-h-screen bg-black font-poppins overflow-hidden">
  <div class="fixed inset-0 opacity-5 pointer-events-none" style="background:linear-gradient(90deg, white 1px, transparent 1px),linear-gradient(white 1px, transparent 1px);background-size:10px 10px;"></div>
  <div class="fixed top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[500px] h-[500px] pointer-events-none z-0">
    <div class="absolute w-[500px] h-[500px] rounded-full animate-rotate-counter">
      <div class="absolute w-[120px] h-[120px] rounded-full bg-red-500/50 shadow-[0_0_80px_40px_rgba(239,68,68,0.4),0_0_200px_100px_rgba(239,68,68,0.4)]"></div>
    </div>
    <div class="absolute w-[300px] h-[300px] top-[100px] left-[100px] rounded-full animate-rotate-counter-fast">
      <div class="absolute w-[120px] h-[120px] rounded-full bg-blue-500/50 shadow-[0_0_80px_40px_rgba(59,130,246,0.4),0_0_200px_100px_rgba(59,130,246,0.4)]"></div>
    </div>
  </div>

  <dialog id="q-dialog" class="rounded-2xl p-0 backdrop:bg-black/50 bg-white/90 opacity-0 shadow-2xl fixed transition-all duration-300 border-0">
    <form method="dialog" class="min-w-[60rem] max-w-[90vw] rounded-2xl relative">
      <button type="button" id="close-dialog-btn" class="absolute top-4 right-4 text-gray-500 hover:text-gray-800 text-2xl leading-none font-semibold outline-none focus:outline-none transition-colors duration-200 w-8 h-8 flex items-center justify-center rounded-full hover:bg-gray-100">×</button>
      <header class="px-6 py-4 text-center border-b border-gray-200">
        <h3 class="font-bold text-2xl text-gray-800">Pertanyaan <span id="q-zone-indicator" class="text-yellow-500"></span></h3>
      </header>
      <section id="q-section" class="px-6 py-6 text-center min-h-[120px] flex items-center justify-center">
        <blockquote id="q-text" class="italic text-lg text-black font-bold leading-relaxed">"Soal tidak terdeteksi"</blockquote>
      </section>
      <section class="px-6 py-4 text-center">
        <button type="button" id="toggle-answer-btn" class="px-4 py-2 bg-gradient-to-r from-blue-500 to-blue-600 hover:from-blue-600 hover:to-blue-700 text-white rounded-lg font-semibold transition-all duration-200 hover:shadow-lg hover:-translate-y-0.5 mb-3">Tampilkan Jawaban</button>
        <div id="answer-section" class="hidden min-h-[80px] items-center justify-center bg-green-50 rounded-lg p-4 border-2 border-green-200">
          <blockquote id="answer-text" class="italic text-lg text-green-800 font-bold leading-relaxed">"Jawaban"</blockquote>
        </div>
      </section>
      <div class="flex items-center justify-center mb-6 gap-3 px-6">
        <button type="button" id="start-timer-btn" class="px-5 py-2.5 bg-gradient-to-r from-emerald-500 to-emerald-600 hover:from-emerald-600 hover:to-emerald-700 text-white rounded-lg font-semibold transition-all duration-200 hover:shadow-lg hover:-translate-y-0.5 disabled:opacity-50 disabled:cursor-not-allowed">Start ▶</button>
        <div id="timer-display" class="text-3xl font-bold font-mono min-w-[110px] text-center px-4 py-2 rounded-lg bg-gradient-to-br from-gray-600/30 to-gray-700/30 text-emerald-500 shadow-inner">00:00</div>
      </div>
      <div class="relative px-6 pb-6 flex items-center justify-center">
        <div id="team-pills-container" class="flex flex-wrap gap-2 justify-center max-w-xl"></div>
        <div class="absolute right-6 bottom-6 flex gap-2">
          <button id="q-wrong" value="wrong" class="h-10 w-10 rounded-lg grid place-items-center cursor-pointer bg-red-500 hover:bg-red-600 text-white font-bold text-xl transition-all hover:scale-110 shadow-md">✗</button>
          <button id="q-ok" value="ok" class="h-10 w-10 rounded-lg cursor-pointer grid place-items-center bg-green-500 hover:bg-green-600 text-white font-bold text-xl transition-all hover:scale-110 shadow-md">✓</button>
        </div>
      </div>
    </form>
  </dialog>

  <div id="setupContainer" class="fixed inset-0 z-[2000] flex items-center justify-center bg-black/70 hidden">
    <div class="bg-gradient-to-br from-slate-800 to-slate-900 border-2 border-white/20 rounded-xl p-10 text-center animate-slideUp">
      <h2 class="mb-5 text-2xl font-bold bg-gradient-to-r from-amber-400 to-amber-500 text-transparent bg-clip-text">Atur Jumlah Tim</h2>
      <input type="number" id="teamInput" value="3" min="2" max="4" class="p-2.5 border-2 border-amber-500/30 rounded-md bg-white/10 text-white text-base mb-4 w-52 text-center">
      <br>
      <button onclick="startGame()" class="bg-gradient-to-r from-green-500 to-green-600 text-white py-2.5 px-8 border-none rounded-md font-semibold cursor-pointer transition-all duration-300 hover:scale-105">Mulai Game</button>
    </div>
  </div>

  <div id="mainContainer" class="relative z-10 py-4 max-w-6xl w-full mx-auto flex flex-col min-h-screen hidden">
    <div class="fixed top-0 left-0 p-4 flex items-center gap-2 z-20">
      <img src="../resources/himacom.png" class="w-10 h-10" alt=""/>
      <img src="../resources/logocss.png" class="w-10 h-10" alt=""/>
      <div class="flex flex-col">
        <h1 class="text-white text-2xl font-bold">CSS<span class="text-sm ml-1">2.0</span></h1>
        <h1 class="text-white text-lg font-bold">Babak Semifinal</h1>
      </div>
    </div>
    <div class="flex flex-col items-center justify-center flex-grow">
      <div id="team-container" class="flex flex-wrap gap-4 items-center justify-center mb-10 w-full max-w-4xl px-4"></div>
      <div id="game-grid" class="grid gap-2 mb-8 relative" style="grid-template-columns: repeat(6, 4rem);"></div>
    </div>
    <div class="fixed bottom-0 right-0 p-4 z-20">
      <button onclick="resetBoard()" class="px-6 py-2 bg-red-600 hover:bg-red-700 text-white font-bold rounded-lg transition-all duration-300 hover:scale-105 text-sm shadow-lg">Reset</button>
    </div>
    <div class="fixed bottom-0 left-0 p-4 z-20">
      <a href="homepage.html" class="inline-block px-6 py-2 bg-red-600 hover:bg-red-700 text-white font-bold rounded-lg transition-all duration-300 hover:scale-105 text-sm shadow-lg">Back</a>
    </div>
  </div>

  <script src="../soal/soalSemifinal.js"></script>
  <script>
    const STORAGE_KEY="semifinalGameState";
    const GRID_ROWS=6,GRID_COLS=6;
    let gameState={teams:[],selected:{},bonusApplied:{},comboCount:{},usedInCombo:{}};
    let questions={};
    let timeUpAudio=null,audioLoopInterval=null,beepAudio=null;
    const teamColorConfigs={A:{bg:"from-red-400 to-red-500",bgDark:"from-red-500 to-red-600",border:"border-red-600",hex:"#ef4444",hover:"hover:bg-red-400",selected:"bg-red-400"},B:{bg:"from-blue-400 to-blue-500",bgDark:"from-blue-500 to-blue-600",border:"border-blue-600",hex:"#3b82f6",hover:"hover:bg-blue-400",selected:"bg-blue-400"},C:{bg:"from-yellow-400 to-yellow-500",bgDark:"from-yellow-500 to-yellow-600",border:"border-yellow-600",hex:"#eab308",hover:"hover:bg-yellow-400",selected:"bg-yellow-400"},D:{bg:"from-green-400 to-green-500",bgDark:"from-green-500 to-green-600",border:"border-green-600",hex:"#22c55e",hover:"hover:bg-green-400",selected:"bg-green-400"}};
    const setupContainer=document.getElementById("setupContainer");
    const mainContainer=document.getElementById("mainContainer");
    const teamContainer=document.getElementById("team-container");
    const gridContainer=document.getElementById("game-grid");

    function showCustomConfirm(message,onConfirm){
      if(document.getElementById("customConfirmModal"))return;
      const confirmModal=document.createElement("div");
      confirmModal.id="customConfirmModal";
      confirmModal.className="fixed inset-0 z-[3000] flex items-center justify-center bg-black/70 animate-fadeIn";
      confirmModal.innerHTML=`<div class="bg-gradient-to-br from-slate-700 to-slate-800 border-2 border-white/20 rounded-xl p-8 text-center animate-slideUp max-w-sm w-11/12"><p class="text-white text-lg mb-8">${message}</p><div class="flex justify-center gap-4"><button id="customConfirmCancelBtn" class="bg-slate-500 text-white py-2 px-6 rounded-md font-semibold transition-transform hover:scale-105">Batal</button><button id="customConfirmOkBtn" class="bg-red-500 text-white py-2 px-6 rounded-md font-semibold transition-transform hover:scale-105">Yakin</button></div></div>`;
      document.body.appendChild(confirmModal);
      document.getElementById("customConfirmOkBtn").onclick=()=>{confirmModal.remove();if(typeof onConfirm==="function")onConfirm()};
      document.getElementById("customConfirmCancelBtn").onclick=()=>{confirmModal.remove()}
    }

    function saveState(){localStorage.setItem(STORAGE_KEY,JSON.stringify(gameState))}
    function loadQuestions(){questions={};if(typeof dataSemifinal1!=="undefined"){dataSemifinal1.forEach(q=>{questions[q.id]=q})}}
    function initializeDefaultState(n=3){gameState.teams=[];for(let i=0;i<n;i++){const name=String.fromCharCode(65+i);gameState.teams.push({name,score:500,zones:0})}gameState.selected={};gameState.bonusApplied={};gameState.comboCount={};gameState.usedInCombo={};gameState.teams.forEach(t=>gameState.comboCount[t.name]=0)}
    function loadState(){const saved=localStorage.getItem(STORAGE_KEY);if(saved){try{const s=JSON.parse(saved);gameState=Object.assign({teams:[],selected:{},bonusApplied:{},comboCount:{},usedInCombo:{}},s);if(!gameState.selected||Array.isArray(gameState.selected))gameState.selected={};setupContainer.classList.add("hidden");mainContainer.classList.remove("hidden");renderTeams();createGrid()}catch{setupContainer.classList.remove("hidden");mainContainer.classList.add("hidden")}}else{setupContainer.classList.remove("hidden");mainContainer.classList.add("hidden")}}
    function startGame(){const input=document.getElementById("teamInput");let n=parseInt(input.value,10);if(isNaN(n))n=3;if(n<2)n=2;if(n>4)n=4;initializeDefaultState(n);saveState();setupContainer.classList.add("hidden");mainContainer.classList.remove("hidden");loadQuestions();renderTeams();createGrid()}
    function resetBoard(){showCustomConfirm("Yakin reset permainan?",()=>{localStorage.removeItem(STORAGE_KEY);window.location.reload()})}

    function renderTeams(){teamContainer.innerHTML="";gameState.teams.forEach(team=>{const colors=teamColorConfigs[team.name]||teamColorConfigs.A;const div=document.createElement("div");div.className=`rounded-lg overflow-hidden shadow-lg w-32 flex flex-col bg-gradient-to-br ${colors.bgDark} border-2 ${colors.border}`;div.innerHTML=`<div class="text-center bg-gradient-to-br ${colors.bg}"><span class="text-xl font-bold text-white">${team.name}</span></div><div class="text-center bg-black/20"><input type="number" id="score-${team.name}" class="text-lg font-bold text-white bg-transparent text-center w-full outline-none border-none p-0" value="${team.score}" data-team-name="${team.name}"></div><div class="text-center py-1 bg-black/30 text-xs text-white">Zona: <span id="zones-${team.name}" class="font-bold">${team.zones||0}</span></div><div class="text-center py-1 bg-black/30 text-xs text-white border-t border-white/20">Combo: <span id="combo-${team.name}" class="font-bold text-yellow-400">${gameState.comboCount[team.name]||0}</span></div>`;teamContainer.appendChild(div);div.querySelector(`#score-${team.name}`).addEventListener("change",e=>{let v=parseInt(e.currentTarget.value,10);if(isNaN(v))v=0;team.score=v;saveState()})})}
    function updateTeamZones(teamName){const team=gameState.teams.find(t=>t.name===teamName);if(!team)return;team.zones=Object.values(gameState.selected).filter(t=>t===teamName).length;const el=document.getElementById(`zones-${teamName}`);if(el)el.textContent=team.zones;saveState()}
    function updateComboDisplay(teamName){const el=document.getElementById(`combo-${teamName}`);if(el)el.textContent=gameState.comboCount[teamName]||0}

    function createGrid(){gridContainer.innerHTML="";for(let r=0;r<GRID_ROWS;r++){for(let c=0;c<GRID_COLS;c++){const rowLetter=String.fromCharCode(65+r),cellId=rowLetter+(c+1),soal=questions[cellId];if(!soal){const ph=document.createElement("div");ph.className="h-16 w-16 rounded-full bg-transparent";gridContainer.appendChild(ph);continue}const btn=document.createElement("button");const selected=gameState.selected[cellId];let cls="";if(selected){if(selected==="failed"){cls="bg-black border-2 border-gray-700 text-gray-700 shadow-inner cursor-not-allowed"}else if(selected==="gray"){cls="bg-gradient-to-br from-gray-400 to-gray-500 border-2 border-gray-600 text-gray-900 shadow-lg"}else{const team=gameState.teams.find(t=>t.name===selected);const colors=team?teamColorConfigs[team.name]:null;cls=colors?`bg-gradient-to-br ${colors.bg} border-2 ${colors.border} text-white shadow-lg`:"bg-gradient-to-br from-gray-400 to-gray-500 border-2 border-gray-600 text-gray-900 shadow-lg"}}else{cls="bg-black/50 border-2 border-white/60 text-white hover:bg-gradient-to-br hover:from-gray-300/90 hover:to-gray-400 hover:shadow-xl hover:border-white/80"}btn.className=`h-16 w-16 rounded-full font-bold text-xl transition-all duration-300 flex items-center justify-center ${selected?"":"hover:scale-105 cursor-pointer"} ${cls}`;btn.dataset.cellId=cellId;if(soal.goldenZone===true){btn.innerHTML=`<div class="relative flex items-center justify-center"><span>${cellId}</span><span class="absolute -top-4 -right-3 text-yellow-400 text-lg">⭐</span></div>`;if(!selected)btn.classList.add("shadow-[0_0_15px_rgba(234,179,8,0.9)]")}else{btn.innerText=cellId}if(!selected)btn.onclick=handleCellClick;gridContainer.appendChild(btn)}}renderPermanentComboBorders()}

    let timerInterval=null,timeRemaining=0;
    const fmt=t=>`${String(Math.floor(t/60)).padStart(2,"0")}:${String(t%60).padStart(2,"0")}`;
    function updateTimerDisplay(){const d=document.getElementById("timer-display");if(!d)return;d.textContent=fmt(timeRemaining);d.className="text-3xl font-bold font-mono min-w-[110px] text-center px-4 py-2 rounded-lg bg-gradient-to-br from-gray-600/30 to-gray-700/30 shadow-inner";if(timeRemaining<=3&&timeRemaining>0){d.classList.add("text-red-500","animate-pulse-danger");d.style.textShadow="0 0 10px rgba(239,68,68,.7)"}else if(timeRemaining<=5){d.classList.add("text-yellow-500");d.style.textShadow="0 0 10px rgba(245,158,11,.5)"}else{d.classList.add("text-emerald-500");d.style.textShadow="0 0 10px rgba(16,185,129,.5)"}}

    function playTimeUpSound(){
      stopTimeUpSound();
      try{
        timeUpAudio=new Audio("../resources/timeup.mp3");
        timeUpAudio.currentTime=0;
        timeUpAudio.play().catch(()=>{});
        let count=0;
        audioLoopInterval=setInterval(()=>{
          count++;
          if(count<3){
            const a=new Audio("../resources/timeup.mp3");
            a.currentTime=0;
            a.play().catch(()=>{});
          }else{
            clearInterval(audioLoopInterval);
            audioLoopInterval=null;
          }
        },1000);
      }catch(_){}
    }
    function stopTimeUpSound(){if(timeUpAudio){timeUpAudio.pause();timeUpAudio.currentTime=0;timeUpAudio=null}if(audioLoopInterval){clearInterval(audioLoopInterval);audioLoopInterval=null}}
    function playBeepSound(){beepAudio=new Audio("../resources/beep.mp3");beepAudio.play().catch(()=>{})}

    function startTimer(dur){const b=document.getElementById("start-timer-btn");if(b)b.disabled=true;timeRemaining=dur;updateTimerDisplay();if(timerInterval)clearInterval(timerInterval);timerInterval=setInterval(()=>{timeRemaining--;updateTimerDisplay();if(timeRemaining<=0){stopTimer();playTimeUpSound()}},1000)}
    function stopTimer(){if(timerInterval){clearInterval(timerInterval);timerInterval=null}}

    function getCellId(r,c){if(r<0||r>=GRID_ROWS||c<0||c>=GRID_COLS)return null;return String.fromCharCode(65+r)+(c+1)}
    function cellIdToCoords(id){if(!id||id.length<2)return[null,null];const r=id.charCodeAt(0)-65,c=parseInt(id.slice(1))-1;if(isNaN(r)||isNaN(c)||r<0||c<0||r>=GRID_ROWS||c>=GRID_COLS)return[null,null];return[r,c]}

    function checkForBonus(answeredCellId,teamName){const[sr,sc]=cellIdToCoords(answeredCellId);if(sr===null)return false;const dirs=[[0,1],[1,0],[1,1],[1,-1]];const L=4;let got=false;for(const[dr,dc]of dirs){let line=[answeredCellId];for(let k=1;k<L;k++){const id=getCellId(sr+k*dr,sc+k*dc);if(id&&gameState.selected[id]===teamName)line.push(id);else break}for(let k=1;k<L;k++){const id=getCellId(sr-k*dr,sc-k*dc);if(id&&gameState.selected[id]===teamName)line.unshift(id);else break}if(line.length>=L){for(let i=0;i<=line.length-L;i++){const seg=line.slice(i,i+L);if(seg.some(cid=>gameState.usedInCombo[cid]))continue;runComboSequence(seg,teamName);got=true}}}if(!got)saveState();return got}
    function cellPixelPosition(cellId){const[r,c]=cellIdToCoords(cellId);if(r===null)return{top:0,left:0};const size=64,gap=8;return{top:r*(size+gap),left:c*(size+gap)}}
    function renderPermanentComboBorders(){Array.from(gridContainer.querySelectorAll(".combo-mark")).forEach(el=>el.remove());Object.keys(gameState.usedInCombo).forEach(cellId=>{if(!gameState.usedInCombo[cellId])return;const{top,left}=cellPixelPosition(cellId);const owner=gameState.selected[cellId];const color=teamColorConfigs[owner]?.hex||"#fff";const mark=document.createElement("div");mark.className="combo-mark";mark.style.top=`${top}px`;mark.style.left=`${left}px`;mark.style.borderColor=color;mark.style.boxShadow=`0 0 12px ${color}`;mark.style.opacity="1";gridContainer.appendChild(mark)})}
    async function runComboSequence(segCells,teamName){const color=teamColorConfigs[teamName]?.hex||"#fff";await animateComboBoxes(segCells,color,2000);segCells.forEach(cid=>{gameState.usedInCombo[cid]=true});await animatePlusPoints(segCells,2000);await animateScoreIncrease(teamName,100,2000);gameState.comboCount[teamName]=(gameState.comboCount[teamName]||0)+1;updateComboDisplay(teamName);saveState()}
    function animateComboBoxes(segCells,color,duration){return new Promise(resolve=>{segCells.forEach(cid=>{const{top,left}=cellPixelPosition(cid);const mark=document.createElement("div");mark.className="combo-mark animate-combo-draw";mark.style.top=`${top}px`;mark.style.left=`${left}px`;mark.style.borderColor=color;mark.style.boxShadow=`0 0 12px ${color}`;gridContainer.appendChild(mark)});setTimeout(resolve,duration)})}
    function animatePlusPoints(segCells,duration){return new Promise(resolve=>{const[r0,c0]=cellIdToCoords(segCells[0]);const[r3,c3]=cellIdToCoords(segCells[3]);const r=(r0+r3)/2,c=(c0+c3)/2;const size=64,gap=8,cellSize=size+gap;const centerX=c*cellSize+size/2,centerY=r*cellSize+size/2;const el=document.createElement("span");el.className="bonus-points-text animate-points-rise";el.textContent="+100";el.style.left=`${centerX}px`;el.style.top=`${centerY}px`;el.style.transform="translate(-50%, -50%)";gridContainer.appendChild(el);setTimeout(()=>{el.remove();resolve()},duration)})}
    function animateScoreIncrease(teamName,delta,duration){return new Promise(resolve=>{const team=gameState.teams.find(t=>t.name===teamName);if(!team){resolve();return}const input=document.getElementById(`score-${team.name}`);if(!input){team.score+=delta;resolve();return}const startVal=team.score,endVal=team.score+delta,t0=performance.now();input.classList.add("animate-score-pulse");function tick(now){const t=Math.min(1,(now-t0)/duration);const eased=t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;input.value=Math.round(startVal+(endVal-startVal)*eased);if(t<1)requestAnimationFrame(tick);else{input.value=endVal;team.score=endVal;input.classList.remove("animate-score-pulse");resolve()}}requestAnimationFrame(tick)})}

    async function handleCellClick(event){const button=event.currentTarget;const cellId=button.dataset.cellId;if(gameState.selected[cellId])return;const res=await qPopUp(cellId);if(!res||res.cancelled)return;const applyFailedUI=()=>{button.className="h-16 w-16 rounded-full font-bold text-xl bg-black border-2 border-gray-700 text-gray-700 shadow-inner cursor-not-allowed flex items-center justify-center";button.innerText="✗";gameState.selected[cellId]="failed"};if(res.phase==="first"){const team=gameState.teams.find(t=>t.name===res.team);if(!team)return;team.score+=res.delta;document.getElementById(`score-${team.name}`).value=team.score;if(res.delta>0){const colors=teamColorConfigs[team.name]||teamColorConfigs["A"];button.className=`h-16 w-16 rounded-full font-bold text-xl bg-gradient-to-br ${colors.bg} border-2 ${colors.border} text-white shadow-lg transition-all duration-300 flex items-center justify-center`;const soal=questions[cellId];button.innerHTML=soal?.goldenZone?`<div class="relative flex items-center justify-center"><span>${cellId}</span><span class="absolute -top-4 -right-3 text-yellow-400 text-lg">⭐</span></div>`:cellId;gameState.selected[cellId]=team.name;updateTeamZones(team.name);checkForBonus(cellId,team.name);saveState()}else{applyFailedUI();saveState()}button.classList.remove("hover:scale-105","cursor-pointer");return}if(res.phase==="rebound"){const team=gameState.teams.find(t=>t.name===res.team);if(!team){applyFailedUI();saveState();return}team.score+=res.delta;document.getElementById(`score-${team.name}`).value=team.score;if(res.final==="correct"){const colors=teamColorConfigs[team.name]||teamColorConfigs["A"];button.className=`h-16 w-16 rounded-full font-bold text-xl bg-gradient-to-br ${colors.bg} border-2 ${colors.border} text-white shadow-lg transition-all duration-300 flex items-center justify-center`;button.innerText=cellId;gameState.selected[cellId]=team.name;updateTeamZones(team.name);checkForBonus(cellId,team.name)}else{applyFailedUI()}button.classList.remove("hover:scale-105","cursor-pointer");saveState();return}if(res.phase==="rebutan_timeout"||res.phase==="manual_close_rebutan"){applyFailedUI();button.classList.remove("hover:scale-105","cursor-pointer");saveState()}}

    async function qPopUp(cellId){const dlg=document.getElementById("q-dialog");const qSection=document.getElementById("q-section");const answerSection=document.getElementById("answer-section");const toggleAnswerBtn=document.getElementById("toggle-answer-btn");const zoneIndicator=document.getElementById("q-zone-indicator");const okBtn=document.getElementById("q-ok");const wrongBtn=document.getElementById("q-wrong");const closeDialogBtn=document.getElementById("close-dialog-btn");const startBtn=document.getElementById("start-timer-btn");const timerDisplay=document.getElementById("timer-display");const pillsContainer=document.getElementById("team-pills-container");const soal=questions[cellId];let pointsCorrect=100,pointsWrong=-100;if(soal&&soal.goldenZone===true){pointsCorrect=200;pointsWrong=-200;zoneIndicator.textContent="⭐ GOLDEN ZONE"}else zoneIndicator.textContent="";let selectedTeam=null;let firstTeam=null;let reboundTeam=null;let isRebutan=false;let rebutRemain=5;let rebutInterval=null;const setRebutanTimerDisplay=s=>{timerDisplay.textContent=`Rebutan ${String(s).padStart(2,"0")}`;timerDisplay.className="text-3xl font-bold font-mono min-w-[110px] text-center px-4 py-2 rounded-lg bg-gradient-to-br from-gray-600/30 to-gray-700/30 text-blue-400 shadow-inner";timerDisplay.style.textShadow="0 0 10px rgba(59,130,246,.7)"};const startRebutTimer=()=>{stopTimer();setRebutanTimerDisplay(rebutRemain);rebutInterval=setInterval(()=>{rebutRemain--;setRebutanTimerDisplay(rebutRemain);if(rebutRemain<=0){stopRebutTimer();playTimeUpSound();Array.from(pillsContainer.querySelectorAll("button[data-team]")).forEach(p=>{p.classList.add("opacity-50","cursor-not-allowed");p.disabled=true});timerDisplay.textContent="Waktu Habis";timerDisplay.classList.remove("text-blue-400");timerDisplay.classList.add("text-red-400");timerDisplay.style.textShadow="0 0 10px rgba(248,113,113,.7)"}},1000)};const stopRebutTimer=()=>{if(rebutInterval){clearInterval(rebutInterval);rebutInterval=null}};pillsContainer.innerHTML="";gameState.teams.forEach(team=>{const colors=teamColorConfigs[team.name]||teamColorConfigs["A"];const pill=document.createElement("button");pill.type="button";pill.dataset.team=team.name;pill.className=`border-2 border-gray-300 rounded-lg px-5 py-2.5 cursor-pointer bg-gray-100 text-xl font-semibold transition-all ${colors.hover} hover:text-white hover:border-transparent hover:scale-105`;pill.textContent=team.name;pillsContainer.appendChild(pill)});const pills=Array.from(pillsContainer.querySelectorAll("button[data-team]"));if(soal){if(soal.pertanyaan?.includes("png")){qSection.innerHTML=`<img src="${soal.pertanyaan}" class="h-full w-full" alt="soal">`}else{qSection.innerHTML=`<blockquote id="q-text" class="italic text-lg text-black font-bold font-poppins leading-relaxed">${soal.pertanyaan||"Pertanyaan tidak ditemukan."}</blockquote>`}const jawaban=soal.jawaban??"Belum ada jawaban.";const isImg=typeof jawaban==="string"&&/\.(png|jpe?g|gif|webp|svg)$/i.test(jawaban);if(isImg){answerSection.innerHTML=`<img src="${jawaban}" class="max-h-72 object-contain mx-auto" alt="jawaban">`}else{answerSection.innerHTML=`<blockquote id="answer-text" class="italic text-lg text-green-800 font-bold leading-relaxed">${jawaban}</blockquote>`}timerDisplay.textContent=fmt(soal.waktu||0)}else{qSection.innerHTML=`<blockquote class="italic text-lg text-black font-bold leading-relaxed">Soal untuk ${cellId} tidak ditemukan.</blockquote>`;answerSection.innerHTML=`<blockquote id="answer-text" class="italic text-lg text-green-800 font-bold leading-relaxed">Tidak tersedia.</blockquote>`;timerDisplay.textContent=fmt(0)}answerSection.classList.add("hidden");answerSection.classList.remove("flex");toggleAnswerBtn.textContent="Tampilkan Jawaban";toggleAnswerBtn.onclick=()=>{const vis=!answerSection.classList.contains("hidden");if(vis){answerSection.classList.add("hidden");answerSection.classList.remove("flex");toggleAnswerBtn.textContent="Tampilkan Jawaban"}else{answerSection.classList.remove("hidden");answerSection.classList.add("flex");toggleAnswerBtn.textContent="Sembunyikan Jawaban"}};stopTimer();stopTimeUpSound();stopRebutTimer();if(startBtn)startBtn.disabled=false;startBtn.textContent="Start ▶";timerDisplay.className="text-3xl font-bold font-mono min-w-[110px] text-center px-4 py-2 rounded-lg bg-gradient-to-br from-gray-600/30 to-gray-700/30 text-emerald-500 shadow-inner";timerDisplay.style.textShadow="0 0 10px rgba(16,185,129,.5)";return new Promise(resolve=>{const escHandler=e=>{if(e.key==="Escape")handleManualClose()};const handleManualClose=()=>{stopTimer();stopTimeUpSound();stopRebutTimer();if(isRebutan&&!reboundTeam){dlg.close("manual_close_rebutan")}else{dlg.close("cancelled")}};const selectTeamUI=teamName=>{selectedTeam=teamName;pills.forEach(p=>{const colors=teamColorConfigs[p.dataset.team]||teamColorConfigs["A"];p.className=p.dataset.team===selectedTeam?`border-2 border-transparent rounded-lg px-5 py-2.5 cursor-pointer text-xl font-semibold transition-all ${colors.selected} text-white shadow-md scale-105`:`border-2 border-gray-300 rounded-lg px-5 py-2.5 cursor-pointer bg-gray-100 text-xl font-semibold transition-all ${colors.hover} hover:text-white hover:border-transparent hover:scale-105`})};const disablePill=teamName=>{const pill=pills.find(p=>p.dataset.team===teamName);if(!pill)return;pill.classList.add("opacity-50","cursor-not-allowed");pill.disabled=true};const enableOtherPills=exceptName=>{pills.forEach(p=>{if(p.dataset.team===exceptName)return;p.classList.remove("opacity-50","cursor-not-allowed");p.disabled=false})};const onPillClick=e=>{const teamName=e.currentTarget.dataset.team;if(isRebutan){if(firstTeam&&teamName===firstTeam)return;if(reboundTeam)return;reboundTeam=teamName;selectTeamUI(teamName);stopRebutTimer();pills.forEach(p=>{if(p.dataset.team!==reboundTeam){p.disabled=true;p.classList.add("opacity-50","cursor-not-allowed")}})}else{firstTeam=teamName;selectTeamUI(teamName)}};const shakePills=()=>{pills.forEach(p=>{p.classList.add("animate-shake");setTimeout(()=>p.classList.remove("animate-shake"),400)})};const onOkClick=e=>{if(!selectedTeam){e.preventDefault();shakePills();return}if(!isRebutan){dlg.close("first_ok")}else{if(!reboundTeam){e.preventDefault();shakePills();return}dlg.close("rebound_correct")}};const onWrongClick=e=>{if(!selectedTeam){e.preventDefault();shakePills();return}if(!isRebutan){e.preventDefault();const team=gameState.teams.find(t=>t.name===firstTeam);if(team){team.score+=pointsWrong;const scoreInput=document.getElementById(`score-${team.name}`);if(scoreInput){scoreInput.value=team.score;scoreInput.style.transition="transform 0.2s ease";scoreInput.style.transform="scale(0.95)";setTimeout(()=>{scoreInput.style.transform="scale(1)"},200)}}disablePill(firstTeam);isRebutan=true;selectedTeam=null;stopTimer();setRebutanTimerDisplay(rebutRemain);if(startBtn){startBtn.disabled=false;startBtn.textContent="Mulai Rebutan"}enableOtherPills(firstTeam)}else{if(!reboundTeam){e.preventDefault();shakePills();return}dlg.close("rebound_wrong")}};const onStartTimer=()=>{if(!isRebutan){if(soal?.waktu)startTimer(soal.waktu);else startTimer(15);if(startBtn)startBtn.disabled=true}else{startRebutTimer();if(startBtn)startBtn.disabled=true}};const onCloseDialogBtn=()=>{handleManualClose()};const onClose=()=>{stopTimer();stopTimeUpSound();stopRebutTimer();document.removeEventListener("keydown",escHandler);dlg.removeEventListener("close",onClose);pills.forEach(p=>p.removeEventListener("click",onPillClick));okBtn?.removeEventListener("click",onOkClick);wrongBtn?.removeEventListener("click",onWrongClick);closeDialogBtn?.removeEventListener("click",onCloseDialogBtn);startBtn?.removeEventListener("click",onStartTimer);dlg.classList.remove("translate-y-0","opacity-100");const rv=dlg.returnValue;if(rv==="first_ok"&&firstTeam){resolve({cancelled:false,phase:"first",team:firstTeam,delta:pointsCorrect});return}if(rv==="rebound_correct"&&reboundTeam){resolve({cancelled:false,phase:"rebound",team:reboundTeam,delta:+100,final:"correct"});return}if(rv==="rebound_wrong"&&reboundTeam){resolve({cancelled:false,phase:"rebound",team:reboundTeam,delta:-100,final:"wrong"});return}if(rv==="manual_close_rebutan"||(isRebutan&&!reboundTeam)){resolve({cancelled:false,phase:"manual_close_rebutan",team:null,delta:0,final:"failed"});return}resolve({cancelled:true})};pills.forEach(p=>p.addEventListener("click",onPillClick));okBtn?.addEventListener("click",onOkClick);wrongBtn?.addEventListener("click",onWrongClick);closeDialogBtn?.addEventListener("click",onCloseDialogBtn);startBtn?.addEventListener("click",onStartTimer);document.addEventListener("keydown",escHandler);dlg.addEventListener("close",onClose,{once:true});dlg.showModal();setTimeout(()=>dlg.classList.add("translate-y-0","opacity-100"),10)})}

    window.addEventListener("beforeunload",()=>stopTimeUpSound());
    window.addEventListener("load",()=>{loadQuestions();loadState()});
