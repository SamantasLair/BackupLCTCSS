<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CSS 2.0 - Babak Semifinal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,300;0,400;0,600;1,400&display=swap"
        rel="stylesheet" />

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { poppins: ["Poppins", "sans-serif"] },
                    animation: {
                        shake: "shake 0.4s ease-in-out",
                        "pulse-danger": "pulse-danger 0.5s infinite",
                        "glow-pulse": "glow-pulse 6s ease-in-out infinite",
                        "rotate-counter": "rotate-counter 12s linear infinite",
                        "rotate-counter-fast": "rotate-counter 6s linear infinite",
                        "zone-flash": "zone-flash 4s ease-out",
                        "points-rise": "points-rise 4s ease-out",
                    },
                    keyframes: {
                        shake: {
                            "0%, 100%": { transform: "translateX(0)" },
                            "20%, 60%": { transform: "translateX(-4px)" },
                            "40%, 80%": { transform: "translateX(4px)" },
                        },
                        "pulse-danger": {
                            "0%, 100%": { transform: "scale(1)" },
                            "50%": { transform: "scale(1.05)" },
                        },
                        "glow-pulse": {
                            "0%, 100%": { transform: "scale(1)" },
                            "50%": { transform: "scale(1.1)" },
                        },
                        "rotate-counter": {
                            from: { transform: "rotate(0deg)" },
                            to: { transform: "rotate(-360deg)" },
                        },
                        "zone-flash": {
                            "0%": { opacity: "0", transform: "scale(0.95)" },
                            "15%": { opacity: "1", transform: "scale(1.02)" },
                            "85%": { opacity: "1", transform: "scale(1)" },
                            "100%": { opacity: "0", transform: "scale(1)" },
                        },
                        "points-rise": {
                            "0%": {
                                opacity: "0",
                                transform: "translate(-50%, 0) scale(0.8)",
                            },
                            "15%": {
                                opacity: "1",
                                transform: "translate(-50%, -20px) scale(1.1)",
                            },
                            "85%": {
                                opacity: "1",
                                transform: "translate(-50%, -50px) scale(1)",
                            },
                            "100%": {
                                opacity: "0",
                                transform: "translate(-50%, -60px) scale(0.9)",
                            },
                        },
                    },
                },
            },
        };
    </script>

    <style>
        input[type="number"]::-webkit-inner-spin-button,
        input[type="number"]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        input[type="number"] {
            -moz-appearance: textfield;
        }

        .bonus-points-text {
            position: absolute;
            pointer-events: none;
            font-size: 2rem;
            font-weight: bold;
            color: #fbbf24;
            text-shadow: 0 0 10px rgba(251, 191, 36, 0.8),
                0 0 20px rgba(251, 191, 36, 0.6);
            animation: points-rise 4s ease-out;
            z-index: 51;
        }
    </style>
</head>

<body class="min-h-screen bg-black font-poppins overflow-hidden">
    <div class="fixed inset-0 opacity-5 pointer-events-none" style="
        background: linear-gradient(90deg, white 1px, transparent 1px),
          linear-gradient(white 1px, transparent 1px);
        background-size: 10px 10px;
      "></div>

    <div class="fixed top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[500px] h-[500px] pointer-events-none z-0">
        <div class="absolute w-[500px] h-[500px] rounded-full animate-rotate-counter">
            <div
                class="absolute w-[120px] h-[120px] rounded-full bg-red-500/50 shadow-[0_0_80px_40px_rgba(239,68,68,0.4),0_0_200px_100px_rgba(239,68,68,0.4)] animate-glow-pulse">
            </div>
        </div>
        <div class="absolute w-[300px] h-[300px] top-[100px] left-[100px] rounded-full animate-rotate-counter-fast">
            <div
                class="absolute w-[120px] h-[120px] rounded-full bg-blue-500/50 shadow-[0_0_80px_40px_rgba(59,130,246,0.4),0_0_200px_100px_rgba(59,130,246,0.4)] animate-glow-pulse">
            </div>
        </div>
    </div>

    <!-- Dialog Pertanyaan -->
    <dialog id="q-dialog"
        class="rounded-2xl p-0 backdrop:bg-black/50 bg-white/90 opacity-0 shadow-2xl fixed transition-all duration-300 border-0">
        <form method="dialog" class="min-w-[60rem] max-w-[90vw] rounded-2xl">
            <header class="px-6 py-4 text-center border-b border-gray-200">
                <h3 class="font-bold text-2xl font-poppins text-gray-800">
                    Pertanyaan
                    <span id="q-zone-indicator" class="text-yellow-500"></span>
                </h3>
            </header>

            <section class="px-6 py-6 text-center min-h-[120px] flex items-center justify-center">
                <blockquote id="q-text" class="italic text-lg text-black font-bold font-poppins leading-relaxed">
                    "Soal tidak terdeteksi"
                </blockquote>
            </section>

            <section class="px-6 py-4 text-center">
                <button type="button" id="toggle-answer-btn"
                    class="px-4 py-2 bg-gradient-to-r from-blue-500 to-blue-600 hover:from-blue-600 hover:to-blue-700 text-white rounded-lg font-semibold transition-all duration-200 hover:shadow-lg hover:-translate-y-0.5 mb-3">
                    Tampilkan Jawaban
                </button>
                <div id="answer-section"
                    class="hidden min-h-[80px] items-center justify-center bg-green-50 rounded-lg p-4 border-2 border-green-200">
                    <blockquote id="answer-text"
                        class="italic text-lg text-green-800 font-bold font-poppins leading-relaxed">
                        "Jawaban"
                    </blockquote>
                </div>
            </section>

            <div class="flex items-center justify-center mb-6 gap-3 px-6">
                <button type="button" id="start-timer-btn"
                    class="px-5 py-2.5 bg-gradient-to-r from-emerald-500 to-emerald-600 hover:from-emerald-600 hover:to-emerald-700 text-white rounded-lg font-semibold transition-all duration-200 hover:shadow-lg hover:-translate-y-0.5 disabled:opacity-50 disabled:cursor-not-allowed disabled:hover:translate-y-0">
                    Start ▶
                </button>
                <div id="timer-display"
                    class="text-3xl font-bold font-mono min-w-[110px] text-center px-4 py-2 rounded-lg bg-gradient-to-br from-gray-600/30 to-gray-700/30 text-emerald-500 shadow-inner">
                    00:00
                </div>
            </div>

            <div class="relative px-6 pb-6 flex items-center justify-center">
                <div id="team-pills-container" class="flex flex-wrap gap-2 justify-center max-w-xl"></div>

                <div class="absolute right-6 bottom-6 flex gap-2">
                    <button id="q-wrong" value="wrong"
                        class="h-10 w-10 rounded-lg grid place-items-center cursor-pointer bg-red-500 hover:bg-red-600 text-white font-bold text-xl transition-all hover:scale-110 shadow-md">
                        ✗
                    </button>
                    <button id="q-ok" value="ok"
                        class="h-10 w-10 rounded-lg cursor-pointer grid place-items-center bg-green-500 hover:bg-green-600 text-white font-bold text-xl transition-all hover:scale-110 shadow-md">
                        ✓
                    </button>
                </div>
            </div>
        </form>
    </dialog>

    <div class="relative z-10 py-4 max-w-6xl w-full mx-auto flex flex-col min-h-screen">
        <div class="fixed top-0 left-0 p-4 flex items-center gap-2 z-20">
            <img src="../resources/himacom.png" class="w-10 h-10" alt="" />
            <img src="../resources/logocss.png" class="w-10 h-10" alt="" />
            <div class="flex flex-col">
                <h1 class="text-white text-2xl font-bold font-poppins">
                    CSS<span class="text-sm ml-1">2.0</span>
                </h1>
                <h1 class="text-white text-lg font-bold font-poppins">
                    Babak Semifinal
                </h1>
            </div>
        </div>

        <div class="flex flex-col items-center justify-center flex-grow">
            <div id="team-container"
                class="flex flex-wrap gap-4 items-center justify-center mb-10 w-full max-w-4xl px-4"></div>

            <div id="game-grid" class="grid gap-2 mb-8 relative" style="grid-template-columns: repeat(6, 4rem);"></div>

        </div>

        <!-- Bottom Buttons -->
        <div class="fixed bottom-0 right-0 p-4 z-20">
            <button onclick="resetBoard()"
                class="px-6 py-2 bg-red-600 hover:bg-red-700 text-white font-bold rounded-lg transition-all duration-300 hover:scale-105 text-sm shadow-lg">
                Reset
            </button>
        </div>

        <div class="fixed bottom-0 left-0 p-4 z-20">
            <a href="homepage.html"
                class="inline-block px-6 py-2 bg-red-600 hover:bg-red-700 text-white font-bold rounded-lg transition-all duration-300 hover:scale-105 text-sm shadow-lg">
                Back
            </a>
        </div>
    </div>

    <!-- // ================================================================
    // DATA SOAL (soalSemifinal.js)
    // ================================================================ -->

    <script src="../soal/soalSemifinal.js"></script>

    <script>
        // ================================================================
        // STATE MANAGEMENT
        // ================================================================
        let gameState = {
            teams: [],
            selected: {},
            bonusApplied: {},
            comboCount: {},
        };

        const GRID_ROWS = 6;
        const GRID_COLS = 6;

        let timeUpAudio = null;
        let audioLoopInterval = null;

        const teamColorConfigs = {
            A: {
                bg: "from-red-400 to-red-500",
                bgDark: "from-red-500 to-red-600",
                border: "border-red-600",
                text: "text-red-500",
                hover: "hover:bg-red-400",
                selected: "bg-red-400",
                hex: "#ef4444",
            },
            B: {
                bg: "from-blue-400 to-blue-500",
                bgDark: "from-blue-500 to-blue-600",
                border: "border-blue-600",
                text: "text-blue-500",
                hover: "hover:bg-blue-400",
                selected: "bg-blue-400",
                hex: "#3b82f6",
            },
            C: {
                bg: "from-yellow-400 to-yellow-500",
                bgDark: "from-yellow-500 to-yellow-600",
                border: "border-yellow-600",
                text: "text-yellow-500",
                hover: "hover:bg-yellow-400",
                selected: "bg-yellow-400",
                hex: "#eab308",
            },
            D: {
                bg: "from-green-400 to-green-500",
                bgDark: "from-green-500 to-green-600",
                border: "border-green-600",
                text: "text-green-500",
                hover: "hover:bg-green-400",
                selected: "bg-green-400",
                hex: "#22c55e",
            },
        };

        function initializeDefaultState() {
            gameState.teams = [
                { name: "A", score: 500, zones: 0 },
                { name: "B", score: 500, zones: 0 },
                { name: "C", score: 500, zones: 0 },
                { name: "D", score: 500, zones: 0 },
            ];
            gameState.selected = {};
            gameState.bonusApplied = {};
            gameState.comboCount = { A: 0, B: 0, C: 0, D: 0 };
        }

        function loadState() {
            try {
                const saved = window.localStorage?.getItem("semifinalGameState");
                if (saved) {
                    gameState = JSON.parse(saved);
                    if (!gameState.selected || Array.isArray(gameState.selected))
                        gameState.selected = {};
                    if (!gameState.bonusApplied) gameState.bonusApplied = {};
                    if (!gameState.comboCount)
                        gameState.comboCount = { A: 0, B: 0, C: 0, D: 0 };
                } else {
                    initializeDefaultState();
                }
            } catch (e) {
                console.error("Error loading state:", e);
                initializeDefaultState();
            }
        }

        function saveState() {
            try {
                if (window.localStorage) {
                    window.localStorage.setItem(
                        "semifinalGameState",
                        JSON.stringify(gameState)
                    );
                }
            } catch (e) {
                console.error("Error saving state:", e);
            }
        }

        function resetBoard() {
            if (
                confirm("Apakah Anda yakin ingin mereset papan Semifinal dan skor?")
            ) {
                try {
                    window.localStorage?.removeItem("semifinalGameState");
                } catch (e) {
                    console.error("Error removing state:", e);
                }
                loadState();
                renderTeams();
                createGrid();
            }
        }

        // ================================================================
        // UI RENDERING
        // ================================================================
        const teamContainer = document.getElementById("team-container");
        const gridContainer = document.getElementById("game-grid");
        let questions = {};

        function renderTeams() {
            teamContainer.innerHTML = "";
            if (!gameState.teams) return;

            gameState.teams.forEach((team) => {
                const colors = teamColorConfigs[team.name] || teamColorConfigs["A"];
                const div = document.createElement("div");
                div.className = `rounded-lg overflow-hidden shadow-lg w-32 flex flex-col bg-gradient-to-br ${colors.bgDark} border-2 ${colors.border} transform transition-all hover:scale-105`;

                div.innerHTML = `
                    <div class="text-center bg-gradient-to-br ${colors.bg}">
                        <span class="text-xl font-bold text-white">${team.name
                    }</span>
                    </div>
                    <div class="text-center bg-black/20">
                        <input type="number" 
                               id="score-${team.name}" 
                               class="text-lg font-bold text-white bg-transparent text-center w-full outline-none focus:outline-none focus:ring-0 border-none p-0" 
                               value="${team.score}"
                               data-team-name="${team.name}">
                    </div>
                    <div class="text-center py-1 bg-black/30 text-xs text-white">
                        Zona: <span id="zones-${team.name}" class="font-bold">${team.zones || 0
                    }</span>
                    </div>
                    <div class="text-center py-1 bg-black/30 text-xs text-white border-t border-white/20">
                        Combo: <span id="combo-${team.name
                    }" class="font-bold text-yellow-400">${gameState.comboCount[team.name] || 0
                    }</span>
                    </div>
                `;

                teamContainer.appendChild(div);

                const scoreInput = div.querySelector(`#score-${team.name}`);
                scoreInput.addEventListener("change", handleScoreChange);
            });
        }

        function handleScoreChange(event) {
            const input = event.currentTarget;
            const teamName = input.dataset.teamName;
            let newScore = parseInt(input.value, 10);

            if (isNaN(newScore)) {
                newScore = 0;
                input.value = newScore;
            }

            const team = gameState.teams.find((t) => t.name === teamName);
            if (team) {
                team.score = newScore;
                saveState();
            }
        }

        function updateTeamZones(teamName) {
            const team = gameState.teams.find((t) => t.name === teamName);
            if (!team) return;

            team.zones = Object.values(gameState.selected).filter(
                (t) => t === teamName
            ).length;
            const zoneDisplay = document.getElementById(`zones-${teamName}`);
            if (zoneDisplay) zoneDisplay.textContent = team.zones;
            saveState();
        }

        function updateComboDisplay(teamName) {
            const comboDisplay = document.getElementById(`combo-${teamName}`);
            if (comboDisplay) {
                comboDisplay.textContent = gameState.comboCount[teamName] || 0;
            }
        }

        function loadQuestions() {
            questions = {};
            dataSemifinal1.forEach((q) => {
                questions[q.id] = q;
            });
            console.log(
                "Soal Semifinal berhasil dimuat:",
                Object.keys(questions).length,
                "soal"
            );
        }

        function createGrid() {
            gridContainer.innerHTML = "";

            for (let r = 0; r < GRID_ROWS; r++) {
                for (let c = 0; c < GRID_COLS; c++) {
                    const rowLetter = String.fromCharCode(65 + r);
                    const cellId = rowLetter + (c + 1);
                    const soal = questions[cellId];

                    if (!soal) {
                        const placeholder = document.createElement("div");
                        placeholder.className = "h-16 w-16 rounded-full bg-transparent";
                        gridContainer.appendChild(placeholder);
                        continue;
                    }

                    const button = document.createElement("button");
                    const selectedState = gameState.selected[cellId];

                    let buttonClass = "";

                    if (selectedState) {
                        if (selectedState === "failed") {
                            buttonClass =
                                "bg-black border-2 border-gray-700 text-gray-700 shadow-inner cursor-not-allowed";
                        } else if (selectedState === "gray") {
                            buttonClass =
                                "bg-gradient-to-br from-gray-400 to-gray-500 border-2 border-gray-600 text-gray-900 shadow-lg";
                        } else {
                            const team = gameState.teams.find(
                                (t) => t.name === selectedState
                            );
                            if (team) {
                                const colors =
                                    teamColorConfigs[team.name] || teamColorConfigs["A"];
                                buttonClass = `bg-gradient-to-br ${colors.bg} border-2 ${colors.border} text-white shadow-lg`;
                            } else {
                                buttonClass =
                                    "bg-gradient-to-br from-gray-400 to-gray-500 border-2 border-gray-600 text-gray-900 shadow-lg";
                            }
                        }
                    } else {
                        buttonClass =
                            "bg-black/50 border-2 border-white/60 text-white hover:bg-gradient-to-br hover:from-gray-300/90 hover:to-gray-400 hover:shadow-xl hover:border-white/80";
                    }

                    button.className = `h-16 w-16 rounded-full font-bold text-xl transition-all duration-300 flex items-center justify-center ${selectedState ? "" : "hover:scale-105 cursor-pointer"
                        } ${buttonClass}`;
                    button.dataset.cellId = cellId;

                    if (soal.goldenZone === true) {
                        button.innerHTML = `
                            <div class="relative flex items-center justify-center">
                                <span>${cellId}</span>
                                <span class="absolute -top-4 -right-3 text-yellow-400 text-lg">⭐</span>
                            </div>
                        `;
                        if (!selectedState) {
                            button.classList.add("shadow-[0_0_15px_rgba(234,179,8,0.9)]");
                        }
                    } else {
                        button.innerText = cellId;
                    }

                    if (!selectedState) {
                        button.onclick = handleCellClick;
                    }

                    gridContainer.appendChild(button);
                }
            }
        }

        // ================================================================
        // TIMER LOGIC
        // ================================================================
        let timerInterval = null;
        let timeRemaining = 0;

        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = seconds % 60;
            return `${String(mins).padStart(2, "0")}:${String(secs).padStart(
                2,
                "0"
            )}`;
        }

        function updateTimerDisplay() {
            const display = document.getElementById("timer-display");
            if (!display) return;
            display.textContent = formatTime(timeRemaining);
            display.className =
                "text-3xl font-bold font-mono min-w-[110px] text-center px-4 py-2 rounded-lg bg-gradient-to-br from-gray-600/30 to-gray-700/30 shadow-inner";

            if (timeRemaining <= 5 && timeRemaining > 3) {
                display.className += " text-yellow-500";
                display.style.textShadow = "0 0 10px rgba(245, 158, 11, 0.5)";
            } else if (timeRemaining <= 3 && timeRemaining > 0) {
                display.className += " text-red-500 animate-pulse-danger";
                display.style.textShadow = "0 0 10px rgba(239, 68, 68, 0.7)";
            } else {
                display.className += " text-emerald-500";
                display.style.textShadow = "0 0 10px rgba(16, 185, 129, 0.5)";
            }
        }

        function playTimeUpSound() {
            stopTimeUpSound();
            timeUpAudio = new Audio("../resources/timeup.mp3");
            timeUpAudio.play().catch((err) => {
            console.log("Sound tidak dapat diputar:", err);
            });
            let playCount = 0;
            audioLoopInterval = setInterval(() => {
            playCount++;
            if (playCount < 3) {
                timeUpAudio = new Audio("../resources/timeup.mp3");
                timeUpAudio.play().catch((err) => {
                console.log("Sound tidak dapat diputar:", err);
                });
            } else {
                clearInterval(audioLoopInterval);
                audioLoopInterval = null;
            }
            }, 1000);
        }

        function stopTimeUpSound() {
            if (timeUpAudio) {
            timeUpAudio.pause();
            timeUpAudio.currentTime = 0;
            timeUpAudio = null;
            }
            if (audioLoopInterval) {
            clearInterval(audioLoopInterval);
            audioLoopInterval = null;
            }
        }

        function startTimer(duration) {
            const startBtn = document.getElementById("start-timer-btn");
            if (startBtn) startBtn.disabled = true;
            timeRemaining = duration;
            updateTimerDisplay();
            timerInterval = setInterval(() => {
                timeRemaining--;
                updateTimerDisplay();
                if (timeRemaining <= 0) {
                    stopTimer();
                    playTimeUpSound();
                }
            }, 1000);
        }

        function stopTimer() {
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }
        }

        // ================================================================
        // BONUS DETECTION LOGIC
        // ================================================================
        function getCellId(r, c) {
            if (r < 0 || r >= GRID_ROWS || c < 0 || c >= GRID_COLS) return null;
            return String.fromCharCode(65 + r) + (c + 1);
        }

        function cellIdToCoords(cellId) {
            if (!cellId || cellId.length < 2) return [null, null];
            const rowChar = cellId.charAt(0).toUpperCase();
            const colNum = parseInt(cellId.substring(1));
            if (
                rowChar < "A" ||
                rowChar > String.fromCharCode(65 + GRID_ROWS - 1) ||
                isNaN(colNum) ||
                colNum < 1 ||
                colNum > GRID_COLS
            ) {
                return [null, null];
            }
            const r = rowChar.charCodeAt(0) - 65;
            const c = colNum - 1;
            return [r, c];
        }

        function checkForBonus(answeredCellId, teamName) {
            const [startR, startC] = cellIdToCoords(answeredCellId);
            if (startR === null) return false;

            const directions = [
                [0, 1], // Horizontal (kanan)
                [1, 0], // Vertikal (bawah)
                [1, 1], // Diagonal kanan-bawah
                [1, -1], // Diagonal kiri-bawah
            ];

            const BONUS_LENGTH = 4;
            let bonusFound = false;

            for (const [dr, dc] of directions) {
                let lineCells = [answeredCellId];

                // Cek ke arah positif
                for (let k = 1; k < BONUS_LENGTH; k++) {
                    const nextR = startR + k * dr;
                    const nextC = startC + k * dc;
                    const nextCellId = getCellId(nextR, nextC);
                    if (nextCellId && gameState.selected[nextCellId] === teamName) {
                        lineCells.push(nextCellId);
                    } else {
                        break;
                    }
                }

                // Cek ke arah negatif
                for (let k = 1; k < BONUS_LENGTH; k++) {
                    const prevR = startR - k * dr;
                    const prevC = startC - k * dc;
                    const prevCellId = getCellId(prevR, prevC);
                    if (prevCellId && gameState.selected[prevCellId] === teamName) {
                        lineCells.unshift(prevCellId);
                    } else {
                        break;
                    }
                }

                // Evaluasi semua segmen 4 sel berturut-turut
                if (lineCells.length >= BONUS_LENGTH) {
                    for (let i = 0; i <= lineCells.length - BONUS_LENGTH; i++) {
                        const potentialBonusLine = lineCells.slice(i, i + BONUS_LENGTH);
                        const firstCellId = potentialBonusLine[0];

                        // Cek apakah bonus dari sel pertama ini belum pernah diberikan
                        if (!gameState.bonusApplied[firstCellId]) {
                            console.log(
                                `✨ BONUS! Tim ${teamName} mendapat combo dari ${firstCellId}:`,
                                potentialBonusLine.join(" → ")
                            );

                            gameState.bonusApplied[firstCellId] = true;
                            gameState.comboCount[teamName] =
                                (gameState.comboCount[teamName] || 0) + 1;
                            bonusFound = true;

                            const [firstR, firstC] = cellIdToCoords(firstCellId);
                            if (firstR !== null) {
                                showBonusAnimation(firstR, firstC, teamName, [dr, dc]);
                            }

                            const team = gameState.teams.find((t) => t.name === teamName);
                            if (team) {
                                setTimeout(() => {
                                    team.score += 100;
                                    const scoreInput = document.getElementById(
                                        `score-${team.name}`
                                    );
                                    if (scoreInput) {
                                        scoreInput.value = team.score;
                                        scoreInput.style.transition = "none";
                                        scoreInput.style.transform = "scale(1.3)";
                                        scoreInput.style.color = "#fbbf24";
                                        setTimeout(() => {
                                            scoreInput.style.transition =
                                                "transform 0.3s ease, color 0.3s ease";
                                            scoreInput.style.transform = "scale(1)";
                                            scoreInput.style.color = "white";
                                        }, 300);
                                    }
                                    updateComboDisplay(teamName);
                                    saveState();
                                }, 4000);
                            }
                        }
                    }
                }
            }

            return bonusFound;
        }

        function showBonusAnimation(startRow, startCol, teamName, direction) {
            const grid = document.getElementById("game-grid");
            if (!grid) return;
            const lineLength = 4;
            const [dr, dc] = direction;

            // Ukuran tombol di grid (sesuai dengan w-16 h-16 = 4rem = 64px)
            const buttonSize = 64;
            // Gap antar tombol (sesuai dengan gap-2 = 0.5rem = 8px)
            const gapSize = 8;
            // Total jarak per sel
            const cellSize = buttonSize + gapSize;

            const teamConfig = teamColorConfigs[teamName];
            const borderColor =
                teamConfig && teamConfig.hex ? teamConfig.hex : "white";

            // Tampilkan animasi untuk setiap sel dalam combo
            for (let k = 0; k < lineLength; k++) {
                const currentRow = startRow + k * dr;
                const currentCol = startCol + k * dc;

                if (
                    currentRow < 0 ||
                    currentRow >= GRID_ROWS ||
                    currentCol < 0 ||
                    currentCol >= GRID_COLS
                ) {
                    continue;
                }

                const zone = document.createElement("div");
                zone.className = "absolute pointer-events-none border-[3px] border-white rounded-full animate-[zone-flash_4s_ease-out] z-50 w-16 h-16 ";
                zone.style.top = `${currentRow * cellSize}px`;
                zone.style.left = `${currentCol * cellSize}px`;
                zone.style.borderColor = borderColor;
                zone.style.boxShadow = `0 0 20px ${borderColor}, 0 0 40px ${borderColor}`;

                grid.appendChild(zone);

                setTimeout(() => {
                    if (grid.contains(zone)) {
                        grid.removeChild(zone);
                    }
                }, 4000);
            }

            // Tampilkan teks +100 di tengah combo
            const pointsText = document.createElement("span");
            pointsText.className = "bonus-points-text";
            pointsText.textContent = "+100 COMBO!";

            // Posisi di tengah-tengah 4 sel
            const middleRow = startRow + 1.5 * dr;
            const middleCol = startCol + 1.5 * dc;
            const centerX = middleCol * cellSize + buttonSize / 2;
            const centerY = middleRow * cellSize + buttonSize / 2;

            pointsText.style.left = `${centerX}px`;
            pointsText.style.top = `${centerY}px`;

            grid.appendChild(pointsText);

            setTimeout(() => {
                if (grid.contains(pointsText)) {
                    grid.removeChild(pointsText);
                }
            }, 4000);
        }

        // ================================================================
        // INTERACTION LOGIC
        // ================================================================
      async function handleCellClick(event) {
            const button = event.currentTarget;
            const cellId = button.dataset.cellId;

            if (gameState.selected[cellId]) return;

            const res = await qPopUp(cellId);
            
            const team = gameState.teams.find((x) => x.name === res.team);
            let bonusAwardedInThisClick = false;

            if (res.cancelled) {
                // Jika dibatalkan (misal tutup modal), tandai sbg 'gray'
                button.className =
                    "h-16 w-16 rounded-full font-bold text-xl bg-gradient-to-br from-gray-400 to-gray-500 border-2 border-gray-600 text-gray-900 shadow-lg flex items-center justify-center";
                gameState.selected[cellId] = "gray";
            } else if (res.team) {
                // Jika tim ada (baik benar atau salah)
                if (team) {
                    if (res.delta > 0) {
                        // Jawaban BENAR
                        const colors = teamColorConfigs[team.name] || teamColorConfigs["A"];
                        button.className = `h-16 w-16 rounded-full font-bold text-xl bg-gradient-to-br ${colors.bg} border-2 ${colors.border} text-white shadow-lg transition-all duration-300 flex items-center justify-center`;

                        const soal = questions[cellId];
                        if (soal && soal.goldenZone) {
                            button.innerHTML = `
                                <div class="relative flex items-center justify-center">
                                    <span>${cellId}</span>
                                    <span class="absolute -top-4 -right-3 text-yellow-400 text-lg">⭐</span>
                                </div>
                            `;
                        } else {
                            button.innerText = cellId;
                        }

                        gameState.selected[cellId] = team.name;
                        updateTeamZones(team.name);
                        bonusAwardedInThisClick = checkForBonus(cellId, team.name);
                    } else {
                        // Jawaban SALAH
                        button.className =
                            "h-16 w-16 rounded-full font-bold text-xl bg-black border-2 border-gray-700 text-gray-700 shadow-inner cursor-not-allowed flex items-center justify-center";
                        button.innerText = "✗";
                        gameState.selected[cellId] = "failed";
                    }

                    team.score += res.delta;
                    document.getElementById(`score-${team.name}`).value = team.score;
                }
            }

            button.classList.remove("hover:scale-105", "cursor-pointer");
            
            if (!bonusAwardedInThisClick) {
                saveState();
            }
        }
        async function qPopUp(cellId) {
            const dlg = document.getElementById("q-dialog");
            const qText = document.getElementById("q-text");
            const ansText = document.getElementById("answer-text");
            const answerSection = document.getElementById("answer-section");
            const toggleAnswerBtn = document.getElementById("toggle-answer-btn");
            const zoneIndicator = document.getElementById("q-zone-indicator");
            const okBtn = document.getElementById("q-ok");
            const wrongBtn = document.getElementById("q-wrong");
            const startBtn = document.getElementById("start-timer-btn");
            const timerDisplay = document.getElementById("timer-display");
            const pillsContainer = document.getElementById("team-pills-container");

            const soal = questions[cellId];
            let pointsCorrect = 100;
            let pointsWrong = -100;

            if (soal && soal.goldenZone === true) {
                pointsCorrect = 200;
                pointsWrong = -200;
                zoneIndicator.textContent = "⭐ GOLDEN ZONE";
            } else {
                zoneIndicator.textContent = "";
            }

            pillsContainer.innerHTML = "";
            if (!gameState.teams) return { cancelled: true };

            gameState.teams.forEach((team) => {
                const colors = teamColorConfigs[team.name] || teamColorConfigs["A"];
                const pill = document.createElement("button");
                pill.type = "button";
                pill.dataset.team = team.name;
                pill.className = `border-2 border-gray-300 rounded-lg px-5 py-2.5 cursor-pointer bg-gray-100 text-xl font-semibold transition-all ${colors.hover} hover:text-white hover:border-transparent hover:scale-105`;
                pill.textContent = team.name;
                pillsContainer.appendChild(pill);
            });

            const pills = Array.from(
                pillsContainer.querySelectorAll("button[data-team]")
            );

            if (soal) {
                qText.textContent = soal.pertanyaan || "Pertanyaan tidak ditemukan.";
                ansText.textContent = soal.jawaban || "Belum ada jawaban.";
                timerDisplay.textContent = formatTime(soal.waktu || 0);
            } else {
                qText.textContent = `Soal untuk ${cellId} tidak ditemukan.`;
                ansText.textContent = "Tidak tersedia.";
                timerDisplay.textContent = "00:00";
            }

            answerSection.classList.add("hidden");
            answerSection.classList.remove("flex");
            toggleAnswerBtn.textContent = "Tampilkan Jawaban";
            toggleAnswerBtn.onclick = () => {
                const visible = !answerSection.classList.contains("hidden");
                if (visible) {
                    answerSection.classList.add("hidden");
                    answerSection.classList.remove("flex");
                    toggleAnswerBtn.textContent = "Tampilkan Jawaban";
                } else {
                    answerSection.classList.remove("hidden");
                    answerSection.classList.add("flex");
                    toggleAnswerBtn.textContent = "Sembunyikan Jawaban";
                }
            };

            stopTimer();
            stopTimeUpSound();
            if (startBtn) startBtn.disabled = false;
            timerDisplay.className =
                "text-3xl font-bold font-mono min-w-[110px] text-center px-4 py-2 rounded-lg bg-gradient-to-br from-gray-600/30 to-gray-700/30 text-emerald-500 shadow-inner";
            timerDisplay.style.textShadow = "0 0 10px rgba(16, 185, 129, 0.5)";

            let selectedTeam = null;

            return new Promise((resolve) => {
                const onPillClick = (e) => {
                    selectedTeam = e.currentTarget.dataset.team;
                    pills.forEach((p) => {
                        const colors =
                            teamColorConfigs[p.dataset.team] || teamColorConfigs["A"];
                        if (p.dataset.team === selectedTeam) {
                            p.className = `border-2 border-transparent rounded-lg px-5 py-2.5 cursor-pointer text-xl font-semibold transition-all ${colors.selected} text-white shadow-md scale-105`;
                        } else {
                            p.className = `border-2 border-gray-300 rounded-lg px-5 py-2.5 cursor-pointer bg-gray-100 text-xl font-semibold transition-all ${colors.hover} hover:text-white hover:border-transparent hover:scale-105`;
                        }
                    });
                };

                const shakePills = () => {
                    pills.forEach((p) => {
                        p.classList.add("animate-shake");
                        setTimeout(() => p.classList.remove("animate-shake"), 400);
                    });
                };

                const onOkClick = (e) => {
                    if (!selectedTeam) {
                        e.preventDefault();
                        shakePills();
                    }
                };

                const onWrongClick = (e) => {
                    if (!selectedTeam) {
                        e.preventDefault();
                        shakePills();
                    }
                };

                const onStartTimer = () => {
                    if (soal?.waktu) {
                        startTimer(soal.waktu);
                    } else {
                        console.warn("Waktu tidak ditemukan, default 15s");
                        startTimer(15);
                    }
                };

                const escHandler = (event) => {
                    if (event.key === "Escape") {
                        stopTimeUpSound();
                    }
                };

                const onClose = () => {
                    stopTimer();
                    stopTimeUpSound();
                    document.removeEventListener("keydown", escHandler);
                    dlg.removeEventListener("close", onClose);
                    pills.forEach((p) => p.removeEventListener("click", onPillClick));
                    if (okBtn) okBtn.removeEventListener("click", onOkClick);
                    if (wrongBtn) wrongBtn.removeEventListener("click", onWrongClick);
                    if (startBtn) startBtn.removeEventListener("click", onStartTimer);

                    dlg.classList.remove("translate-y-0", "opacity-100");

                    if (!selectedTeam) {
                        resolve({ cancelled: true });
                    } else if (dlg.returnValue === "ok") {
                        resolve({
                            cancelled: false,
                            team: selectedTeam,
                            delta: pointsCorrect,
                        });
                    } else if (dlg.returnValue === "wrong") {
                        resolve({
                            cancelled: false,
                            team: selectedTeam,
                            delta: pointsWrong,
                        });
                    } else {
                     resolve({ cancelled: true, team: selectedTeam, delta: 0 });
                    }
                };

                pills.forEach((p) => p.addEventListener("click", onPillClick));
                if (okBtn) okBtn.addEventListener("click", onOkClick);
                if (wrongBtn) wrongBtn.addEventListener("click", onWrongClick);
                if (startBtn) startBtn.addEventListener("click", onStartTimer);
                document.addEventListener("keydown", escHandler);
                dlg.addEventListener("close", onClose, { once: true });

                dlg.showModal();
                setTimeout(
                    () => dlg.classList.add("translate-y-0", "opacity-100"),
                    10
                );
            });
        }

        // ================================================================
        // INITIALIZATION
        // ================================================================
        window.addEventListener("beforeunload", () => {
            stopTimeUpSound();
        });

        window.addEventListener("load", () => {
            console.log("=== CSS 2.0 Game Board - SEMIFINAL ===");

            loadState();
            loadQuestions();
            renderTeams();
            createGrid();

            console.log("Grid:", GRID_ROWS, "x", GRID_COLS);
            console.log("Total soal:", Object.keys(questions).length);
            console.log("Teams:", gameState.teams?.map((t) => t.name).join(", "));
            console.log("Combo Count:", gameState.comboCount);

            document.querySelectorAll("#game-grid button").forEach((button, i) => {
                button.style.opacity = "0";
                button.style.transform = "translateY(20px)";
                setTimeout(() => {
                    button.style.transition = "opacity 0.3s ease, transform 0.3s ease";
                    button.style.opacity = "1";
                    button.style.transform = "translateY(0)";
                }, i * 20);
            });
        });
    </script>
