<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS 2.0 Game Board - Semifinal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,300;0,400;0,600;1,400&display=swap"
        rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        poppins: ['Poppins', 'sans-serif']
                    },
                    animation: {
                        'shake': 'shake 0.4s ease-in-out',
                        'pulse-danger': 'pulse-danger 0.5s infinite',
                        'glow-pulse': 'glow-pulse 6s ease-in-out infinite',
                        'rotate-counter': 'rotate-counter 12s linear infinite',
                        'rotate-counter-fast': 'rotate-counter 6s linear infinite'
                    },
                    keyframes: {
                        shake: { '0%, 100%': { transform: 'translateX(0)' }, '20%, 60%': { transform: 'translateX(-4px)' }, '40%, 80%': { transform: 'translateX(4px)' } },
                        'pulse-danger': { '0%, 100%': { transform: 'scale(1)' }, '50%': { transform: 'scale(1.05)' } },
                        'glow-pulse': { '0%, 100%': { transform: 'scale(1)' }, '50%': { transform: 'scale(1.1)' } },
                        'rotate-counter': { 'from': { transform: 'rotate(0deg)' }, 'to': { transform: 'rotate(-360deg)' } }
                    }
                }
            }
        }
    </script>

    <style>
        input[type=number]::-webkit-inner-spin-button,
        input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        input[type=number] { -moz-appearance: textfield; }
        html, body { height: 100%; }
        /* Menggunakan rounded-full untuk tombol */
        .game-button-round {
             width: 4rem; /* w-16 */
             height: 4rem; /* h-16 */
             font-size: 1rem; /* text-base */
             border-radius: 9999px; /* rounded-full */
        }
    </style>
</head>

<body class="min-h-screen bg-black font-poppins overflow-hidden flex flex-col">
    <div class="fixed inset-0 opacity-5 pointer-events-none" style="background: linear-gradient(90deg, white 1px, transparent 1px), linear-gradient(white 1px, transparent 1px); background-size: 10px 10px;"></div>

    <div class="fixed top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[500px] h-[500px] pointer-events-none z-0">
        <div class="absolute w-[500px] h-[500px] rounded-full animate-rotate-counter"> <div class="absolute w-[120px] h-[120px] rounded-full bg-red-500/50 shadow-[0_0_80px_40px_rgba(239,68,68,0.4),0_0_200px_100px_rgba(239,68,68,0.4)] animate-glow-pulse"></div> </div>
        <div class="absolute w-[300px] h-[300px] top-[100px] left-[100px] rounded-full animate-rotate-counter-fast"> <div class="absolute w-[120px] h-[120px] rounded-full bg-blue-500/50 shadow-[0_0_80px_40px_rgba(59,130,246,0.4),0_0_200px_100px_rgba(59,130,246,0.4)] animate-glow-pulse"></div> </div>
    </div>

    <dialog id="q-dialog" class="rounded-2xl p-0 backdrop:bg-black/50 bg-white/90 opacity-0 shadow-2xl fixed transition-all duration-300 border-0">
        <form method="dialog" class="min-w-[60rem] max-w-[90vw] rounded-2xl">
            <header class="px-6 py-4 text-center border-b border-gray-200"> <h3 class="font-bold text-2xl font-poppins text-gray-800">Pertanyaan</h3> </header>
            <section class="px-6 py-6 text-center min-h-[120px] flex items-center justify-center"> <blockquote id="q-text" class="italic text-lg text-gray-700 font-poppins leading-relaxed">"Soal tidak terdeteksi"</blockquote> </section>
            <div class="flex items-center justify-center mb-6 gap-3 px-6">
                <button type="button" id="start-timer-btn" class="px-5 py-2.5 bg-gradient-to-r from-emerald-500 to-emerald-600 hover:from-emerald-600 hover:to-emerald-700 text-white rounded-lg font-semibold transition-all duration-200 hover:shadow-lg hover:-translate-y-0.5 disabled:opacity-50 disabled:cursor-not-allowed disabled:hover:translate-y-0"> Start ▶ </button>
                <div id="timer-display" class="text-3xl font-bold font-mono min-w-[110px] text-center px-4 py-2 rounded-lg bg-gradient-to-br from-gray-600/30 to-gray-700/30 text-emerald-500 shadow-inner"> 00:00 </div>
            </div>
            <div class="relative px-6 pb-6 flex items-center justify-center">
                <div id="team-pills-container" class="flex flex-wrap gap-2 justify-center max-w-xl"></div>
                <div class="absolute right-6 bottom-6 flex gap-2">
                    <button id="q-wrong" value="wrong" class="h-10 w-10 rounded-lg grid place-items-center cursor-pointer bg-red-500 hover:bg-red-600 text-white font-bold text-xl transition-all hover:scale-110 shadow-md"> ✗ </button>
                    <button id="q-ok" value="ok" class="h-10 w-10 rounded-lg cursor-pointer grid place-items-center bg-green-500 hover:bg-green-600 text-white font-bold text-xl transition-all hover:scale-110 shadow-md"> ✓ </button>
                </div>
            </div>
        </form>
    </dialog>

    <div class="fixed top-0 left-0 w-full h-24 z-20 relative">
        <div class="absolute top-4 left-4 flex items-center gap-2">
            <img src="../resources/himacom.png" class="w-10 h-10" alt="">
            <img src="../resources/logocss.png" class="w-10 h-10" alt="">
            <h1 class="text-white text-2xl font-bold font-poppins">CSS<span class="text-sm ml-1">2.0</span></h1>
        </div>
        <div id="team-container" class="absolute top-4 left-1/2 -translate-x-1/2 flex flex-wrap gap-4 items-center justify-center px-4"></div>
    </div>

    <div class="relative z-10 flex-grow flex flex-col items-center justify-center">
        <div id="grids-container" class="grid grid-cols-2 gap-4 max-w-xl">
             {/* Grid A, B, C, D akan dirender JS di sini */}
        </div>
    </div>

    <div class="fixed bottom-0 right-0 p-4 z-20"> <button onclick="resetBoard()" class="px-6 py-2 bg-red-600 hover:bg-red-700 text-white font-bold rounded-lg transition-all duration-300 hover:scale-105 text-sm shadow-lg"> Reset </button> </div>
    <div class="fixed bottom-0 left-0 p-4 z-20"> <a href="homepage.html" class="inline-block px-6 py-2 bg-gray-600 hover:bg-gray-700 text-white font-bold rounded-lg transition-all duration-300 hover:scale-105 text-sm shadow-lg"> Back </a> </div>

    <script src="../soal/soalSemifinal.js"></script>

    <script>
        // ================================================================
        // STATE MANAGEMENT
        // ================================================================
        let gameState = { teams: [], selected: {}, };
        // Konstanta grid tidak diperlukan lagi dengan cara ini
        let timeUpAudio = null; let audioLoopInterval = null;
        const teamColorConfigs = { A: { bg: 'from-red-400 to-red-500', bgDark: 'from-red-500 to-red-600', border: 'border-red-600', text: 'text-red-500', hover: 'hover:bg-red-400', selected: 'bg-red-400' }, B: { bg: 'from-blue-400 to-blue-500', bgDark: 'from-blue-500 to-blue-600', border: 'border-blue-600', text: 'text-blue-500', hover: 'hover:bg-blue-400', selected: 'bg-blue-400' }, C: { bg: 'from-yellow-400 to-yellow-500', bgDark: 'from-yellow-500 to-yellow-600', border: 'border-yellow-600', text: 'text-yellow-500', hover: 'hover:bg-yellow-400', selected: 'bg-yellow-400' }, D: { bg: 'from-green-400 to-green-500', bgDark: 'from-green-500 to-green-600', border: 'border-green-600', text: 'text-green-500', hover: 'hover:bg-green-400', selected: 'bg-green-400' }, };

        function initializeDefaultState() { gameState.teams = [ { name: "A", score: 0 }, { name: "B", score: 0 }, { name: "C", score: 0 }, { name: "D", score: 0 }, ]; gameState.selected = {}; }
        function loadState() { const saved = localStorage.getItem('semifinalGameState'); if (saved) { gameState = JSON.parse(saved); if (!gameState.selected || Array.isArray(gameState.selected)) { gameState.selected = {}; } } else { initializeDefaultState(); } }
        function saveState() { localStorage.setItem('semifinalGameState', JSON.stringify(gameState)); }
        function resetBoard() { if (confirm('Reset papan Semifinal?')) { localStorage.removeItem('semifinalGameState'); loadState(); renderTeams(); createGrid(); } }

        // ================================================================
        // UI RENDERING
        // ================================================================
        const teamContainer = document.getElementById("team-container");
        const gridsContainer = document.getElementById('grids-container'); // Container untuk 4 grid
        // const titleContainer = document.getElementById('game-title'); // Tidak dipakai lagi
        let questions = {};

        function renderTeams() { teamContainer.innerHTML = ""; if (!gameState.teams) return; gameState.teams.forEach((team) => { const colors = teamColorConfigs[team.name] || teamColorConfigs['A']; const div = document.createElement("div"); div.className = `rounded-lg overflow-hidden shadow-lg h-20 w-24 flex flex-col justify-between bg-gradient-to-br ${colors.bgDark} border-2 ${colors.border} transform transition-all hover:scale-105`; div.innerHTML = `<div class="text-center py-1 bg-gradient-to-br ${colors.bg}"><span class="text-xl font-semibold text-white">${team.name}</span></div><div class="text-center py-2 bg-black/20"><input type="number" id="score-${team.name}" class="text-xl font-bold text-white bg-transparent text-center w-full outline-none focus:outline-none focus:ring-0 border-none p-0" value="${team.score}" data-team-name="${team.name}"></div>`; teamContainer.appendChild(div); const scoreInput = div.querySelector(`#score-${team.name}`); scoreInput.addEventListener('change', handleScoreChange); }); }
        function handleScoreChange(event) { const input = event.currentTarget; const teamName = input.dataset.teamName; let newScore = parseInt(input.value, 10); if (isNaN(newScore)) { newScore = 0; input.value = newScore; } const team = gameState.teams.find(t => t.name === teamName); if (team) { team.score = newScore; saveState(); } }
        function loadQuestions() { if (typeof questionsData === 'undefined') { console.error('questionsData tidak ditemukan!'); alert('Error: Data soal Semifinal tidak ditemukan!'); return; } questions = {}; questionsData.forEach(q => { questions[q.id] = q; }); console.log('Soal Semifinal berhasil dimuat:', Object.keys(questions).length, 'soal'); }

        function createGrid() {
            gridsContainer.innerHTML = ""; // Bersihkan container utama
            // titleContainer.textContent = "Semifinal"; // Tidak dipakai lagi

            ['A', 'B', 'C', 'D'].forEach(gridLetter => {
                // Buat wrapper untuk setiap grid 3x3
                const gridWrapper = document.createElement('div');
                gridWrapper.className = 'bg-black/20 p-4 rounded-lg border border-gray-700'; // Styling wrapper

                const gridElement = document.createElement('div');
                gridElement.className = 'grid grid-cols-3 gap-2'; // Grid 3x3 dengan gap kecil
                gridWrapper.appendChild(gridElement);

                for (let i = 1; i <= 9; i++) {
                    const cellId = `${gridLetter}${i}`; // A1, A2... A9, B1... B9, etc.
                    const hasQuestion = questions[cellId] !== undefined;

                    if (!hasQuestion) {
                        // Jika tidak ada soal, buat placeholder (atau lewati)
                        const placeholder = document.createElement('div');
                        placeholder.className = 'h-16 rounded-full bg-transparent'; // Ukuran dan bentuk
                        gridElement.appendChild(placeholder);
                        continue;
                    }

                    const button = document.createElement('button');
                    const isSelected = gameState.selected[cellId] === true;

                    // Gunakan class game-button-round
                    button.className = `game-button-round font-semibold cursor-pointer transition-all duration-300 hover:scale-105 flex items-center justify-center ${isSelected
                        ? 'bg-gradient-to-br from-gray-400 to-gray-500 border-2 border-gray-600 text-gray-900 shadow-lg'
                        : 'bg-black/50 border-2 border-white/60 text-white hover:bg-gradient-to-br hover:from-gray-300/90 hover:to-gray-400 hover:shadow-xl hover:border-white/80'
                    }`;
                    button.dataset.cellId = cellId;
                    button.innerText = cellId; // Tampilkan ID (A1, A2...)
                    button.onclick = handleCellClick;
                    gridElement.appendChild(button);
                }
                gridsContainer.appendChild(gridWrapper); // Tambahkan wrapper ke container utama
            });
        }

        // ================================================================
        // TIMER LOGIC (Kode lengkap)
        // ================================================================
        function formatTime(seconds) { const mins = Math.floor(seconds / 60); const secs = seconds % 60; return `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`; }
        function updateTimerDisplay() {
            const display = document.getElementById('timer-display'); if (!display) return; display.textContent = formatTime(timeRemaining);
            display.className = "text-3xl font-bold font-mono min-w-[110px] text-center px-4 py-2 rounded-lg bg-gradient-to-br from-gray-600/30 to-gray-700/30 shadow-inner";
            if (timeRemaining <= 5 && timeRemaining > 3) { display.className += " text-yellow-500"; display.style.textShadow = "0 0 10px rgba(245, 158, 11, 0.5)"; }
            else if (timeRemaining <= 3 && timeRemaining > 0) { display.className += " text-red-500 animate-pulse-danger"; display.style.textShadow = "0 0 10px rgba(239, 68, 68, 0.7)"; }
            else { display.className += " text-emerald-500"; display.style.textShadow = "0 0 10px rgba(16, 185, 129, 0.5)"; }
        }
        function playTimeUpSound() { stopTimeUpSound(); try { timeUpAudio = new Audio('../resources/timeup.mp3'); timeUpAudio.play().catch(err => { console.log('Sound tidak dapat diputar:', err); }); let playCount = 0; audioLoopInterval = setInterval(() => { playCount++; if (playCount < 3) { timeUpAudio = new Audio('../resources/timeup.mp3'); timeUpAudio.play().catch(err => { console.log('Sound tidak dapat diputar:', err); }); } else { clearInterval(audioLoopInterval); audioLoopInterval = null; } }, 1000); } catch (error) { console.error("Gagal memutar audio:", error); } }
        function stopTimeUpSound() { if (timeUpAudio) { try { timeUpAudio.pause(); timeUpAudio.currentTime = 0; } catch(e) { console.error("Error stopping audio:", e); } timeUpAudio = null; } if (audioLoopInterval) { clearInterval(audioLoopInterval); audioLoopInterval = null; } }
        function startTimer(duration) { const startBtn = document.getElementById('start-timer-btn'); if (startBtn) startBtn.disabled = true; timeRemaining = duration; updateTimerDisplay(); timerInterval = setInterval(() => { timeRemaining--; updateTimerDisplay(); if (timeRemaining <= 0) { stopTimer(); playTimeUpSound(); } }, 1000); }
        function stopTimer() { if (timerInterval) { clearInterval(timerInterval); timerInterval = null; } }

        // ================================================================
        // INTERACTION LOGIC (Kode lengkap)
        // ================================================================
        async function handleCellClick(event) { const button = event.currentTarget; const cellId = button.dataset.cellId; if (gameState.selected[cellId]) return; const res = await qPopUp(cellId); if (res.cancelled) return; const team = gameState.teams.find(x => x.name === res.team); if (team) { const colors = teamColorConfigs[team.name] || teamColorConfigs['A']; button.className = `game-button-round font-semibold bg-gradient-to-br ${colors.bg} border-2 ${colors.border} text-white shadow-lg transition-all duration-300 flex items-center justify-center`; team.score += res.delta; document.getElementById(`score-${team.name}`).value = team.score; } else { button.className = 'game-button-round font-semibold bg-gradient-to-br from-gray-400 to-gray-500 border-2 border-gray-600 text-gray-900 shadow-lg flex items-center justify-center'; } gameState.selected[cellId] = true; saveState(); }
        async function qPopUp(cellId) {
            const dlg = document.getElementById('q-dialog'); const qText = document.getElementById('q-text'); const okBtn = document.getElementById('q-ok'); const wrongBtn = document.getElementById('q-wrong'); const startBtn = document.getElementById('start-timer-btn'); const timerDisplay = document.getElementById('timer-display'); const pillsContainer = document.getElementById('team-pills-container');
            pillsContainer.innerHTML = ''; if (!gameState.teams) return { cancelled: true };
            gameState.teams.forEach(team => { const colors = teamColorConfigs[team.name] || teamColorConfigs['A']; const pill = document.createElement('button'); pill.type = 'button'; pill.dataset.team = team.name; pill.className = `border-2 border-gray-300 rounded-lg px-5 py-2.5 cursor-pointer bg-gray-100 text-xl font-semibold transition-all ${colors.hover} hover:text-white hover:border-transparent hover:scale-105`; pill.textContent = team.name; pillsContainer.appendChild(pill); });
            const pills = Array.from(pillsContainer.querySelectorAll('button[data-team]')); const soal = questions[cellId];
            if (soal) { qText.textContent = soal.pertanyaan; } else { qText.textContent = `Soal untuk ${cellId} tidak ditemukan.`; }
            stopTimer(); stopTimeUpSound(); if (startBtn) startBtn.disabled = false; if (timerDisplay) { timerDisplay.className = "text-3xl font-bold font-mono min-w-[110px] text-center px-4 py-2 rounded-lg bg-gradient-to-br from-gray-600/30 to-gray-700/30 text-emerald-500 shadow-inner"; timerDisplay.style.textShadow = "0 0 10px rgba(16, 185, 129, 0.5)"; timerDisplay.textContent = '00:00'; } let selectedTeam = null;
            return new Promise((resolve) => {
                const onPillClick = (e) => { selectedTeam = e.currentTarget.dataset.team; pills.forEach(p => { const colors = teamColorConfigs[p.dataset.team] || teamColorConfigs['A']; if (p.dataset.team === selectedTeam) { p.className = `border-2 border-transparent rounded-lg px-5 py-2.5 cursor-pointer text-xl font-semibold transition-all ${colors.selected} text-white shadow-md scale-105`; } else { p.className = `border-2 border-gray-300 rounded-lg px-5 py-2.5 cursor-pointer bg-gray-100 text-xl font-semibold transition-all ${colors.hover} hover:text-white hover:border-transparent hover:scale-105`; } }); };
                const shakePills = () => { pills.forEach(p => { p.classList.add('animate-shake'); setTimeout(() => p.classList.remove('animate-shake'), 400); }); };
                const onOkClick = (e) => { if (!selectedTeam) { e.preventDefault(); shakePills(); } }; const onWrongClick = (e) => { if (!selectedTeam) { e.preventDefault(); shakePills(); } };
                const onStartTimer = () => { console.warn("Timer belum diimplementasikan untuk soal semifinal"); }; // Timer belum ada di data soal
                const escHandler = (event) => { if (event.key === 'Escape') { stopTimeUpSound(); dlg.close(); resolve({ cancelled: true }); } };
                const onClose = () => {
                    stopTimer(); stopTimeUpSound(); document.removeEventListener('keydown', escHandler); dlg.removeEventListener('close', onClose); pills.forEach(p => p.removeEventListener('click', onPillClick)); if(okBtn) okBtn.removeEventListener('click', onOkClick); if(wrongBtn) wrongBtn.removeEventListener('click', onWrongClick); if(startBtn) startBtn.removeEventListener('click', onStartTimer);
                    dlg.classList.remove('translate-y-0', 'opacity-100');
                    if (dlg.returnValue === 'ok' && selectedTeam) { resolve({ cancelled: false, team: selectedTeam, delta: 100 }); }
                    else if (dlg.returnValue === 'wrong' && selectedTeam) { resolve({ cancelled: false, team: selectedTeam, delta: -100 }); } // Poin salah -100
                    else { resolve({ cancelled: true }); }
                };
                pills.forEach(p => p.addEventListener('click', onPillClick)); if(okBtn) okBtn.addEventListener('click', onOkClick); if(wrongBtn) wrongBtn.addEventListener('click', onWrongClick); if(startBtn) startBtn.addEventListener('click', onStartTimer); document.addEventListener('keydown', escHandler); dlg.addEventListener('close', onClose, { once: true });
                dlg.showModal(); setTimeout(() => dlg.classList.add('translate-y-0', 'opacity-100'), 10);
            });
        }

        // ================================================================
        // INITIALIZATION
        // ================================================================
        window.addEventListener('beforeunload', () => { stopTimeUpSound(); });
        window.addEventListener('load', () => {
            console.log('=== CSS 2.0 Game Board Initialization - Semifinal ===');
            loadState(); loadQuestions(); renderTeams(); createGrid();
            console.log('Teams:', gameState.teams?.map(t => t.name).join(', '));
        });
    </script>
</body>
</html>
