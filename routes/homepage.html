<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lomba Cepat Tepat - CSS 2.0</title>
    <!-- Memuat Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Memuat Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        /* Properti kustom untuk body */
        body {
            font-family: 'Inter', sans-serif;
            /* Membuat latar belakang grid dan gradasi radial seperti pada gambar */
            background-color: #382c38;
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.05) 1px, transparent 1px),
                radial-gradient(ellipse at center, #6e5a6e, #3a2b3a);
            background-size: 20px 20px, 20px 20px, 100% 100%;
        }

        /* Efek bayangan khusus untuk judul utama */
        .title-shadow {
            text-shadow: 0px 4px 10px rgba(0, 0, 0, 0.4);
        }
    </style>
</head>
<body class="text-white min-h-screen flex flex-col antialiased">

    <!-- Header di Pojok Kiri Atas -->
    <header class="absolute top-0 left-0 p-4 md:p-6">
        <div class="flex items-center space-x-3">
            <!-- Placeholder untuk 2 logo -->
            <img src="https://placehold.co/40x40/2d222d/ffffff?text=L1" alt="Logo 1" class="h-8 md:h-10 w-auto rounded-md shadow-lg">
            <img src="https://placehold.co/40x40/2d222d/ffffff?text=L2" alt="Logo 2" class="h-8 md:h-10 w-auto rounded-md shadow-lg">
            <div class="border-l border-gray-400 h-8 md:h-10 mx-2"></div>
            <!-- Teks Acara -->
            <span class="text-lg md:text-xl font-bold tracking-wider">CSS 2.0</span>
        </div>
    </header>

    <!-- Konten Utama -->
    <main class="flex-grow flex flex-col items-center justify-center p-4">
        
        <!-- Judul Utama -->
        <h1 class="text-4xl md:text-6xl font-black uppercase tracking-widest mb-12 md:mb-16 title-shadow">
            Lomba Cepat Tepat
        </h1>

        <!-- Kontainer untuk Logo dan Tombol Opsi -->
        <div class="w-full max-w-5xl grid grid-cols-1 md:grid-cols-2 gap-8 md:gap-16 items-center">
            
            <!-- Kolom Kiri: Logo Utama -->
            <div class="flex justify-center items-center">
                <!-- Placeholder untuk logo CS Showdown -->
                <img src="https://placehold.co/400x300/ffffff/c92a2a?text=CS+Showdown+2.0" 
                     alt="Logo CS Showdown" 
                     class="max-w-xs md:max-w-sm w-full h-auto rounded-2xl bg-white/10 p-2 shadow-2xl"
                     onerror="this.onerror=null; this.src='https://placehold.co/400x300/2d222d/ffffff?text=Logo+Acara';">
            </div>

            <!-- Kolom Kanan: Tombol Opsi -->
            <div class="flex justify-center md:justify-start">
                <div class="flex flex-col space-y-5 w-full max-w-sm">
                    <!-- Tombol Opsi 1 -->
                    <a href="penyisihan.html" class="bg-red-600 text-center  hover:bg-red-700 text-white font-bold text-lg py-3 px-6 rounded-lg shadow-lg transform transition-transform duration-200 hover:scale-105 focus:outline-none focus:ring-4 focus:ring-red-400">
                        Babak Penyisihan
                    </a>
                    <!-- Tombol Opsi 2 -->
                    <a href="" class="bg-red-600 hover:bg-red-700 text-center text-white font-bold text-lg py-3 px-6 rounded-lg shadow-lg transform transition-transform duration-200 hover:scale-105 focus:outline-none focus:ring-4 focus:ring-red-400">
                        Babak Semifinal
                    </a>
                    <!-- Tombol Opsi 3 -->
                    <a href="" class="bg-red-600 hover:bg-red-700 text-center text-white font-bold text-lg py-3 px-6 rounded-lg shadow-lg transform transition-transform duration-200 hover:scale-105 focus:outline-none focus:ring-4 focus:ring-red-400">
                        Babak Final
                    </a>
                </div>
            </div>

        </div>
    </main>

</body>
</html>
