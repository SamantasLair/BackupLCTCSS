<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CSS 2.0 Game Board</title>
    <link rel="stylesheet" href="css/output.css" />

    <!-- FONT GOOGLE POPPINS -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,300;0,400;0,600;1,400&display=swap"
        rel="stylesheet"
    />

    <style>
        /* === BASE STYLE === */
        body {
            background:
                linear-gradient(90deg, rgba(255, 255, 255, 0.05) 1px, transparent 1px),
                linear-gradient(rgba(255, 255, 255, 0.05) 1px, transparent 1px),
                radial-gradient(circle at center, #000 0%, #000 50%, #000 100%);
            background-size: 10px 10px, 10px 10px, auto;
            font-family: 'Arial', sans-serif;
        }

        .poppins-light { font-family: "Poppins", sans-serif; font-weight: 300; }
        .poppins-regular { font-family: "Poppins", sans-serif; font-weight: 400; }
        .poppins-regular-italic { font-family: "Poppins", sans-serif; font-weight: 400; font-style: italic; }
        .poppins-semibold { font-family: "Poppins", sans-serif; font-weight: 600; }

        /* === GAME BUTTONS === */
        .game-button {
            transition: opacity 0.3s ease, transform 0.3s ease, box-shadow 0.3s ease;
            background-color: rgba(156, 163, 175, 0.4);
            border: 2px solid rgba(255, 255, 255, 0.6);
            color: black;
        }

        .game-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
            background: linear-gradient(135deg, rgba(209, 213, 219, 0.9) 0%, rgba(156, 163, 175, 1) 100%);
        }

        .game-button.selected {
            background: linear-gradient(135deg, #fbbf24 0%, #f59e0b 100%);
            border-color: #d97706;
            color: #1f2937;
            font-weight: bold;
        }

        .category-button {
            background: linear-gradient(135deg, rgba(107, 114, 128, 0.9) 0%, rgba(75, 85, 99, 1) 100%);
            border: 2px solid rgba(156, 163, 175, 0.3);
        }

        .category-button:hover {
            background: linear-gradient(135deg, rgba(156, 163, 175, 0.9) 0%, rgba(107, 114, 128, 1) 100%);
        }

        .logo-shield {
            filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.3));
        }

        /* === TEAM PILL === */
        .team-pill {
            border: 1px solid #111;
            border-radius: .25rem;
            padding: .5rem 1rem;
            cursor: pointer;
            background: #eee;
        }

        .team-pill[data-team="A"].active { background-color: #ff4444; color: white; }
        .team-pill[data-team="B"].active { background-color: #3b82ff; color: white; }
        .team-pill[data-team="C"].active { background-color: #ffcf15; color: black; }
        .team-pill[data-team="D"].active { background-color: #22dd5e; color: white; }

        .team-pill.shake { animation: shake 0.4s; }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-4px); }
            40%, 80% { transform: translateX(4px); }
        }

        /* === ORBIT BACKGROUND === */
        #bg-orbit {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 500px;
            height: 500px;
            pointer-events: none;
            z-index: 0;
        }

        .orbit {
            position: absolute;
            border-radius: 50%;
            animation: rotateCounterClockwise 12s linear infinite;
        }

        .orbit-red { width: 500px; height: 500px; top: 50px; }
        .orbit-blue { width: 300px; height: 300px; top: 100px; animation-duration: 6s; }

        .planet {
            position: absolute;
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: currentColor;
            box-shadow:
                0 0 80px 40px currentColor,
                0 0 200px 100px currentColor;
            opacity: 0.9;
            pointer-events: none;
        }

        .planet-red { background: radial-gradient(circle, rgba(245, 68, 68, 0.5)); color: rgba(245, 68, 68, 0.4); }
        .planet-blue { background: radial-gradient(circle, rgba(59, 130, 246, 0.5)); color: rgba(59, 130, 246, 0.4); }

        @keyframes rotateCounterClockwise {
            from { transform: rotate(0deg); }
            to { transform: rotate(-360deg); }
        }

        @keyframes glowPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        .planet-red, .planet-blue { animation: glowPulse 6s ease-in-out infinite; }
    </style>
</head>

<body class="min-h-screen flex flex-col">

    <!-- === ORBIT BACKGROUND === -->
    <div id="bg-orbit">
        <div class="orbit orbit-red"><div class="planet planet-red"></div></div>
        <div class="orbit orbit-blue"><div class="planet planet-blue"></div></div>
    </div>

    <!-- === POPUP === -->
    <dialog
        id="q-dialog"
        class="rounded-2xl p-0 backdrop:bg-black/50 -translate-y-20 bg-white/90 opacity-0 shadow fixed left-1/2 -translate-x-1/2 top-10 transition-all duration-800"
    >
        <form method="dialog" class="min-w-[36rem] max-w-[90vw] rounded-2xl">
            <header class="px-4 py-3 text-center">
                <h3 class="font-bold text-2xl poppins-semibold">Pertanyaan</h3>
            </header>

            <section class="px-4 pb-2 text-center mb-5 mx-auto flex justify-center w-4/5">
                <blockquote id="q-text" class="italic text-lg text-center poppins-regular-italic">
                    "soal beneran"
                </blockquote>
            </section>

            <div class="relative px-4 pb-4 flex items-center justify-center">
                <!-- Pilihan Tim -->
                <div class="space-x-2 poppins-regular">
                    <button type="button" data-team="A" class="team-pill !text-xl hover:!bg-red-400 hover:text-white transition">A</button>
                    <button type="button" data-team="B" class="team-pill !text-xl hover:!bg-blue-400 hover:text-white transition">B</button>
                    <button type="button" data-team="C" class="team-pill !text-xl hover:!bg-yellow-400 hover:text-white transition">C</button>
                    <button type="button" data-team="D" class="team-pill !text-xl hover:!bg-green-400 hover:text-white transition">D</button>
                </div>

                <!-- Tombol OK / Wrong -->
                <div class="absolute right-4 bottom-4 space-x-2 flex justify-between poppins-semibold">
                    <button id="q-wrong" value="wrong" class="h-8 border w-10 rounded grid place-items-center bg-red-500">x</button>
                    <button id="q-ok" value="ok" class="h-8 border w-10 rounded grid place-items-center bg-green-500">✓</button>
                </div>
            </div>
        </form>
    </dialog>

    <!-- === MAIN CONTENT === -->
    <div class="rounded-2xl py-4 max-w-4xl w-full mx-auto flex flex-col flex-grow">
        <!-- Logo -->
        <div class="fixed top-0 left-0 p-4 flex items-center gap-2">
            <svg class="logo-shield w-10 h-10" viewBox="0 0 100 120" xmlns="http://www.w3.org/2000/svg">
                <path d="M50 5 L85 20 L85 50 Q85 75 50 110 Q15 75 15 50 L15 20 Z"
                      fill="url(#shieldGradient)" stroke="#fbbf24" stroke-width="2" />
                <circle cx="50" cy="35" r="8" fill="#fbbf24" />
                <path d="M35 50 L50 65 L65 50" stroke="#fbbf24" stroke-width="3" fill="none" />
                <text x="50" y="85" text-anchor="middle" font-size="12" font-weight="bold" fill="#fbbf24">CSS</text>
                <defs>
                    <linearGradient id="shieldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" style="stop-color:#374151" />
                        <stop offset="100%" style="stop-color:#1f2937" />
                    </linearGradient>
                </defs>
            </svg>
            <h1 class="text-white text-xl font-bold">CSS<span class="text-sm ml-1">2.0</span></h1>
        </div>

        <!-- Board -->
        <div class="flex flex-col items-center justify-center flex-grow">
            <div class="flex mb-6">
                <div id="team-container" class="grid grid-cols-4 justify-center gap-4 items-center"></div>
            </div>
            <div id="game-grid" class="grid gap-4 mb-8"></div>
        </div>

        <!-- Reset -->
        <div class="fixed bottom-0 left-0 p-4">
            <button
                onclick="resetBoard()"
                class="px-6 py-2 bg-red-600 hover:bg-red-700 text-white font-bold rounded-lg transition-all duration-300 hover:scale-105"
            >
                Reset
            </button>
        </div>
    </div>

    <!-- === SCRIPT === -->
    <script src="soal/dummy.js"></script>
    <script>
        /* ---------- Tim ---------- */
        let teams = JSON.parse(localStorage.getItem("teams")) || [
            { name: "A", score: 0 },
            { name: "B", score: 0 },
            { name: "C", score: 0 },
            { name: "D", score: 0 },
        ];

        const container = document.getElementById("team-container");
        container.className = `grid grid-cols-${Math.min(teams.length, 4)} gap-4 w-full`;

        function renderTeams() {
            container.innerHTML = "";
            teams.forEach(team => {
                const div = document.createElement("div");
                div.className = "category-button rounded-lg shadow-md h-20 w-24 flex flex-col justify-between";
                div.innerHTML = `
                    <div class="bg-gray-700 text-center py-1">
                        <span class="text-base font-bold text-white">${team.name}</span>
                    </div>
                    <div class="bg-gray-800 text-center py-2">
                        <span id="score-${team.name}" class="text-lg font-extrabold text-white">${team.score}</span>
                    </div>`;
                container.appendChild(div);
            });
        }
        renderTeams();

        /* ---------- Grid ---------- */
        const rows = 4, cols = 6;
        let selectedCells = new Set();
        let questions = {};
        dataPenyisihan.forEach(item => { questions[item.id] = item; });

        function createGrid() {
            const grid = document.getElementById('game-grid');
            grid.innerHTML = "";
            grid.style.gridTemplateColumns = `repeat(${cols}, 6rem)`;

            for (let r = 0; r < rows; r++) {
                const rowLetter = String.fromCharCode(65 + r);
                for (let c = 1; c <= cols; c++) {
                    const cellId = rowLetter + c;
                    const button = document.createElement('button');
                    button.className = "bg-opacity-50 game-button h-20 rounded-lg text-black font-bold text-xl hover:scale-105";
                    button.dataset.cell = cellId;
                    button.innerText = cellId;
                    button.onclick = async () => {
                        selectCell(button);
                        const res = await qPopUp(button);

                        if (res.cancelled) {
                            selectCell(button);
                            return;
                        }

                        const t = teams.find(x => x.name === res.team);
                        if (t) {
                            t.score += res.delta;
                            document.getElementById(`score-${t.name}`).textContent = t.score;
                            localStorage.setItem("teams", JSON.stringify(teams));
                        }
                    };
                    grid.appendChild(button);
                }
            }
        }

        /* ---------- Popup ---------- */
        async function qPopUp(button) {
            const cellId = button.dataset.cell;
            if (!selectedCells.has(cellId)) return { cancelled: true };

            const dlg = document.getElementById('q-dialog');
            const qText = document.getElementById('q-text');
            const okBtn = document.getElementById('q-ok');
            const wrongBtn = document.getElementById('q-wrong');
            const pills = Array.from(dlg.querySelectorAll('.team-pill'));

            const soal = questions[cellId];
            qText.textContent = soal ? soal.pertanyaan : "Soal belum tersedia untuk " + cellId;

            let team = null;
            const delta = 100, wDelta = -50;
            pills.forEach(p => p.classList.remove('active'));

            const onPill = e => {
                team = e.currentTarget.dataset.team;
                pills.forEach(p => p.classList.toggle('active', p.dataset.team === team));
            };
            pills.forEach(p => p.addEventListener('click', onPill));

            const shakePills = () => pills.forEach(p => {
                p.classList.add('shake');
                p.addEventListener('animationend', () => p.classList.remove('shake'), { once: true });
            });

            const onOk = e => { if (!team) { e.preventDefault(); shakePills(); } };
            const onWrong = e => { if (!team) { e.preventDefault(); shakePills(); } };

            okBtn.addEventListener('click', onOk);
            wrongBtn.addEventListener('click', onWrong);

            const result = await new Promise(resolve => {
                const onClose = () => {
                    dlg.removeEventListener('close', onClose);
                    pills.forEach(p => p.removeEventListener('click', onPill));
                    okBtn.removeEventListener('click', onOk);
                    wrongBtn.removeEventListener('click', onWrong);

                    if (dlg.returnValue === 'ok' && team)
                        resolve({ cancelled: false, team, delta, cellId });
                    else if (dlg.returnValue === 'wrong' && team)
                        resolve({ cancelled: false, team, delta: wDelta, cellId });
                    else resolve({ cancelled: true });
                };

                dlg.addEventListener('close', onClose, { once: true });
                dlg.showModal();
                dlg.classList.add('translate-y-0', 'opacity-100');
            });
            return result;
        }

        /* ---------- Utils ---------- */
        function selectCell(button) {
            const cellId = button.dataset.cell;
            if (selectedCells.has(cellId)) {
                button.classList.remove('selected');
                selectedCells.delete(cellId);
            } else {
                button.classList.add('selected');
                selectedCells.add(cellId);
            }
            button.style.transform = 'scale(0.95)';
            setTimeout(() => (button.style.transform = ''), 150);
        }

        function resetBoard() {
            selectedCells.clear();
            document.querySelectorAll('.game-button').forEach(b => b.classList.remove('selected'));
            teams.forEach(t => (t.score = 0));
            localStorage.setItem("teams", JSON.stringify(teams));
            renderTeams();
        }

        document.addEventListener('keydown', e => {
            if (e.key.toLowerCase() === 'r') resetBoard();
        });

        window.addEventListener('load', () => {
            createGrid();
            const buttons = document.querySelectorAll('.game-button');
            buttons.forEach((button, index) => {
                button.style.opacity = '0';
                button.style.transform = 'translateY(20px)';
                setTimeout(() => {
                    button.style.transition = 'all 0.5s ease';
                    button.style.opacity = '1';
                    button.style.transform = 'translateY(0)';
                }, index * 100);
            });
        });
    </script>
</body>
</html>
