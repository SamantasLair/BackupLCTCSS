<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS 2.0 Game Board</title>
    <link rel="stylesheet" href="css/output.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,300;0,400;0,600;1,400&display=swap"
        rel="stylesheet">

    <style>
        body {
            background:
                linear-gradient(90deg, rgba(255, 255, 255, 0.05) 1px, transparent 1px),
                linear-gradient(rgba(255, 255, 255, 0.05) 1px, transparent 1px),
                radial-gradient(circle at center, #000 0%, #000 50%, #000 100%);
            background-size: 10px 10px, 10px 10px, auto;
            font-family: 'Arial', sans-serif;
        }

        .poppins-light {
            font-family: "Poppins", sans-serif;
            font-weight: 300;
            font-style: normal;
        }

        .poppins-regular {
            font-family: "Poppins", sans-serif;
            font-weight: 400;
            font-style: normal;
        }

        .poppins-regular-italic {
            font-family: "Poppins", sans-serif;
            font-weight: 400;
            font-style: italic;
        }

        .poppins-semibold {
            font-family: "Poppins", sans-serif;
            font-weight: 600;
            font-style: normal;
        }


        .game-button {
            transition: opacity 0.3s ease, transform 0.3s ease, box-shadow 0.3s ease;
            background-color: rgba(156, 163, 175, 0.4);
            border: 2px solid rgba(255, 255, 255, 0.6);
            color: black;
        }

        .game-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
            background: linear-gradient(135deg, rgba(209, 213, 219, 0.9) 0%, rgba(156, 163, 175, 1) 100%);
        }

        .game-button.selected {
            background: linear-gradient(135deg, #fbbf24 0%, #f59e0b 100%);
            border-color: #d97706;
            color: #1f2937;
            font-weight: bold;
        }

        .category-button {
            background: linear-gradient(135deg, rgba(107, 114, 128, 0.9) 0%, rgba(75, 85, 99, 1) 100%);
            border: 2px solid rgba(156, 163, 175, 0.3);
        }

        .category-button:hover {
            background: linear-gradient(135deg, rgba(156, 163, 175, 0.9) 0%, rgba(107, 114, 128, 1) 100%);
        }

        .logo-shield {
            filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.3));
        }

        /* qPopUp */
        .team-pill {
            border: 1px solid #111;
            border-radius: .25rem;
            padding: .5rem 1rem;
            cursor: pointer;
            background: #eee;
        }

        .team-pill[data-team="A"].active {
            background-color: #ff4444;
            color: white;
        }

        .team-pill[data-team="B"].active {
            background-color: #3b82ff;
            color: white;
        }

        .team-pill[data-team="C"].active {
            background-color: #ffcf15;
            color: black;
        }

        .team-pill[data-team="D"].active {
            background-color: #22dd5e;
            color: white;
        }

        .team-pill.active {
            background: #bbb;
        }

        @keyframes shake {

            0%,
            100% {
                transform: translateX(0);
            }

            20%,
            60% {
                transform: translateX(-4px);
            }

            40%,
            80% {
                transform: translateX(4px);
            }
        }

        .team-pill.shake {
            animation: shake 0.4s;
        }

        /* Timer Styles */
        .timer-display {
            font-size: 2.5rem;
            font-weight: bold;
            font-family: "Courier New", monospace;
            min-width: 120px;
            text-align: center;
            padding: 10px;
            border-radius: 8px;
            background: linear-gradient(135deg, rgba(107, 114, 128, 0.3) 0%, rgba(75, 85, 99, 0.3) 100%);
            color: #10b981;
            text-shadow: 0 0 10px rgba(16, 185, 129, 0.5);
        }

        .timer-display.warning {
            color: #f59e0b;
            text-shadow: 0 0 10px rgba(245, 158, 11, 0.5);
        }

        .timer-display.danger {
            color: #ef4444;
            text-shadow: 0 0 10px rgba(239, 68, 68, 0.7);
            animation: pulse-danger 0.5s infinite;
        }

        @keyframes pulse-danger {

            0%,
            100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.05);
            }
        }

        .start-timer-btn {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            border: 2px solid #047857;
            color: white;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .start-timer-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.4);
        }

        .start-timer-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* ==== Orbit Background ==== */
        #bg-orbit {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 500px;
            height: 500px;
            pointer-events: none;
            z-index: 0;
        }

        .center-point {
            position: absolute;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            z-index: 10;
        }

        .orbit {
            position: absolute;
            border-radius: 50%;
            animation: rotateCounterClockwise 12s linear infinite;
        }

        .orbit-red {
            width: 500px;
            height: 500px;
            top: 50px;
        }

        .orbit-blue {
            width: 300px;
            height: 300px;
            top: 100px;
            animation-duration: 6s;
        }

        .planet {
            position: absolute;
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: currentColor;
            box-shadow:
                0 0 80px 40px currentColor,
                0 0 200px 100px currentColor;
            opacity: 0.9;
            pointer-events: none;
        }

        .planet-red {
            background: radial-gradient(circle, rgba(245, 68, 68, 0.5));
            color: rgba(245, 68, 68, 0.4);
        }

        .planet-blue {
            background: radial-gradient(circle, rgba(59, 130, 246, 0.5));
            color: rgba(59, 130, 246, 0.4);
        }

        @keyframes glowPulse {

            0%,
            100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.1);
            }
        }

        .planet-red,
        .planet-blue {
            animation: glowPulse 6s ease-in-out infinite;
        }

        @keyframes rotateCounterClockwise {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(-360deg);
            }
        }

        @keyframes planetPulse {

            0%,
            100% {
                transform: scale(0.9);
                filter: drop-shadow(0 0 10px currentColor);
            }

            50% {
                transform: scale(1.4);
                filter: drop-shadow(0 0 20px currentColor);
            }
        }
    </style>
</head>

<div class="orbit-container" id="bg-orbit">
    <div class="center-point"></div>
    <div class="orbit orbit-red">
        <div class="planet planet-red"></div>
    </div>
    <div class="orbit orbit-blue">
        <div class="planet planet-blue"></div>
    </div>
</div>

<dialog id="q-dialog"
    class="rounded-2xl p-0 backdrop:bg-black/50 -translate-y-20 bg-white/90 opacity-0 shadow fixed left-1/2 -translate-x-1/2 top-10 transition-all duration-800">
    <form method="dialog" class="min-w-[36rem] max-w-[90vw] rounded-2xl">
        <header class="px-4 py-3 text-center flex justify-between items-center">
            <h3 class="font-bold text-2xl poppins-semibold flex-1">Pertanyaan</h3>
            <div class="flex items-center gap-2">
                <button type="button" id="start-timer-btn" class="start-timer-btn">Start ▶</button>
                <div id="timer-display" class="timer-display">00:00</div>
            </div>
        </header>

        <section class="px-4 pb-2 text-center mb-5 mx-auto flex justify-center w-4/5">
            <blockquote id="q-text" class="italic text-lg text-center poppins-regular-italic">"soal beneran"
            </blockquote>
        </section>

        <div class="relative px-4 pb-4 flex items-center justify-center">
            <div class="space-x-2 poppins-regular">
                <button type="button" data-team="A"
                    class="team-pill !text-xl hover:!bg-red-400 hover:text-white transition">A</button>
                <button type="button" data-team="B"
                    class="team-pill !text-xl hover:!bg-blue-400 hover:text-white transition">B</button>
                <button type="button" data-team="C"
                    class="team-pill !text-xl hover:!bg-yellow-400 hover:text-white transition">C</button>
                <button type="button" data-team="D"
                    class="team-pill !text-xl hover:!bg-green-400 hover:text-white transition">D</button>
            </div>

            <div class="absolute right-4 bottom-4 space-x-2 flex justify-between poppins-semibold">
                <button id="q-wrong" value="wrong"
                    class="h-8 border w-10 rounded grid place-items-center cursor-pointer bg-red-500">x</button>
                <button id="q-ok" value="ok"
                    class="h-8 border w-10 rounded cursor-pointer grid place-items-center bg-green-500">✓</button>
            </div>
        </div>
    </form>
</dialog>

<body class="min-h-screen flex flex-col">

    <div class="rounded-2xl py-4 max-w-4xl w-full mx-auto flex flex-col flex-grow">

        <div class="fixed top-0 left-0 p-4 flex items-center gap-2">
            <img src="resources/himacom.png" class="w-10 h-10">
            <img src="resources/logocss.png" class="w-10 h-10">
            <h1 class="text-white text-2xl font-bold poppins-semibold">CSS<span class="text-sm ml-1">2.0</span></h1>
        </div>

        <div class="flex flex-col items-center justify-center flex-grow">
            <div class="flex mb-15">
                <div id="team-container" class="grid grid-cols-4 justify-center gap-4 items-center"></div>
            </div>
            <div id="game-grid" class="grid gap-4 mb-8"></div>
        </div>

        <div class="fixed bottom-0 right-0 p-4">
            <button onclick="resetBoard()"
                class="px-6 py-2 bg-red-600 poppins-regular cursor-pointer text-sm hover:bg-red-700 text-white font-bold rounded-lg transition-all duration-300 hover:scale-105">
                Reset Babak Ini
            </button>
        </div>

        <div class="fixed bottom-0 left-0 p-4">
            <a href="homepage.html"
                class="px-6 py-2 bg-red-600 poppins-regular cursor-pointer text-sm hover:bg-red-700 text-white font-bold rounded-lg transition-all duration-300 hover:scale-105">
                Back
            </a>
        </div>
    </div>
    
    <script src="soal/dummy.js"></script>
    <script src="js/gameState.js"></script> <script>
        // ================================================================
        // BAGIAN 1: PENGATURAN GLOBAL
        // ================================================================

        const NAMA_BABAK = 'penyisihan'; // MODIFIED: Tentukan nama babak ini
        const rows = 4;
        const cols = 6;
        const teamContainer = document.getElementById("team-container");
        const gridContainer = document.getElementById('game-grid');
        let questions = {};

        function resetBoard() {
            // MODIFIED: Panggil reset spesifik untuk babak ini
            GameManager.resetBabak(NAMA_BABAK);
        }

        // ================================================================
        // BAGIAN 2: RENDER UI (TAMPILAN)
        // ================================================================

        function renderTeams() {
            teamContainer.innerHTML = "";
            // MODIFIED: Ambil tim untuk babak ini
            const currentTeams = GameManager.getTeams(NAMA_BABAK); 
            teamContainer.className = `grid grid-cols-${Math.min(currentTeams.length, 4)} gap-4 w-full mb-10`;

            currentTeams.forEach((team, i) => {
                const teamColors = ["red", "blue", "yellow", "green"];
                const color = teamColors[i] || "gray";
                const div = document.createElement("div");
                div.className = "category-button rounded-lg overflow-hidden shadow-md h-20 w-24 flex flex-col justify-between";
                div.innerHTML = `
                <div class="text-center py-1 bg-${color}-400">
                    <span class="text-xl font-bold text-white poppins-semibold">${team.name}</span>
                </div>
                <div class="bg-${color}-400/40 text-center py-2">
                    <span id="score-${team.name}" class="text-xl font-extrabold text-white poppins-semibold">${team.score}</span>
                </div>`;
                teamContainer.appendChild(div);
            });
        }

        async function loadQuestions() {
            try {
                questions = Object.fromEntries(dataPenyisihan.map(q => [q.id, q]));
            } catch (err) {
                alert("Gagal memuat soal: " + err.message);
                console.error(err);
            }
        }

        function createGrid() {
            gridContainer.innerHTML = "";
            gridContainer.style.gridTemplateColumns = `repeat(${cols}, 6rem)`;

            for (let r = 0; r < rows; r++) {
                const rowLetter = String.fromCharCode(65 + r);
                for (let c = 0; c < cols; c++) {
                    const cellId = rowLetter + (c + 1);
                    const button = document.createElement('button');

                    button.className = `!bg-black/50 poppins-semibold cursor-pointer game-button h-20 rounded-lg !text-white font-bold text-xl hover:scale-105`;
                    button.dataset.cell = cellId;
                    button.innerText = cellId;

                    // MODIFIED: Cek ke GameManager untuk babak ini
                    if (GameManager.isSelected(NAMA_BABAK, cellId)) { 
                        button.classList.add('selected');
                    }

                    button.onclick = handleCellClick;
                    gridContainer.appendChild(button);
                }
            }
        }

        // ================================================================
        // BAGIAN 3: LOGIKA TIMER
        // ================================================================

        let timerInterval = null;
        let timeRemaining = 0;

        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = seconds % 60;
            return `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
        }

        function updateTimerDisplay() {
            const timerDisplay = document.getElementById('timer-display');
            timerDisplay.textContent = formatTime(timeRemaining);

            if (timeRemaining <= 5 && timeRemaining > 0) {
                timerDisplay.classList.add('warning');
            }
            if (timeRemaining <= 3) {
                timerDisplay.classList.remove('warning');
                timerDisplay.classList.add('danger');
            }
        }

        function startTimer(duration) {
            const startBtn = document.getElementById('start-timer-btn');
            const timerDisplay = document.getElementById('timer-display');

            startBtn.disabled = true;
            timeRemaining = duration;
            updateTimerDisplay();

            timerInterval = setInterval(() => {
                timeRemaining--;
                updateTimerDisplay();

                if (timeRemaining <= 0) {
                    clearInterval(timerInterval);
                    timerDisplay.classList.remove('warning', 'danger');
                    playTimeUpSound();

                    let loopCount = 0;
                    const loopInterval = setInterval(() => {
                        playTimeUpSound();
                        loopCount++;
                        if (loopCount >= 2) {
                            clearInterval(loopInterval);
                        }
                    }, 1000);

                    const stopSound = () => {
                        clearInterval(loopInterval);
                        if (typeof stopTimeUpSound === 'function') {
                            stopTimeUpSound(); 
                        }
                        document.removeEventListener('keydown', escHandler);
                    };

                    const escHandler = (event) => {
                        if (event.key === 'Escape') {
                            stopSound();
                        }
                    };
                    document.addEventListener('keydown', escHandler);

                    window.addEventListener('beforeunload', stopSound);
                }

            }, 1000);
        }

        function stopTimer() {
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }
        }

        function playTimeUpSound() {
            const audio = new Audio('resources/timeup.mp3');
            audio.play().catch(err => console.log('Sound tidak ditemukan atau error:', err));
        }

        // ================================================================
        // BAGIAN 4: LOGIKA INTERAKSI
        // ================================================================

        async function handleCellClick(event) {
            const button = event.currentTarget;
            const cellId = button.dataset.cell; 

            // MODIFIED: Cek ke GameManager untuk babak ini
            if (GameManager.isSelected(NAMA_BABAK, cellId)) { 
                return;
            }

            button.classList.add('selected');
            // MODIFIED: Simpan ke GameManager untuk babak ini
            GameManager.selectSoal(NAMA_BABAK, cellId, true); 

            const res = await qPopUp(cellId);

            if (res.cancelled) {
                button.classList.remove('selected');
                // MODIFIED: Hapus dari GameManager untuk babak ini
                GameManager.selectSoal(NAMA_BABAK, cellId, false); 
                return;
            }

            // MODIFIED: Update skor via GameManager untuk babak ini
            GameManager.updateScore(NAMA_BABAK, res.team, res.delta);
            const team = GameManager.getTeams(NAMA_BABAK).find(x => x.name === res.team);
            
            if (team) {
                const scoreEl = document.getElementById(`score-${team.name}`);
                if (scoreEl) scoreEl.textContent = team.score;
            }
        }

        async function qPopUp(cellId) {
            const dlg = document.getElementById('q-dialog');
            const qText = document.getElementById('q-text');
            const okBtn = document.getElementById('q-ok');
            const wrongBtn = document.getElementById('q-wrong');
            const startBtn = document.getElementById('start-timer-btn');
            const timerDisplay = document.getElementById('timer-display');
            const pills = Array.from(dlg.querySelectorAll('.team-pill'));

            const soal = questions[cellId];
            qText.textContent = soal ? soal.pertanyaan : `Soal untuk ${cellId} belum tersedia.`;

            stopTimer();
            startBtn.disabled = false;
            timerDisplay.classList.remove('warning', 'danger');
            timerDisplay.textContent = '00:00';

            let selectedTeam = null;
            const correctDelta = (soal && soal.poin_benar) ? soal.poin_benar : 100;
            const wrongDelta = (soal && soal.poin_salah) ? soal.poin_salah : -50;

            pills.forEach(p => p.classList.remove('active'));

            return new Promise((resolve) => {
                const onPillClick = (e) => {
                    selectedTeam = e.currentTarget.dataset.team;
                    pills.forEach(p => p.classList.toggle('active', p.dataset.team === selectedTeam));
                };

                const shakePills = () => {
                    pills.forEach(p => {
                        p.classList.add('shake');
                        p.addEventListener('animationend', () => p.classList.remove('shake'), { once: true });
                    });
                };

                const onOkClick = (e) => {
                    if (!selectedTeam) {
                        e.preventDefault();
                        shakePills();
                    }
                };

                const onWrongClick = (e) => {
                    if (!selectedTeam) {
                        e.preventDefault();
                        shakePills();
                    }
                };

                const onStartTimer = () => {
                    if (soal && soal.waktu) {
                        startTimer(soal.waktu);
                    }
                };

                const onClose = () => {
                    stopTimer();
                    dlg.removeEventListener('close', onClose);
                    pills.forEach(p => p.removeEventListener('click', onPillClick));
                    okBtn.removeEventListener('click', onOkClick);
                    wrongBtn.removeEventListener('click', onWrongClick);
                    startBtn.removeEventListener('click', onStartTimer);

                    dlg.classList.remove('translate-y-0', 'opacity-100');

                    if (dlg.returnValue === 'ok' && selectedTeam) {
                        resolve({ cancelled: false, team: selectedTeam, delta: correctDelta });
                    } else if (dlg.returnValue === 'wrong' && selectedTeam) {
                        resolve({ cancelled: false, team: selectedTeam, delta: wrongDelta });
                    } else {
                        resolve({ cancelled: true });
                    }
                };

                pills.forEach(p => p.addEventListener('click', onPillClick));
                okBtn.addEventListener('click', onOkClick);
                wrongBtn.addEventListener('click', onWrongClick);
                startBtn.addEventListener('click', onStartTimer);
                dlg.addEventListener('close', onClose, { once: true });

                dlg.showModal();
                setTimeout(() => {
                    dlg.classList.add('translate-y-0', 'opacity-100');
                }, 10);
            });
        }

        // ================================================================
        // BAGIAN 5: INISIALISASI
        // ================================================================

        document.addEventListener('keydown', function (e) {
            if (e.key.toLowerCase() === 'r' && e.ctrlKey) resetBoard();
        });

        window.addEventListener('load', async function () {
            await loadQuestions();
            renderTeams();
            createGrid();

            document.querySelectorAll('.game-button').forEach((button, index) => {
                button.style.opacity = '0';
                button.style.transform = 'translateY(20px)';
                setTimeout(() => {
                    button.style.transition = 'opacity 0.3s ease, transform 0.3s ease';
                    button.style.opacity = '1';
                    button.style.transform = 'translateY(0)';
                }, index * 30);
            });
        });
    </script>

</body>

</html>
